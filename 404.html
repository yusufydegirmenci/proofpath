<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı · FORNEX</title>
<link rel="icon" href="ikon.svg" type="image/svg+xml">
<style>
:root{--bg:#0F1117;--ink:#E5E7EB;--mute:#9CA3AF;--net:#2563EB;--on-net:#fff;--panel:#161A23;--line:#2A3142;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Familjen Grotesk',system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}
.k{box-sizing:border-box;max-width:420px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 22px;display:grid;gap:12px}
h1{margin:0;font-size:26px;line-height:1.15}p{margin:0;color:var(--mute);line-height:1.5}
a{justify-self:start;background:linear-gradient(135deg,#2563EB,#7C3AED);color:var(--on-net);text-decoration:none;font-weight:700;padding:12px 16px;border-radius:10px}
a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style></head><body>
<main><div class="k">
<h1>Bu sayfa bulunamadı</h1>
<p>Adres yanlış yazılmış ya da sayfa taşınmış olabilir. Ana sayfadan devam edebilirsin.</p>
<a id="ana" href="./">Ana sayfaya dön</a>
</div></main>
<script>
/* 404 herhangi bir derinlikte açılabilir: github.io proje sitesinde depo köküne, başka alan adında köke dön. */
(function(){var p=location.pathname.split("/");var k=/\.github\.io$/.test(location.hostname)&&p[1]?"/"+p[1]+"/":"/";document.getElementById("ana").setAttribute("href",k)})();
</script>
</body></html>
