 repo:{name:"security-plus-kanit-dosyasi",folders:["docs/","labs/","scripts/","evidence/"],
  desc:"Hayalî küçük bir şirket için izole lab'da kurulan, Security+ SY0-801 hedeflerine eşlenmiş güvenlik programı: mimari, kriptografi, zafiyet yönetimi, IAM, izleme, olay müdahalesi ve GRC belgeleri.",
  topics:["security","comptia-security-plus","homelab"]},
 steps:[
  ["Kapsam, varlık envanteri ve kontrol haritası","Güvenlik programı, bir evin sigorta dosyası gibi önce 'neyim var?' sorusuyla başlar: korumadığını bilmediğin şeyi koruyamazsın. CIA üçlüsü (Confidentiality = gizlilik, Integrity = bütünlük, Availability = erişilebilirlik) neyi koruduğunu, AAA (Authentication, Authorization, Accounting = kimlik doğrulama, yetkilendirme, kayıt tutma) kimin ne yaptığını anlatır. Kontroller hem kategoriye (teknik, yönetsel, operasyonel, fiziksel) hem türe (önleyici, caydırıcı, tespit edici, düzeltici, telafi edici, yönlendirici) göre sınıflanır; bir binada kilit önleyici, kamera tespit edici, uyarı tabelası caydırıcıdır. Zero Trust (sıfır güven) ise 'içeride olan da kimliğini her seferinde göstersin' fikridir.","Hayalî şirketin 1 sayfalık profilini yaz (15 çalışan, muhasebe verisi, bir web sitesi, uzaktan çalışanlar). Lab'daki her VM'i ve şirketin hayalî cihazlarını bir envanter tablosuna koy: varlık adı, sahibi, konumu, veri sınıfı, yaşam döngüsü durumu (edinme, kullanım, imha). Sonra 12 kontrolü (örn. UFW, Wazuh, yedek, MFA, kapı kartı, politika) kategori × tür tablosuna yerleştir ve eksikleri bir boşluk analizi (gap analysis) listesine yaz.","docs/01-kapsam.md (şirket profili + kapsam), docs/varlik-envanteri.csv, docs/kontrol-matrisi.md (kategori × tür tablosu ve boşluk analizi)","asset inventory = varlık envanteri, control = kontrol, preventive = önleyici, detective = tespit edici, compensating = telafi edici, gap analysis = boşluk analizi, zero trust = sıfır güven","security control categories types technical managerial operational physical preventive detective"],
  ["Kriptografiyi elle uygula: OpenSSL","Hash, bir belgenin parmak izidir: tek harf değişse bile parmak izi tamamen değişir, ama parmak izinden belgeyi geri üretemezsin. Simetrik şifreleme (AES) tek anahtarlı kasa gibidir; asimetrik şifreleme (RSA, ECC) ise herkesin mektup atabildiği ama yalnızca anahtar sahibinin açabildiği posta kutusu gibidir. Dijital imza, özel anahtarla atılan ve açık anahtarla herkesin doğrulayabildiği mühürdür. PKI (açık anahtar altyapısı) ise noter gibidir: sertifika yetkilisi (CA), 'bu açık anahtar gerçekten bu sunucuya ait' diye kefil olur.","Ubuntu VM'inde: (1) 'openssl dgst -sha256 rapor.txt' ile hash al, dosyada bir harf değiştir, tekrar al ve farkı kaydet. (2) 'openssl enc -aes-256-cbc -pbkdf2' ile bir dosyayı şifrele ve geri aç. (3) 'openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048' ile anahtar çifti üret, 'openssl dgst -sha256 -sign' ile imzala, '-verify' ile doğrula; dosyayı değiştirip doğrulamanın başarısız olduğunu göster. (4) Kendi küçük lab CA'nı kur, nginx için CSR (sertifika imzalama isteği) oluştur, CA ile imzala ve tarayıcıda zinciri incele. Özel anahtarları ASLA repoya koyma.","labs/02-kripto/README.md: komutlar, ekran çıktıları (anahtarsız), hash karşılaştırması, imza doğrulama başarılı/başarısız ekranı, sertifika zinciri ekran görüntüsü ve 'hangi durumda hangi kriptografi' tablosu","hash = özet, salt = tuz, symmetric = simetrik, asymmetric = asimetrik, digital signature = dijital imza, certificate authority = sertifika yetkilisi, CSR = sertifika imzalama isteği","openssl tutorial hash sign verify create CA certificate CSR"],
  ["Tehdit aktörleri, vektörler ve tehdit modeli","Tehdit aktörü 'kim', motivasyon 'neden', vektör ise 'hangi kapıdan' sorusunun cevabıdır. Bir mahallede hırsız (finansal kazanç), kıskanç komşu (intikam), eğlenmek için duvar boyayan genç (amatör) farklı yollardan gelir; şirket için de devlet destekli gruplar, organize suç, hacktivistler, içeriden tehdit (insider) ve beceri seviyesi düşük saldırganlar farklıdır. Vektörler e-posta (phishing), SMS (smishing), ses (vishing), USB, açık servisler, tedarik zinciri ve izinsiz BT (shadow IT) gibi yollardır. Bu tablo, savunma bütçesini doğru yere koymanı sağlar.","Şirket için 'tehdit aktörleri' tablosu hazırla: aktör, motivasyon (finansal, casusluk, intikam, ideoloji, kesinti), kaynak/beceri düzeyi, iç/dış, olası hedef varlık. İkinci tabloda en az 10 vektörü listele: vektör, örnek senaryo, ilgili varlık, mevcut kontrol, eksik kontrol. Son olarak web sitesi ve e-posta için tek sayfalık bir veri akış diyagramı çiz ve her ok üzerinde 'burada ne ters gidebilir?' sorusunu cevapla.","docs/03-tehdit-aktorleri.md (iki tablo), docs/diagrams/tehdit-modeli.png (draw.io veri akış diyagramı)","threat actor = tehdit aktörü, motivation = motivasyon, insider threat = içeriden tehdit, threat vector = tehdit vektörü, social engineering = sosyal mühendislik, supply chain = tedarik zinciri, shadow IT = izinsiz BT","Security+ threat actors motivations threat vectors explained"],
  ["Zafiyet taraması ve önceliklendirme","Zafiyet taraması, evin bütün kapı ve pencerelerini tek tek kontrol eden bir bekçi turu gibidir; ama bekçinin listesi, hangi pencerenin önce onarılacağını söylemez, onu sen karar verirsin. CVE bir zafiyetin kimlik numarası, CVSS ise 0-10 arası önem puanıdır; gerçek öncelik ise puan × varlığın değeri × açıklığın erişilebilirliği ile belirlenir. Zafiyet türleri arasında yanlış yapılandırma, eski yazılım, zayıf parola, enjeksiyon, bellek taşması ve sıfırıncı gün (zero-day) bulunur. Tarama sonrası yanlış alarmları (false positive) eleyip düzeltir ve yeniden tararsın.","YALNIZCA kendi VM'lerinde: Greenbone Community Edition (OpenVAS) kur ya da 'nmap -sV --script vuln' ile Ubuntu ve bilerek zafiyetli bir test VM'ini (örn. Metasploitable 2) tara. Bulguları bir tabloya koy: bulgu, CVE, CVSS, varlık kritikliği, internetten erişilebilir mi, öncelik (P1-P4), düzeltme, kabul/aktarım kararı. En öncelikli 3 bulguyu düzelt (yama, servisi kapat, yapılandırma), yeniden tara ve önce/sonra karşılaştırması yap. Lab ağını internete açma.","labs/04-zafiyet/README.md, evidence/tarama-oncesi-sonrasi.png, docs/zafiyet-oncelik-tablosu.md (bulgu, CVSS, öncelik, karar, durum)","vulnerability scan = zafiyet taraması, CVE = ortak zafiyet kimliği, CVSS = zafiyet önem puanı, false positive = yanlış alarm, patch = yama, rescan = yeniden tarama, attack surface = saldırı yüzeyi","Greenbone OpenVAS community edition docker scan own lab vulnerability prioritization CVSS"],
  ["Mimari: değişiklik talebiyle segmentasyon ve firewall","Ağ segmentasyonu, bir binayı yangın kapılarıyla bölmeye benzer: bir odada yangın çıkarsa bütün bina yanmaz. Kullanıcı ağı, sunucu ağı (DMZ) ve yönetim ağı ayrı tutulur; aralarındaki geçişi güvenlik duvarı kuralları belirler ve varsayılan kural 'reddet'tir. Kurulu bir sistemde değişiklik, ameliyat gibi plansız yapılmaz: değişiklik talebi (change request), etki analizi, onay, bakım penceresi, test ve geri dönüş planı (backout plan) gerekir. Mimari modeller (şirket içi, bulut, sanallaştırma, konteyner, IoT) her biri farklı sorumluluk ve saldırı yüzeyi getirir.","Önce docs/05-degisiklik-talebi.md yaz: amaç, etkilenen sistemler, risk, onaylayan, bakım saati, test adımları, geri dönüş planı. Sonra VirtualBox'ta OPNsense VM'i kur ve üç iç ağ oluştur: LAN (kullanıcı), DMZ (web sunucusu), MGMT (yönetim). Kuralları yaz: LAN→DMZ yalnızca 80/443, MGMT→hepsi SSH, DMZ→LAN yasak, geri kalan her şey reddedilir. Kali'den izin verilen ve yasak trafiği dene, logları kaydet. Ubuntu'da sertleştirme yap: gereksiz servisleri kapat, otomatik güncelleme aç, SSH yalnızca anahtarla. Son olarak şirket içi / bulut (IaaS, PaaS, SaaS) / konteyner için 'paylaşılan sorumluluk ve risk' karşılaştırma tablosu ekle.","docs/05-degisiklik-talebi.md, docs/diagrams/ag-mimarisi.png, labs/05-firewall/kurallar.md (kural tablosu + izinli/yasak test sonuçları), docs/mimari-modeller-tablosu.md","segmentation = bölümlendirme, DMZ = arındırılmış bölge, firewall rule = güvenlik duvarı kuralı, implicit deny = varsayılan reddetme, change request = değişiklik talebi, backout plan = geri dönüş planı, hardening = sertleştirme","OPNsense virtualbox lab LAN DMZ firewall rules change management process"],
  ["Veri koruma, 3-2-1 yedek ve geri yükleme testi","Veri koruma, değerli eşyaları sınıflayıp her birine uygun kasa seçmek gibidir: herkese açık broşür ile müşteri maaş listesi aynı yerde durmaz. Veri durumları üçe ayrılır: durağan (at rest), aktarımda (in transit), kullanımda (in use); her biri için şifreleme, maskeleme, tokenizasyon gibi farklı yöntemler var. 3-2-1 kuralı: 3 kopya, 2 farklı ortam, 1 tanesi başka yerde. RPO 'ne kadar veri kaybını göze alırım', RTO 'ne kadar sürede ayağa kalkmalıyım' sorusudur; yedek, geri yüklenebildiği kanıtlanana kadar yalnızca bir umuttur.","Veri sınıflandırma tablosu yaz (herkese açık, iç, gizli, kısıtlı) ve her sınıf için saklama, şifreleme, paylaşım kuralı belirle. restic ile Ubuntu'daki örnek 'muhasebe' klasörünü şifreli olarak iki hedefe yedekle (ikinci sanal disk ve ayrı bir VM veya harici disk), üçüncü kopyanın nerede duracağını planla. Zamanlanmış yedek kur (cron). Sonra klasörü sil, geri yükle, hash'leri karşılaştırarak bütünlüğü kanıtla ve geçen süreyi ölçüp RTO hedefinle karşılaştır.","labs/06-yedek/README.md (3-2-1 diyagramı, komutlar, geri yükleme süresi), evidence/geri-yukleme-hash-karsilastirma.png, docs/veri-siniflandirma.md (sınıf, RPO/RTO hedefleri)","data classification = veri sınıflandırma, data at rest = durağan veri, data in transit = aktarımdaki veri, tokenization = belirteçleme, backup = yedek, restore = geri yükleme, RPO = kabul edilebilir veri kaybı süresi, RTO = kurtarma süresi hedefi","restic backup restore tutorial 3-2-1 rule RPO RTO explained"],
  ["Kimlik ve erişim: en az yetki, MFA, RBAC","Kimlik yönetimi, bir otelin kart sistemi gibidir: misafir yalnızca kendi odasını, temizlik görevlisi kendi katını, müdür ise her yeri açar; buna rol tabanlı erişim (RBAC) denir. En az yetki (least privilege), işini yapacak kadar anahtar vermektir; fazlası çalınırsa daha çok kapı açılır. MFA (çok faktörlü kimlik doğrulama) bildiğin bir şey (parola), sahip olduğun bir şey (telefon) ve olduğun bir şeyi (parmak izi) birleştirir. İşe girişte hesap açmak, görev değişince yetkiyi güncellemek ve ayrılınca kapatmak (provisioning/deprovisioning) en sık atlanan adımdır.","Ubuntu'da üç grup oluştur: muhasebe, it-destek, yonetim. Her gruba farklı klasör izinleri ver ve sudo yetkisini yalnızca it-destek'e sınırlı komutlarla tanımla. Her rol için bir test kullanıcısıyla 'yapabildi / yapamadı' denemelerini kaydet. libpam-google-authenticator ile SSH için TOTP tabanlı MFA kur (önce ayrı bir oturum açık tutarak kendini dışarıda bırakma). Son olarak bir çalışanın işten ayrılma senaryosunu uygula: hesabı kilitle, anahtarlarını kaldır, erişimin bittiğini kanıtla.","labs/07-iam/README.md: RBAC matrisi (rol × kaynak × izin), deney sonuç tablosu, MFA giriş ekranı görüntüsü (kod karartılmış), ayrılma (offboarding) kontrol listesi","least privilege = en az yetki, RBAC = rol tabanlı erişim kontrolü, MFA = çok faktörlü kimlik doğrulama, TOTP = zamana dayalı tek kullanımlık parola, provisioning = hesap açma, offboarding = işten ayrılış süreci","ubuntu ssh google authenticator pam TOTP RBAC linux groups least privilege"],
  ["Log ve IoC analizi, izleme ve uyarı","IoC (ihlal göstergesi), olay yerindeki ayak izi gibidir: gece 03:00'te başarısız giriş fırtınası, bilinmeyen bir IP'den yönetici girişi, beklenmedik yeni bir servis ya da hesap. İzleme sistemi (SIEM) bu izleri toplar, ilişkilendirir ve eşik aşılınca uyarı verir; ama ayarlanmamış bir alarm, sürekli öten bir araba alarmı gibi görmezden gelinir. Bu yüzden uyarıyı ayarlamak (tuning), saatleri NTP ile eşitlemek ve logları yeterince uzun saklamak önemlidir.","sec3'teki Wazuh'u bu lab'a bağla (Ubuntu, OPNsense syslog). Kendi lab'ında iz bırakan olaylar üret: Kali'den SSH kaba kuvvet denemesi, yasaklı porta erişim, yeni bir kullanıcı ekleme, şüpheli cron görevi. Sonra her olayın izini log'da bul ve bir IoC tablosuna yaz: zaman, kaynak, log satırı, gösterge türü, ilgili ATT&CK tekniği, yapılacak işlem. En az bir uyarıyı yanlış alarm ürettiği için yeniden ayarla ve önce/sonra uyarı sayısını kaydet.","labs/08-loglar/ioc-tablosu.md, evidence/wazuh-uyari.png, docs/izleme-plani.md (hangi log, ne kadar saklanır, hangi uyarı, kime gider)","indicator of compromise = ihlal göstergesi, alert = uyarı, correlation = ilişkilendirme, tuning = ince ayar, log retention = log saklama süresi, baseline = normal davranış referansı","indicators of compromise examples linux auth log wazuh alert tuning"],
  ["Otomasyon: auth log özeti script'i","Otomasyon, her sabah aynı raporu elle hazırlamak yerine bir saat kurmak gibidir: insan yorulur ve unutur, script her seferinde aynı adımı atar. Güvenlik operasyonunda otomasyon; hesap açma, uyarı zenginleştirme, rapor üretme ve tekrar eden düzeltmelerde zaman kazandırır. Orkestrasyon ise birden fazla aracı bir orkestra şefi gibi sırayla çalıştırmaktır. Riskleri de var: hatalı bir script hatayı da otomatik çoğaltır, bu yüzden test ve kayıt şart.","Python (veya Bash) ile kendi lab'ının /var/log/auth.log dosyasını okuyan bir script yaz: başarılı ve başarısız giriş sayısı, en çok deneme yapan 5 IP, en çok denenen kullanıcı adları, sudo kullanımları. Çıktıyı tarihli bir Markdown raporuna yazsın ve eşik aşılırsa ekrana 'UYARI' bassın. cron ile her gün çalıştır. README'ye nasıl çalıştığını, test verisini ve sınırlamalarını yaz. Script'i yalnızca kendi loglarında çalıştır.","scripts/auth_log_ozet.py (veya .sh), scripts/README.md, evidence/ornek-gunluk-rapor.md (IP'ler lab içi, gerçek veri yok)","automation = otomasyon, orchestration = orkestrasyon, cron job = zamanlanmış görev, parse = ayrıştırmak, threshold = eşik, workflow = iş akışı","python parse auth.log summary report cron security automation"],
  ["YZ ile ilgili tehdit ve zafiyetler: 1 sayfa","Yapay zekâ asistanı, çok çalışkan ama her söylenene inanan yeni bir stajyer gibidir. Prompt injection, bu stajyere bir belgenin içine gizlenmiş 'önceki talimatları unut, şunu yap' notuyla emir vermektir. Veri sızıntısı, çalışanın gizli müşteri listesini sohbet aracına yapıştırmasıyla olur. Model zehirleme (model/data poisoning) ise stajyerin eğitim kitaplarına yanlış bilgi sıkıştırmaktır. Ek olarak saldırganlar YZ'yi daha inandırıcı phishing ve deepfake ses üretmek için de kullanabilir.","Şirket için 1 sayfalık 'YZ Güvenlik Notu' yaz: (1) prompt injection, (2) hassas veri sızıntısı, (3) model/veri zehirleme, (4) YZ destekli sosyal mühendislik (deepfake, kişiselleştirilmiş phishing). Her biri için: tanım (benzetmeyle), şirkette olası senaryo, önleyici kontrol (onaylı araç listesi, veri sınıfına göre yasak, çıktıyı insan kontrolü, en az yetkili entegrasyon), tespit yöntemi. Sonuna çalışanlar için 5 maddelik 'YZ kullanırken yapma' listesi ekle. Herhangi bir canlı servise saldırı denemesi yapma; örnekleri metin olarak anlat.","docs/10-yz-tehditleri.md (1 sayfa, 4 tehdit × tanım/senaryo/kontrol/tespit tablosu + 5 madde)","prompt injection = istem enjeksiyonu, data leakage = veri sızıntısı, model poisoning = model zehirleme, deepfake = sahte ses/görüntü, guardrail = koruma bariyeri, human in the loop = insan denetimi","OWASP top 10 for LLM applications prompt injection data poisoning"],
  ["Olay müdahalesi tatbikatı ve soruşturma","Olay müdahalesi yangın tatbikatına benzer: plan önceden yazılır, kimin hangi kapıdan çıkacağı bellidir, tatbikattan sonra eksikler konuşulur. Klasik aşamalar: hazırlık, tespit, analiz, sınırlama, temizleme, kurtarma ve ders çıkarma. Soruşturmada kanıt olay yeri gibi korunur: önce en uçucu veri (RAM, ağ bağlantıları) toplanır (order of volatility), kanıtın hash'i alınır ve kimin elinden geçtiği bir zincir formuna (chain of custody) yazılır. Yasal saklama (legal hold), ilgili verinin silinmesini durdurmaktır.","Senaryo: 'muhasebe' kullanıcısının hesabıyla gece yarısı yabancı bir IP'den giriş yapıldı ve şüpheli bir cron görevi eklendi. Bunu lab'ında kendin canlandır (Kali → Ubuntu). Sonra müdahale et: oturumu kapat, hesabı kilitle, firewall'da IP'yi engelle, 'ss', 'ps', 'last' çıktıları ve ilgili log dosyalarını topla, her kanıt dosyasının SHA-256 hash'ini al, zincir formunu doldur, cron görevini kaldır, sistemi doğrula. Dakika dakika bir zaman çizelgesi ve 1 sayfalık 'ders çıkarma' raporu yaz.","docs/11-olay-raporu.md (zaman çizelgesi tablosu + ders çıkarma), evidence/kanit-hashleri.txt, docs/zincir-formu.md (chain of custody şablonu, doldurulmuş)","incident response = olay müdahalesi, containment = sınırlama, eradication = temizleme, recovery = kurtarma, lessons learned = çıkarılan dersler, chain of custody = kanıt zinciri, order of volatility = uçuculuk sırası, legal hold = yasal saklama","incident response tabletop exercise timeline chain of custody order of volatility linux"],
  ["Risk kayıt defteri ve üçüncü taraf riski","Risk, 'ne kadar olası' ile 'olursa ne kadar acıtır' sorularının çarpımıdır; şemsiye almayı yağmur ihtimaline ve ıslanmanın bedeline bakarak seçmen gibi. Her risk için dört yol vardır: azalt (kontrol ekle), aktar (sigorta, sözleşme), kaçın (işi yapma), kabul et (bilinçli olarak üstlen). Risk iştahı (risk appetite), şirketin ne kadar riski göze aldığıdır. Üçüncü taraflar (muhasebe yazılımı sağlayıcısı, bulut, kargo) senin evine anahtar verdiğin komşulardır; anahtarı vermeden önce güvenilirliklerini sorgularsın.","Risk kayıt defteri hazırla (en az 10 risk): risk, varlık, tehdit, zafiyet, olasılık (1-5), etki (1-5), puan (olasılık × etki), sahibi, karar (azalt/aktar/kaçın/kabul), kontrol, hedef tarih, kalan risk. Puanları 5×5 ısı haritasında göster. Ayrıca hayalî bir bulut muhasebe yazılımı sağlayıcısı için 15 soruluk üçüncü taraf güvenlik anketi yaz (veri nerede saklanır, şifreleme, MFA, olay bildirim süresi, alt yükleniciler, denetim raporu, sözleşmede güvenlik maddeleri) ve örnek cevaplara göre bir risk kararı ver.","docs/12-risk-kayit-defteri.csv, docs/diagrams/risk-isi-haritasi.png, docs/ucuncu-taraf-anketi.md (sorular + değerlendirme ve karar)","risk register = risk kayıt defteri, likelihood = olasılık, impact = etki, risk appetite = risk iştahı, mitigate = azaltmak, transfer = aktarmak, residual risk = kalan risk, vendor assessment = tedarikçi değerlendirmesi","risk register template likelihood impact 5x5 heat map vendor security questionnaire"],
  ["Politika, farkındalık eğitimi ve denetim listesi","Politika, bir apartmanın yönetim planı gibidir: herkesin uyacağı kuralı yazar; standart ve prosedür ise bu kuralın nasıl uygulanacağını adım adım anlatır. Uyum (compliance), bu kurallara ve yasal yükümlülüklere (Türkiye'de KVKK, AB'de GDPR gibi) uyduğunu kanıtlayabilmektir. Denetim, bağımsız bir gözün 'yazdığın gibi mi yapıyorsun?' diye bakmasıdır. Farkındalık eğitimi ise insanı en zayıf halka olmaktan çıkarıp ilk alarm noktasına çevirir.","(1) 1-2 sayfalık Kabul Edilebilir Kullanım Politikası (AUP) yaz: parola, cihaz, e-posta, YZ araçları, uzaktan çalışma, ihlal bildirimi. (2) 10 dakikalık farkındalık mini eğitimi hazırla (5-6 slayt veya tek sayfa): phishing nasıl tanınır, şüpheli durumda kime bildirilir; sonuna 5 soruluk mini test ekle ve bir arkadaşına uygulatıp sonucu (isimsiz) kaydet. Gerçek kişilere habersiz phishing denemesi yapma. (3) 25 maddelik denetim kontrol listesi hazırla: her madde için kontrol, kanıt dosyası (bu repodaki), durum (uyumlu/kısmi/uyumsuz), bulgu. Listeyi kendi repona uygulayıp bir öz değerlendirme raporu çıkar.","docs/13-kabul-edilebilir-kullanim-politikasi.md, docs/farkindalik-egitimi.pdf veya .md (mini test ve sonuç özeti dahil), docs/denetim-kontrol-listesi.md (25 madde, kanıt bağlantıları, öz değerlendirme sonucu)","policy = politika, standard = standart, procedure = prosedür, compliance = uyum, acceptable use policy = kabul edilebilir kullanım politikası, security awareness = güvenlik farkındalığı, audit = denetim, attestation = beyan/onay","acceptable use policy template security awareness training phishing audit checklist small business"],
  ["Hedef bazlı sınama ve sınav öncesi kontrol","Sınava girmek, uzun bir yolculuktan önce arabanın her parçasını kontrol etmek gibidir: lastik iyi ama fren zayıfsa yola çıkmazsın. Bu projedeki eşleme tablosu (maps), her Security+ hedefinin hangi adımda çalışıldığını gösterir; şimdi her hedefi ayrı ayrı sınarsın. Security+ SY0-801, 17 Kasım 2026'da SY0-701'in yerine gelen yeni sürümdür; resmî hedeflere göre 90 dakika, en fazla 90 soru ve 100-900 ölçeğinde 750 geçme puanı vardır. Fiyat, kayıt kuralları ve eski sürümün emeklilik tarihi değişebileceği için son sözü her zaman CompTIA'nın resmî sayfası söyler.","(1) Proofpath soru bankasındaki [sec] etiketli soruları çöz ve yanlışlarını hedef numarasına (1.1…5.6) göre bir tabloya yaz. (2) Her hedef için kendine 1-5 arası güven puanı ver; 3'ün altındakiler için ilgili adımı tekrar aç ve kanıt dosyanı yeniden oku. (3) CompTIA'nın sitesinden SY0-801 resmî hedef PDF'ini indir ve bu repodaki eşleme tablosuyla madde madde karşılaştır. (4) Rezervasyondan önce CompTIA sayfasında güncel fiyatı, sınav formatını, online veya test merkezi seçeneklerini ve SY0-701'in emeklilik tarihini kontrol et; hangi sürüme gireceğine bu bilgiye göre karar ver. (5) Repoyu README ile tamamla ve İngilizce bir LinkedIn özeti yaz.","docs/14-hedef-oz-degerlendirme.md (hedef × QB sonucu × güven puanı × tekrar planı), README.md (proje özeti, mimari diyagram, SY0-801 eşleme tablosu, tüm kanıtlara bağlantı), docs/sinav-oncesi-kontrol.md","exam objectives = sınav hedefleri, self-assessment = öz değerlendirme, practice question = deneme sorusu, passing score = geçme puanı, retirement date = emeklilik tarihi, voucher = sınav kuponu","CompTIA Security+ SY0-801 exam objectives PDF"]
 ]};

var PROJ_QA4={id:"qa4",lv:3,cap:true,title:"Kapston: Gerçek Bir Web Uygulamasında Uçtan Uca Test Süreci",weeks:8,tools:"Docker, OWASP Juice Shop (kendi bilgisayarında), Google Sheets veya Excel, Git ve GitHub, Playwright (TypeScript), GitHub Actions",
  cert:"ISTQB Certified Tester Foundation Level (CTFL v4.0)",
  why:"qa1-qa3'te parçaları tek tek öğrendin. Bu kapstonda hepsini tek bir gerçek uygulamada, baştan sona bir test sürecine dönüştürürsün: planlar, inceler, tasarlar, koşar, raporlar ve otomatikleştirirsin. Bunu gerçekten bitiren kişi ISTQB CTFL v4.0 müfredatının altı bölümünü elleriyle uygulamış olur.",
  outcome:["Test ilkelerini, test sürecini ve hata-kusur-başarısızlık ayrımını gerçek bir uygulamada kullanırsın","Gereksinimleri statik olarak inceler, dört kara kutu tekniği ve keşif testiyle test senaryoları tasarlarsın","Risk tabanlı test planı, tahmin, kusur raporları, izlenebilirlik matrisi ve test özet raporu üretirsin","Playwright testlerini GitHub Actions'ta koşturur, otomasyonun fayda ve risklerini savunabilirsin"],
  pitch:"I ran a complete, risk-based test process on a real open-source web application, from requirement reviews and test design to defect reports, Playwright automation in CI and a final test summary report.",
  maps:[
   ["1. Test temelleri","Testin amacı, test ile hata ayıklama farkı, yedi test ilkesi, hata-kusur-başarısızlık ve kök neden, test süreci faaliyetleri, testware, izlenebilirlik, test rolleri ve bağımsızlık","adım 1, 2, 3, 14"],
   ["2. Yazılım yaşam döngüsünde test","SDLC modelleri ve testin yeri, shift-left, test seviyeleri, test türleri, onaylama ve regresyon testi, bakım testi","adım 4, 5, 14"],
   ["3. Statik test","Gözden geçirme süreci, roller ve gözden geçirme türleri, gereksinim ve kullanıcı hikâyesi incelemesi, statik testin erken geri bildirim faydası","adım 6, 14"],
   ["4. Test analizi ve tasarımı","Eşdeğerlik bölümleme, sınır değer analizi, karar tablosu, durum geçişi, beyaz kutu kapsamı farkındalığı, hata tahmini, keşif testi, kontrol listesi, kabul kriterleri","adım 7, 8, 9, 14"],
   ["5. Test faaliyetlerinin yönetimi","Test planı, giriş ve çıkış kriterleri, tahmin teknikleri, önceliklendirme, test piramidi ve test çeyrekleri, risk yönetimi, izleme ve kontrol, raporlama, konfigürasyon yönetimi, kusur yönetimi","adım 10, 11, 13, 14"],
   ["6. Test araçları","Test araçlarının türleri, test otomasyonunun faydaları ve riskleri","adım 12, 14"]
  ],
  repo:{name:"ctfl-kanit-dosyasi",folders:["test-plan/","test-cases/","automation/","reports/"],desc:"An end-to-end, ISTQB CTFL v4.0 aligned test process on a locally hosted open-source web app: test plan, test design, defect reports, traceability, Playwright + CI and test summary report.",topics:["qa","istqb","playwright","test-automation"]},
  steps:[
  ["Kapstonu başlat: uygulamayı kur, test ilkelerini tanı","Test, bir arabayı satmadan önce muayeneden geçirmek gibidir: amaç arıza bulmak, riski azaltmak ve “bu araba yola hazır mı?” sorusuna kanıtla cevap vermektir. Test (testing) arızayı bulur; hata ayıklama (debugging) ise geliştiricinin arızanın sebebini bulup onarmasıdır. Yedi test ilkesi yol haritandır: test kusurların varlığını gösterir, yokluğunu kanıtlayamaz; her şeyi test etmek imkânsızdır; erken test zaman ve para kazandırır; kusurlar kümelenir; aynı testler zamanla aşınır (yeni kusur bulamaz olur); test bağlama göre değişir; kusur yokluğu yanılgısı (kusursuz ama kimsenin işine yaramayan ürün de başarısızdır).","Docker kur ve OWASP Juice Shop'u yalnızca kendi bilgisayarında çalıştır (docker run -p 3000:3000 bkimminich/juice-shop, sonra tarayıcıda localhost:3000). Bu uygulama eğitim için bilerek kusurlu yapılmış açık kaynak bir mağazadır; başka birinin canlı sitesinde çalışma. ctfl-kanit-dosyasi reposunu dört klasörle aç. README'ye uygulamanın sürümünü, test ortamını ve yedi ilkenin her birini bu uygulamadan bir örnekle yaz.","Çalışan uygulama ekran görüntüsü ve yedi ilkeli README","testing = test etme, debugging = hata ayıklama, test object = test nesnesi, test environment = test ortamı, principle = ilke","ISTQB CTFL v4.0 seven testing principles explained"],
  ["Hata, kusur, başarısızlık ve kök neden","Bir aşçı tarifi okurken tuz yerine şeker koymaya karar verir: bu insan hatasıdır (error). Yemeğin içindeki şeker kusurdur (defect, bug). Müşteri tadınca yüzünü buruşturur: bu başarısızlıktır (failure). Kök neden (root cause) ise “tuz ve şeker kavanozları aynı ve etiketsiz” gibi asıl sebeptir. Her kusur başarısızlığa yol açmaz; o kod hiç çalışmazsa kusur sessiz kalır. Başarısızlık bazen kusurdan değil, ortam koşullarından da doğabilir.","Juice Shop'ta 30 dakika gezin ve tuhaf davranan 5 şey not et. Her biri için dört sütunlu bir tablo doldur: gözlenen başarısızlık, olası kusur, olası insan hatası, olası kök neden. Emin olmadığın hücreye “tahmin” yaz; kaynak kodu görmeden kesin konuşma.","Hata-kusur-başarısızlık tablosu (reports/ klasöründe)","error = hata, defect = kusur, failure = başarısızlık, root cause = kök neden, false positive = yanlış alarm","ISTQB error defect failure root cause difference"],
  ["Test süreci ve izlenebilirlik iskeleti","Test süreci bir düğün organizasyonuna benzer: planlama, izleme ve kontrol, analiz (neyi test edeceğiz), tasarım (nasıl test edeceğiz), uygulama (malzemeleri hazırlama), yürütme (testleri koşma) ve tamamlama (dersleri çıkarma). Bu faaliyetler sırayla da, iç içe de yapılabilir. Her faaliyetin çıktısına testware (test ürünleri) denir. İzlenebilirlik (traceability), düğün listesindeki her misafirin bir masaya bağlı olması gibi, her gereksinimin bir teste, her testin bir sonuca ve kusura bağlı olmasıdır.","Juice Shop'tan 8 test temeli (test basis) maddesi seç: kayıt, giriş, ürün arama, sepete ekleme, sepet miktarı, ödeme, şifre değiştirme, geri bildirim formu. Bunları gereksinim gibi kısa cümlelerle yaz (R1-R8). İzlenebilirlik matrisini aç: sütunlar R no, gereksinim, test senaryosu no, sonuç, kusur no. Ayrıca yedi süreç faaliyetinin her biri için bu projede hangi dosyayı üreteceğini listele.","test-plan/requirements.md ve boş izlenebilirlik matrisi","test basis = test temeli, testware = test ürünleri, traceability matrix = izlenebilirlik matrisi, test condition = test koşulu, test completion = test tamamlama","ISTQB test process activities testware traceability"],
  ["Yaşam döngüsünde test: modeller ve test seviyeleri","Ev inşaatında elektrik tesisatını duvar kapanmadan kontrol etmek, sonradan duvarı kırmaktan ucuzdur; buna shift-left (testi sola, yani erkene çekme) denir. Şelale (waterfall) modelinde aşamalar sırayla gelir; çevik (agile) modelde küçük parçalar sık teslim edilir ve test her yinelemenin içindedir. Test seviyeleri, evi tuğladan mahalleye kadar kontrol etmek gibidir: bileşen (component), bileşen entegrasyonu, sistem, sistem entegrasyonu ve kabul (acceptance) testi.","Juice Shop için bir sayfalık not yaz: bu uygulama şelaleyle geliştirilseydi ve çevikle geliştirilseydi test ne zaman ve kim tarafından yapılırdı? Ardından beş test seviyesinin her biri için bu uygulamadan bir örnek test fikri yaz ve hangisini senin (kara kutu, arayüzden) yapabileceğini, hangisinin geliştirici gerektirdiğini işaretle.","SDLC karşılaştırma notu ve seviye tablosu","SDLC = yazılım geliştirme yaşam döngüsü, shift-left = erken test, component testing = bileşen testi, system testing = sistem testi, acceptance testing = kabul testi","ISTQB test levels component integration system acceptance shift left"],
  ["Test türleri: fonksiyonel, fonksiyonel olmayan, onaylama ve regresyon","Bir telefonu düşün: arama yapabiliyor mu sorusu fonksiyonel (functional) testtir; ne kadar hızlı, ne kadar güvenli, kullanması rahat mı soruları fonksiyonel olmayan (non-functional) testtir. Kara kutu (black-box) testte içini görmeden davranışa bakarsın, beyaz kutu (white-box) testte iç yapıya göre test edersin. Tamirciden gelen arabada önce şikâyet edilen sorunun gerçekten gittiğini kontrol edersin: onaylama testi (confirmation testing). Sonra tamir başka bir şeyi bozdu mu diye bakarsın: regresyon testi (regression testing). Canlıdaki bir sistemde yapılan değişikliklerin testine bakım testi (maintenance testing) denir.","8 gereksinimin her biri için hangi test türlerinin gerektiğini işaretleyen bir tablo hazırla (fonksiyonel, kullanılabilirlik, performans, güvenlik farkındalığı). Juice Shop'un Docker imajında farklı bir sürüm etiketiyle çalıştırdığını varsay: 10 testlik bir regresyon seti seç ve neden bu 10'u seçtiğini açıkla. Onaylama ile regresyon farkını kendi cümlelerinle 3 satırda yaz.","Test türleri tablosu ve regresyon seti listesi","functional = fonksiyonel, non-functional = fonksiyonel olmayan, confirmation testing = onaylama testi, regression testing = regresyon testi, maintenance testing = bakım testi","ISTQB confirmation testing vs regression testing test types"],
  ["Statik test: gereksinimleri çalıştırmadan incele","Statik test, binayı inşa etmeden önce mimari çizimi okumak gibidir: hiçbir şey çalıştırmadan belgedeki çelişki, eksik ve belirsizliği yakalarsın. Gözden geçirme (review) türleri gayriresmîden resmîye uzanır: gayriresmî gözden geçirme, walkthrough (yazarın anlattığı tur), teknik gözden geçirme ve en resmî olan inspection (denetim). Roller vardır: yazar, yönetici, moderatör (facilitator, toplantıyı yöneten), kayıt tutucu, gözden geçiren ve gözden geçirme lideri. Statik test kusuru başarısızlığa dönüşmeden, en ucuz anda bulur.","R1-R8 gereksinimlerini bir kontrol listesiyle incele: ölçülebilir mi, test edilebilir mi, belirsiz kelime var mı (“hızlı”, “kullanıcı dostu”), eksik hata mesajı var mı. En az 8 bulgu yaz ve her birine önem derecesi ver. Bir arkadaşınla ya da kendinle 20 dakikalık bir walkthrough yap; rolleri ve kararları bir toplantı notuna geçir. Belirsiz gereksinimleri yeniden yaz.","Gereksinim inceleme raporu ve düzeltilmiş gereksinimler","static testing = statik test, review = gözden geçirme, walkthrough = yazar turu, inspection = denetim, ambiguity = belirsizlik","ISTQB static testing review types roles requirements review checklist"],
  ["Tasarım tekniği 1: eşdeğerlik bölümleme ve sınır değer analizi","Asansörde “en fazla 8 kişi” yazıyorsa 1'den 8'e kadar her sayıyı tek tek denemezsin; aynı davranacağını düşündüğün değerleri bir grup (bölüm) yaparsın: geçerli bölüm 1-8, geçersiz bölümler 0 ve 9+. Bu eşdeğerlik bölümleme (equivalence partitioning) tekniğidir. Kusurlar çoğunlukla kenarlarda saklanır; sınır değer analizi (boundary value analysis) bu yüzden 0, 1, 8, 9 gibi sınırları dener. CTFL v4.0'da iki değerli ve üç değerli sınır değer yaklaşımı vardır; farkını müfredattan oku.","Juice Shop'ta sayı ya da uzunluk sınırı olan iki alan seç (örneğin sepetteki ürün miktarı, kayıt formundaki şifre alanı). Kuralı uygulamada gözlemleyerek ya da hata mesajından çıkararak yaz; kuralı bilmiyorsan “varsayım” diye belirt. Her alan için bölümleri ve sınır değerlerini tablo yap, en az 12 test senaryosu türet, koş ve sonucu matrise işle. Her senaryoya bir kapsam hedefi yaz (hangi bölüm, hangi sınır).","test-cases/ep-bva.xlsx ve güncellenmiş izlenebilirlik matrisi","equivalence partitioning = eşdeğerlik bölümleme, boundary value analysis = sınır değer analizi, valid partition = geçerli bölüm, invalid partition = geçersiz bölüm, coverage = kapsam","ISTQB equivalence partitioning boundary value analysis 2-value 3-value examples"],
  ["Tasarım tekniği 2: karar tablosu ve durum geçişi","Karar tablosu (decision table), bir indirim kuralını bir tablo gibi düşünmektir: “üye mi? kupon var mı? sepet tutarı yeterli mi?” koşullarının her birleşimi bir sütundur ve her sütunun bir sonucu vardır. Böylece unutulan birleşim kalmaz. Durum geçişi (state transition) ise trafik ışığına benzer: kırmızıdan yeşile doğrudan geçilemez, her durumdan hangi olayla nereye gidileceği bellidir. Testte hem geçerli geçişleri hem de olmaması gereken geçersiz geçişleri denersin.","Giriş ve sepet akışı için bir karar tablosu kur (örneğin: kullanıcı girişli mi, sepette ürün var mı, adres kayıtlı mı; sonuç: ödeme adımına geçebilir mi). Uygulamada gözlemlediğin davranışa göre tabloyu doldur ve her sütunu bir test yap. Ardından kullanıcı oturumu için bir durum geçiş diyagramı çiz (çıkış yapmış, giriş yapmış, sepette ürün var, ödeme ekranında gibi durumlar). Her geçerli geçişi en az bir kez kapsayan testler ve en az 3 geçersiz geçiş denemesi yaz.","Karar tablosu, durum diyagramı (resim) ve türetilmiş testler","decision table = karar tablosu, condition = koşul, action = eylem, state transition = durum geçişi, invalid transition = geçersiz geçiş","ISTQB decision table testing state transition testing examples"],
  ["Deneyim tabanlı test, beyaz kutu farkındalığı ve kabul kriterleri","Deneyimli bir tamirci motor sesinden sorunu tahmin eder; buna hata tahmini (error guessing) denir. Keşif testi (exploratory testing), bir şehri haritayla değil merakla gezmek gibidir ama defter tutarak: süresi belli bir oturumda bir hedef (charter) belirler, öğrenirken test eder, gördüğünü yazarsın. Kontrol listesi tabanlı test, pilotun kalkış öncesi listesine benzer. Beyaz kutu tarafında ifade kapsamı (statement coverage) ve dal kapsamı (branch coverage) kodun ne kadarının çalıştığını ölçer; bunları kavram düzeyinde bilmen gerekir. İşbirliği tabanlı yaklaşımda ekip kullanıcı hikâyesini birlikte yazar ve kabul kriterleri (acceptance criteria) üzerinde anlaşır.","İki keşif testi oturumu yap, her biri 45 dakika, her biri için bir charter yaz (örneğin: “Arama kutusunu beklenmedik girdilerle keşfet”). Notları, soruları ve bulguları oturum raporuna geçir. Bir hata tahmini listesi (boş alan, çok uzun metin, özel karakter, çift tıklama, geri tuşu) hazırla ve uygula. Ödeme akışı için Given-When-Then biçiminde 5 kabul kriteri yaz. Kısa bir if-else fonksiyonu üzerinde ifade ve dal kapsamını kâğıtta hesapla.","İki keşif oturumu raporu, hata tahmini listesi, kabul kriterleri","exploratory testing = keşif testi, charter = oturum hedefi, error guessing = hata tahmini, statement coverage = ifade kapsamı, acceptance criteria = kabul kriterleri","exploratory testing session charter template ISTQB experience based techniques"],
  ["Risk tabanlı test planı","Hava durumuna göre şemsiye almak gibi: her şeye eşit hazırlanamazsın, olasılığı ve etkisi yüksek olana öncelik verirsin. Risk seviyesi olasılık (likelihood) ile etkinin (impact) birleşimidir. Proje riskleri (gecikme, eksik ortam) ile ürün riskleri (ödeme hatalı hesaplanıyor) ayrı tutulur. Test planı; kapsam, kapsam dışı, yaklaşım, riskler, giriş kriterleri (testi başlatmak için gereken hazırlık), çıkış kriterleri (“yeterince test ettik” demek için şartlar), roller ve takvimi anlatır. Test piramidi çok sayıda alt seviye ve az sayıda uçtan uca test önerir; test çeyrekleri (testing quadrants) test türlerini amaçlarına göre gruplar.","test-plan/ klasörüne 2-3 sayfalık test planı yaz. 8 gereksinim için ürün riski tablosu yap: olasılık ve etkiyi 1-3 arası puanla, risk seviyesine göre test derinliği ve tekniği seç. En az 3 proje riski ve önlemini yaz. Giriş ve çıkış kriterlerini ölçülebilir yaz (örneğin: yüksek riskli tüm senaryolar koşuldu, açık kritik kusur yok). Planına test piramidi ve test çeyrekleri açısından bir paragraf ekle.","test-plan/test-plan.md ve risk tablosu","risk-based testing = risk tabanlı test, likelihood = olasılık, impact = etki, entry criteria = giriş kriterleri, exit criteria = çıkış kriterleri","ISTQB risk based testing test plan template entry exit criteria"],
  ["Tahmin, önceliklendirme, yürütme ve kusur raporları","Tadilat ustası iş için üç süre söyler: en iyi durumda, en olası ve en kötü durumda. Üç noktalı tahmin (three-point estimation) bunları (a + 4m + b) / 6 formülüyle birleştirir. Wideband Delphi'de birkaç kişi ayrı ayrı tahmin edip konuşarak uzlaşır; oranlara dayalı tahmin ve dış değerlendirme (extrapolation) de müfredatta yer alır. Önceliklendirme riskli testleri öne alır. İyi bir kusur raporu, doktora anlatılan şikâyet gibi açık olmalı: başlık, adımlar, beklenen sonuç, gerçekleşen sonuç, ortam, önem derecesi (severity) ve öncelik (priority), kanıt.","Tüm test senaryoların için üç noktalı tahmin yap ve gerçek süreyle karşılaştırmak üzere kaydet. Senaryoları risk sırasına göre koş, sonuçları matrise işle. Bulduğun kusurlar için en az 6 kusur raporu yaz (GitHub Issues ya da tablo), her birine ekran görüntüsü ekle ve matrise kusur no'suyla bağla. Bir raporu, ölçüt olarak yalnızca raporu okuyan birinin kusuru tekrar üretip üretemediğine bakarak kendin puanla.","Tahmin tablosu, 6 kusur raporu, doldurulmuş izlenebilirlik matrisi","estimation = tahmin, three-point estimation = üç noktalı tahmin, severity = önem derecesi, priority = öncelik, steps to reproduce = tekrar üretme adımları","ISTQB three point estimation Wideband Delphi defect report template"],
  ["Otomasyon: Playwright + CI ve araçların fayda/riski","Otomasyon bulaşık makinesine benzer: her gün aynı işi yorulmadan yapar ama kurulumu, bakımı ve doğru yerleştirmesi emek ister; tek bir tava için de zahmetlidir. Test araçları; yönetim, statik test, tasarım ve uygulama, yürütme ve kapsam, fonksiyonel olmayan test, DevOps ve işbirliği gibi alanlarda yardımcı olur. Faydalar: tekrarlanan işte zaman kazancı, tutarlılık, hızlı geri bildirim. Riskler: gerçekçi olmayan beklenti, bakım maliyetinin hafife alınması, araca aşırı güven, satıcıya bağımlılık, bakımı bırakılan açık kaynak araç.","automation/ klasöründe npm init playwright@latest ile proje kur. Regresyon setinden en yüksek riskli 8 senaryoyu otomatikleştir (giriş, arama, sepete ekleme, sınır değerli miktar gibi). GitHub Actions iş akışında Juice Shop'u Docker servis konteyneri olarak başlat ve testleri koş; HTML raporunu artifact olarak sakla. README'ye otomasyonun bu projedeki 3 faydasını ve 3 riskini, kendi deneyiminden örnekle yaz.","Yeşil CI çalıştırması ekran görüntüsü, Playwright raporu, fayda/risk notu","test automation = test otomasyonu, flaky test = kararsız test, maintenance cost = bakım maliyeti, vendor = satıcı, pipeline = iş hattı","playwright github actions docker service container tutorial"],
  ["İzleme, kontrol ve test özet raporu","Test izleme, uzun yolda yakıt göstergesine bakmak gibidir: nerede olduğunu ölçersin. Kontrol ise gerekirse rotayı değiştirmektir. Metrikler: koşulan ve geçen senaryo sayısı, kusur sayısı ve önem dağılımı, gereksinim kapsamı. Test tamamlama (test completion) faaliyetinde ortamı ve testware'i arşivler, öğrenilen dersleri yazarsın. Konfigürasyon yönetimi, hangi sürüm uygulamayı hangi sürüm testlerle denediğini kayıt altına almaktır.","reports/ klasörüne 1-2 sayfalık test özet raporu yaz: test edilen sürüm ve ortam, kapsam, koşulan/geçen/kalan senaryo sayıları, kusur özeti, çıkış kriterlerinin karşılanıp karşılanmadığı, kalan riskler, tavsiye. Tahminlerini gerçek sürelerle karşılaştır. Repo'ya bir git tag ekle ve test edilen Juice Shop sürümünü not et. Öğrenilen 5 dersi yaz.","reports/test-summary.md ve sürüm etiketi","test monitoring = test izleme, test control = test kontrolü, test summary report = test özet raporu, configuration management = konfigürasyon yönetimi, lessons learned = öğrenilen dersler","ISTQB test monitoring control test completion report example"],
  ["Final: kendi kendini sına ve sınava hazırlan","Sınava girmeden önce elindeki kanıt dosyası, sürücü kursundaki pratik saatler gibidir: yolda kullandın, şimdi kuralları kitaptan tekrar et. Müfredatın her öğrenme hedefinin bir bilgi düzeyi (K1 hatırlama, K2 anlama, K3 uygulama) vardır; K3 soruları özellikle 4. bölümdeki tekniklerden gelir. Sınav içeriği, süresi, ücreti ve dili ülkeye ve sınav sağlayıcısına göre değişebilir; bunları yalnızca resmî kaynaktan öğren.","istqb.org'dan güncel CTFL v4.0 müfredatını ve terimler sözlüğünü (glossary) indir. Her bölümün öğrenme hedeflerini bir tabloya yaz ve her hedefin yanına repo'ndaki kanıt dosyasını bağla; boş kalanları işaretle ve tekrar çalış. ISTQB'nin yayımladığı resmî örnek sınavlarla kendini sına; yanlış cevapladığın her soruyu bölüm numarasıyla bir hata defterine yaz. Türkiye'deki sınav sağlayıcısını, güncel ücret ve sınav biçimini resmî ISTQB üye kurulu ya da yetkili sınav kuruluşu sitesinden kontrol et. Son olarak README'yi İngilizce bir özetle tamamla ve repo'yu herkese açık yap.","Öğrenme hedefi-kanıt tablosu, örnek sınav hata defteri, herkese açık repo","syllabus = müfredat, learning objective = öğrenme hedefi, glossary = terimler sözlüğü, sample exam = örnek sınav, exam provider = sınav sağlayıcısı","ISTQB CTFL v4.0 syllabus sample exam official"]
  ]};

var PROJ_BK4={id:"bk4",lv:3,cap:true,title:"Kapston: Bulutta Sipariş Servisi (Serverless API + Kuyruk + Veritabanı + CI/CD)",weeks:10,
  tools:"AWS Lambda (.NET), API Gateway, DynamoDB, S3, SQS + DLQ, SNS/EventBridge, Cognito, IAM, KMS, Secrets Manager/Parameter Store, AWS SAM, GitHub Actions, CloudWatch, X-Ray, k6",
  cert:"AWS Certified Developer – Associate (DVA-C02 / yeni DVA-C03)",
  why:"bk1-bk3'te kendi sunucunda çalışan bir servis kurdun. Şirketlerin çoğu artık aynı işi bulutta, sunucu yönetmeden (serverless) yapıyor. Bu kapston, öğrendiğin her şeyi AWS üzerinde birleştirir: güvenli bir API, kuyrukla arka planda iş yapma, veritabanı tasarımı, altyapıyı kodla kurma ve otomatik yayın. Bitirdiğinde AWS Developer Associate sınavının dört alanını da elinle yapmış olursun.",
  outcome:["Lambda, API Gateway, DynamoDB, S3, SQS ve SNS/EventBridge ile uçtan uca çalışan bir sipariş servisi kurarsın","Cognito, en az yetkili IAM rolleri, KMS ve Secrets Manager/Parameter Store ile servisi güvenli hale getirirsin","Tüm altyapıyı SAM ile kod olarak yazar, GitHub Actions ile sürüm ve alias kullanarak otomatik yayınlarsın","CloudWatch, X-Ray, yeniden deneme, idempotency ve yük testiyle sorun bulup giderir, sonra AWS Developer Associate sınavına hazır olup olmadığını ölçersin"],
  pitch:"I designed and deployed a serverless order service on AWS with Lambda, API Gateway, DynamoDB, SQS, Cognito and SAM, shipped through a GitHub Actions CI/CD pipeline and monitored with CloudWatch and X-Ray.",

  repo:{name:"aws-developer-kanit-projesi",folders:["src/","infra/","tests/","docs/"],desc:"AWS üzerinde serverless sipariş servisi: Lambda (.NET), API Gateway, DynamoDB, SQS, Cognito, SAM ve GitHub Actions ile CI/CD. AWS Developer Associate hazırlık kanıt projesi.",topics:["aws","serverless","dotnet","backend"]},
  steps:[
  ["Güvenli hesap: bütçe alarmı, MFA ve IAM","Yeni bir AWS hesabı, kredi kartı bağlı bir dükkân anahtarı gibidir: kaybolursa ya da açık unutulursa fatura gelir. Önce kapıya alarm (bütçe uyarısı), kasaya çift kilit (MFA) takarsın. Kök kullanıcı (root user) dükkânın tapusudur; günlük işte kullanılmaz, kasada durur. Günlük iş için kendine ayrı bir kullanıcı ve rol açarsın. Ücretsiz katman ve yeni hesap kredileri zaman içinde değişti; güncel koşulları mutlaka AWS Free Tier sayfasından oku, buradaki hiçbir şeyi fiyat bilgisi sanma.","Kendi AWS hesabını aç. AWS Budgets ile düşük tutarlı bir bütçe ve e-posta uyarısı kur. Kök kullanıcıya MFA ekle, kök için erişim anahtarı (access key) oluşturma. IAM Identity Center ya da bir IAM kullanıcısı ile günlük kullanıcını aç, ona MFA ekle. AWS CLI'yi bu kullanıcıyla yapılandır ve 'aws sts get-caller-identity' çalıştır. Bölge (region) seç ve tüm projede aynı bölgeyi kullan.","Bütçe uyarısının ve MFA'nın açık olduğunu gösteren ekran görüntüleri (hesap numarası karartılmış), get-caller-identity çıktısı (kimlik bilgileri gizli), docs/guvenlik-baslangic.md","root user = kök kullanıcı, MFA = çok aşamalı doğrulama, budget alert = bütçe uyarısı, IAM role = IAM rolü, region = bölge","aws new account best practices budget alert root mfa iam identity center"],
  ["Mimari çizim ve SAM iskeleti","Ev yapmadan önce mimar çizim yapar ve malzeme listesi çıkarır. Altyapıyı kod olarak yazmak (Infrastructure as Code), o çizimi makineye verip evi her seferinde aynı biçimde kurdurmaktır. SAM, CloudFormation'ın serverless için kısaltılmış dilidir; bir şablon dosyası (template.yaml) yazarsın, AWS kaynakları ondan oluşturur, 'sam delete' ile hepsini birden siler. Yığın (stack) bir arada kurulan ve silinen kaynak paketidir.","docs/ klasörüne mimari diyagramı çiz: istemci → API Gateway → Lambda → DynamoDB; Lambda → SQS → işleyici Lambda → SNS/EventBridge; S3 dosyaları; Cognito girişi. AWS SAM CLI ve .NET Lambda şablonlarını (Amazon.Lambda.Templates) kur. 'sam init' ile .NET şablonundan bir merhaba-dünya projesi oluştur, 'sam build' ve 'sam deploy --guided' ile yükle, çağır, sonra 'sam delete' ile sil. Python ile ilerlemek istersen aynı adımlar Python çalışma ortamıyla da yapılabilir, ana yol C#.","Mimari diyagramı (docs/mimari.png), infra/template.yaml ilk sürümü, deploy ve delete çıktılarının ekran görüntüsü","Infrastructure as Code = altyapıyı kod olarak yazma, template = şablon, stack = yığın, runtime = çalışma ortamı, deploy = yayınlama","aws sam init dotnet lambda hello world deploy delete"],
  ["İlk Lambda: sipariş oluşturma","Lambda, zil çalınca kalkıp işi yapan, iş bitince tekrar uyuyan bir çalışan gibidir: sunucu kiralamazsın, yalnızca çalıştığı süre için ödersin. Handler (işleyici) zil çalınca çalışan fonksiyondur. Event (olay) zile basanın bıraktığı nottur. Soğuk başlangıç (cold start) çalışanın ilk uyandığında biraz geç kalkmasıdır. Ortam değişkenleri çalışanın cebindeki ayar kâğıdıdır.","src/ altında C# ile CreateOrder Lambda'sı yaz: gelen JSON'u (müşteri, ürünler, adet) doğrula, sipariş kimliği üret, şimdilik log'a yaz ve 201 döndür. Bellek ve zaman aşımı (timeout) ayarlarını template.yaml'da tanımla. tests/ altında xUnit ile handler için birim test yaz. 'sam local invoke' ile yerelde örnek olayla dene (Docker gerekir). İş bitince yığını sil.","CreateOrder kodu, geçen birim testleri, sam local invoke çıktısı","handler = işleyici fonksiyon, event = olay, cold start = soğuk başlangıç, timeout = zaman aşımı, environment variable = ortam değişkeni","aws lambda dotnet handler unit test sam local invoke"],
  ["API Gateway ile dışa açılan kapı","API Gateway, binanın danışma masasıdır: dışarıdan gelen herkes önce oraya uğrar, masa doğru odaya (Lambda) yönlendirir, kimlik sorar, aşırı kalabalıkta kapıyı yavaşlatır (throttling). Aşama (stage), aynı binanın 'deneme katı' ile 'gerçek katı' gibidir: dev ve prod. Sınavda REST API ve HTTP API türleri arasındaki farklar sorulabilir; ikisini de dokümandan karşılaştır.","template.yaml'a API tanımla: POST /orders → CreateOrder, GET /orders/{id} → GetOrder. CORS ayarını yap. Yanlış JSON'da 400, bulunamayan siparişte 404 döndür. Postman ya da curl ile dene, istek/cevap örneklerini docs/api.md'ye yaz. REST API ile HTTP API farklarını kendi cümlelerinle 5 madde olarak yaz. İş bitince yığını sil.","Çalışan uç noktaların Postman ekran görüntüsü, docs/api.md (uç nokta tablosu + REST/HTTP API karşılaştırması)","stage = aşama, throttling = istek kısma, integration = entegrasyon, CORS = kaynaklar arası paylaşım, proxy = aracı","api gateway rest api vs http api lambda proxy integration sam"],
  ["DynamoDB tasarımı: partition key düşüncesi","DynamoDB dev bir dosya dolabıdır. Partition key (bölüm anahtarı) hangi çekmeceye bakılacağını söyler; sort key (sıralama anahtarı) çekmecedeki dosyaların sırasıdır. Herkes aynı çekmeceye koşarsa sıra oluşur (sıcak bölüm, hot partition); bu yüzden anahtarı, istekleri çekmecelere dağıtacak biçimde seçersin. SQL'de önce tabloyu tasarlarsın; DynamoDB'de önce 'hangi soruları soracağım' (erişim kalıpları) listesini yazarsın. Scan bütün dolabı karıştırmak, Query doğru çekmeceyi açmaktır.","Erişim kalıplarını yaz: siparişi kimlikle getir, bir müşterinin siparişlerini tarihe göre listele, durumu 'beklemede' olanları bul. Buna göre tablo anahtarlarını ve gerekiyorsa bir GSI (ikincil dizin) tasarla. Kapasite modunu seç (on-demand ya da provisioned) ve nedenini yaz. CreateOrder'ı AWS SDK for .NET ile tabloya yazacak, GetOrder'ı Query/GetItem ile okuyacak hale getir. Aynı siparişin iki kez yazılmasını koşullu yazma (condition expression) ile engelle. Scan kullanmadığını göster. İş bitince yığını sil.","Erişim kalıbı tablosu ve anahtar tasarımı (docs/dynamodb-tasarim.md), koşullu yazmanın hata verdiği test çıktısı","partition key = bölüm anahtarı, sort key = sıralama anahtarı, GSI = global ikincil dizin, access pattern = erişim kalıbı, conditional write = koşullu yazma","dynamodb partition key design access patterns single table gsi beginner"],
  ["S3 ve ön imzalı URL ile fatura dosyası","S3 sınırsız raflı bir depodur; her dosya bir 'kova' (bucket) içinde, bir anahtarla (key) durur. Depoyu herkese açmak yerine, belirli bir dosya için kısa süreli bir giriş kartı verirsin: ön imzalı URL (pre-signed URL). Kart süresi bitince işe yaramaz. Kovanın herkese açık erişimini kapalı tutmak (Block Public Access) temel güvenlik kuralıdır.","SAM ile özel bir S3 kovası oluştur, Block Public Access açık ve sunucu tarafı şifreleme etkin olsun. GET /orders/{id}/invoice-url ucu ekle: Lambda, o siparişin faturası için birkaç dakika geçerli ön imzalı indirme URL'si üretsin; yükleme için de ön imzalı PUT URL'si üretsin. Süresi dolmuş URL'nin reddedildiğini dene. Lambda rolüne yalnızca bu kovanın ilgili yoluna erişim ver. İş bitince kovayı boşalt ve yığını sil (dolu kova silinmez).","Ön imzalı URL ile yükleme/indirme ve süresi dolunca gelen hata (ekran görüntüsü), kova politikası/IAM parçası","bucket = kova, object key = nesne anahtarı, pre-signed URL = ön imzalı adres, encryption at rest = durağan veri şifrelemesi, Block Public Access = genel erişimi engelleme","s3 presigned url dotnet sdk lambda upload download expiration"],
  ["SQS + DLQ ile asenkron işleme","Restoranda garson siparişi mutfağa bağırmaz, fişi ray üzerine asar; aşçı sırası gelince alır. SQS o raydır: CreateOrder hemen cevap verir, ödeme ve stok işini arka plandaki işleyici yapar. Bir fiş defalarca pişirilemiyorsa ayrı bir 'sorunlu fişler' kutusuna gider: DLQ (dead-letter queue). Görünmezlik süresi (visibility timeout), aşçının fişi alıp başkasının görmemesi için kenara koyduğu süredir.","SAM ile OrdersQueue ve OrdersDLQ oluştur, redrive policy ile birkaç başarısız denemeden sonra mesajın DLQ'ya gitmesini ayarla. CreateOrder siparişi DynamoDB'ye 'beklemede' yazıp kuyruğa mesaj atsın. ProcessOrder Lambda'sı kuyruktan okuyup durumu 'işlendi' yapsın. Toplu (batch) işlemede yalnızca başarısız mesajları geri bildirmek için kısmi toplu yanıtı (ReportBatchItemFailures) kullan. Bilerek hatalı bir mesaj gönder, DLQ'ya düştüğünü gör ve düzeltip yeniden işle (redrive). İş bitince yığını sil.","Kuyruk akış şeması, DLQ'ya düşen mesajın ekran görüntüsü, redrive sonrası 'işlendi' kaydı","queue = kuyruk, dead-letter queue = başarısız mesaj kuyruğu, visibility timeout = görünmezlik süresi, asynchronous = eşzamansız, batch = toplu","sqs lambda dead letter queue redrive reportbatchitemfailures dotnet"],
  ["SNS / EventBridge ile bildirim","SNS bir megafondur: bir mesajı abone olan herkese aynı anda duyurur (e-posta, başka bir kuyruk, Lambda). EventBridge ise akıllı bir posta ayırıcıdır: olayın içeriğine bakar, kurala uyanları ilgili adrese yollar. Bir olayı birçok yere dağıtmaya fan-out denir.","Sipariş 'işlendi' olduğunda bir olay yayınla: ya SNS konusuna (e-posta aboneliği ile kendine bildirim) ya da EventBridge olay yoluna (örneğin yüksek tutarlı siparişleri ayrı bir hedefe yönlendiren kural). Seçimini ve nedenini docs/'a yaz; SNS, SQS ve EventBridge'in hangi durumda tercih edildiğini kendi tablonla karşılaştır. Lambda rolüne yalnızca o konuya/olay yoluna yayın izni ver. İş bitince yığını sil.","Gelen bildirim e-postasının ekran görüntüsü (adres gizli), SNS/SQS/EventBridge karşılaştırma tablosu","topic = konu, subscription = abonelik, event bus = olay yolu, rule = kural, fan-out = çoklu dağıtım","sns vs sqs vs eventbridge when to use lambda order notification"],
  ["Cognito ile giriş ve en az yetkili IAM","Cognito, binanın kart basan güvenlik ofisidir: kullanıcı kaydolur, giriş yapar ve imzalı bir kart (JWT) alır. API Gateway kapıda bu kartı kontrol eder (authorizer). bk3'te JWT'yi kendin üretmiştin; burada bu işi yönetilen bir servise devredersin. IAM tarafında 'en az yetki' ilkesi: her çalışana yalnızca işini yapacak kadar anahtar verilir. Kullanıcı kimliği (Cognito) ile servis yetkisi (IAM rolü) farklı şeylerdir.","SAM ile bir Cognito User Pool ve uygulama istemcisi oluştur. API'ye Cognito authorizer bağla; token'sız istekte 401 aldığını göster. Lambda kodunda token'daki kullanıcı kimliğini oku, müşteri yalnızca kendi siparişlerini görebilsin. Her Lambda için ayrı rol tanımla: SAM politika şablonlarını (örneğin yalnızca belirli tabloya yazma) ya da elle yazılmış dar politikaları kullan; '*' joker kaynaklardan kaçın. IAM Access Analyzer ya da politika simülatörü ile bir izni dene. İş bitince yığını sil.","401 ve 200 cevaplarının karşılaştırması, her fonksiyonun izin tablosu (docs/iam-yetkiler.md), başka kullanıcının siparişine erişimin reddedildiği test","user pool = kullanıcı havuzu, authorizer = yetkilendirici, least privilege = en az yetki, policy = politika, principal = yetkili kimlik","cognito user pool api gateway authorizer least privilege lambda execution role sam"],
  ["Gizli bilgiler ve KMS ile şifreleme","Gizli bilgiyi (API anahtarı, parola) koda yazmak, evin anahtarını kapının üstüne bırakmak gibidir. Parameter Store ayar dolabıdır, SecureString türü kilitli çekmecedir. Secrets Manager ise kilidini zaman zaman kendisi değiştirebilen (rotation) bir kasadır. KMS anahtarları yöneten çilingirdir; zarf şifrelemesinde (envelope encryption) veri bir anahtarla, o anahtar da KMS'teki ana anahtarla kilitlenir.","Sahte bir 'ödeme sağlayıcısı API anahtarı'nı Parameter Store'a SecureString olarak ya da Secrets Manager'a koy. ProcessOrder bu değeri çalışırken okusun; değeri handler dışında bir kez okuyup belleğe almayı (önbellek) dene. Kendi KMS anahtarını (müşteri yönetimli anahtar) oluştur, DynamoDB tablosu ya da S3 kovası için kullan. Lambda rolüne yalnızca bu gizli bilgiyi okuma ve bu anahtarla şifre çözme izni ver. Secrets Manager ile Parameter Store farkını yaz. Ücretli kaynakları (KMS anahtarı, gizli bilgi) iş bitince silme takvimine al; KMS anahtarları bekleme süresinden sonra silinir, ayrıntıyı dokümandan oku.","Kodda gizli bilgi bulunmadığını gösteren arama çıktısı, KMS anahtar politikası parçası, Secrets Manager / Parameter Store karşılaştırması","secret = gizli bilgi, rotation = otomatik değiştirme, envelope encryption = zarf şifrelemesi, customer managed key = müşteri yönetimli anahtar, decrypt = şifre çözme","aws secrets manager vs parameter store securestring kms envelope encryption lambda"],
  ["GitHub Actions ile CI/CD, sürüm ve alias","CI/CD, fırının otomatik bant sistemidir: hamur (kod) girer, kontrol edilir, pişer, rafa çıkar. Lambda sürümü (version) fırından çıkmış ve artık değişmeyen bir parti ekmektir; alias (takma ad) rafın üstündeki 'bugünün ekmeği' etiketidir, etiketi yeni partiye ya da geri eski partiye kaydırabilirsin. Canary yayın, yeni ekmeği önce müşterilerin küçük bir kısmına tattırmaktır. GitHub'ın AWS'ye uzun ömürlü anahtar yerine OIDC ile geçici kimlik alması daha güvenlidir.","GitHub Actions iş akışı yaz: dotnet build + test, 'sam build', 'sam deploy'. AWS kimliği için OIDC ve aws-actions/configure-aws-credentials kullan; depoya erişim anahtarı koyma. dev ve prod için iki ayrı yığın ya da aşama kur. template.yaml'da AutoPublishAlias ile alias kullan ve DeploymentPreference ile aşamalı (canary/linear) yayın ayarla; bir CloudWatch alarmı yayın sırasında tetiklenirse geri dönsün. Bilerek hatalı bir sürüm gönder, geri dönüşü (rollback) gözle. CodePipeline/CodeBuild/CodeDeploy'un aynı işi nasıl yaptığını kısa bir notla karşılaştır.","Yeşil Actions çalışması ve rozet, OIDC rol güven politikası (hesap numarası gizli), rollback olayının ekran görüntüsü","pipeline = boru hattı, version = sürüm, alias = takma ad, canary deployment = kanarya yayını, rollback = geri alma","github actions oidc aws sam deploy autopublishalias deploymentpreference canary"],
  ["CloudWatch, X-Ray ve hata ayıklama","CloudWatch servisin günlük defteri ve ölçü panelidir: günlükler (logs) ne olduğunu yazar, metrikler sayıları tutar, alarm eşiği aşınca seni uyarır. X-Ray bir isteğin bütün yolculuğunu harita gibi çizer: API Gateway'den Lambda'ya, oradan DynamoDB'ye ve SQS'e, nerede beklediğini gösterir. AWS yeni projeler için izlemede OpenTelemetry tabanlı yolu (ADOT) da öneriyor; güncel öneriyi dokümandan kontrol et.","Lambda'larda yapılandırılmış JSON log yaz (Powertools for AWS Lambda .NET'in Logging/Metrics/Tracing yardımcılarını kullanabilirsin), her logda sipariş kimliği olsun. Özel bir metrik ('OrdersCreated') yayınla. CloudWatch Logs Insights ile hata sorgusu yaz. Lambda hata sayısı ve DLQ mesaj sayısı için alarm kur, alarmı SNS ile e-postana bağla. API ve Lambda'larda X-Ray izlemeyi aç, bir isteğin servis haritasını incele ve en yavaş adımı bul. Bilerek bir izin hatası (AccessDenied) üret, log ve izden kök nedeni bul. İş bitince yığını sil.","Logs Insights sorgusu ve sonucu, tetiklenen alarm e-postası, X-Ray servis haritası ekran görüntüsü, docs/hata-ayiklama.md (bulduğun hata ve çözümü)","log group = günlük grubu, metric = metrik, alarm = alarm, trace = iz, service map = servis haritası","cloudwatch logs insights lambda alarm x-ray tracing powertools dotnet"],
  ["Dayanıklılık: yeniden deneme, idempotency, önbellek ve yük testi","Kapı kilitliyse aynı saniyede yüz kez çalmazsın; bekler, sonra daha uzun bekleyerek tekrar denersin: exponential backoff (üstel geri çekilme), araya biraz rastgelelik (jitter) eklenir. Idempotency, asansör düğmesine iki kez basınca iki asansör gelmemesidir: aynı sipariş isteği iki kez gelirse tek sipariş oluşur. Önbellek, sık sorulan sorunun cevabını masanda not tutmaktır. Yük testi, açılıştan önce dükkâna kalabalık provası yaptırmaktır.","AWS SDK'nın yerleşik yeniden deneme ayarlarını incele ve throttling hatalarında backoff ile denediğini log'da göster. POST /orders'a idempotency anahtarı (Idempotency-Key başlığı) ekle; aynı anahtarla gelen ikinci istek aynı siparişi dönsün (DynamoDB koşullu yazma ya da Powertools Idempotency yardımcısı ile). Sık okunan ürün listesini Lambda belleğinde kısa süreli önbellekle; API Gateway önbelleği, CloudFront, ElastiCache ve DAX'in ne zaman kullanıldığını not et (bunlar ek ücretli olabilir, açarsan hemen kapat). k6 ile kendi API'ne kontrollü yük uygula, gecikme, hata oranı, throttling (429) ve Lambda eşzamanlılığını (concurrency) CloudWatch'ta izle; reserved concurrency ile bir fonksiyonu sınırlamayı dene. Önce/sonra sonuçları yaz. Test bitince tüm yığınları sil ve Billing panelinde açık kaynak kalmadığını kontrol et.","k6 önce/sonra raporu, aynı Idempotency-Key ile tek sipariş oluştuğunu gösteren test, temizlik sonrası boş kaynak listesi ve bütçe ekranı","exponential backoff = üstel geri çekilme, jitter = rastgele gecikme, idempotency = tekrar güvenliği, concurrency = eşzamanlılık, throttling = istek kısma","aws sdk retry exponential backoff jitter lambda idempotency dynamodb k6 load test"],
  ["Kendini sına ve sınav öncesi kontrol","Sürücü kursunu bitirmek ehliyet demek değildir; sınav günü yolda ne soracaklarını da prova edersin. Bu proje sana elle tecrübe verdi; sınav ise senaryo sorularıyla 'hangi servis, hangi ayar' kararını ölçer. Zayıf olduğun alanı bulmak için kendini puanla, sonra o alana dön. DVA-C02 için son sınav günü 30 Kasım 2026; yeni sürüm DVA-C03'ün kaydı 27 Ekim 2026'da açılıyor. DVA-C03'ün alanlarını ve ağırlıklarını henüz doğrulamadık; resmî sınav rehberini, ücreti ve sürüm geçişini mutlaka AWS Certification sayfasından kontrol et.","Akademi'deki Soru Bankası'nda bk sorularını çöz, yanlışlarını dört alana (Geliştirme, Güvenlik, Dağıtım, Sorun giderme ve en iyileme) göre say. Resmî sınav rehberini indir, her konuyu bu projedeki bir adımla eşleştiren bir tablo yap ve eşleşmeyen konuları (örneğin Elastic Beanstalk, ECS/ECR, Step Functions temelleri, CDK) kısa bir lab ile tamamla. AWS Skill Builder'daki resmî deneme sorularını çöz. Hangi sürüme (DVA-C02 ya da DVA-C03) gireceğine tarih ve hazırlığına göre karar ver. Son olarak README'yi tamamla, mimari diyagramı ve 2 dakikalık demo videosunu ekle, 'Tell me about a serverless project you built' sorusuna 90 saniyelik İngilizce STAR cevabı yaz ve Mülakat sekmesinde sesli prova et. Hesapta açık kaynak kalmadığını son kez kontrol et.","Alan bazlı puan tablosu, sınav rehberi ↔ proje adımı eşleme tablosu, tamamlanmış README + demo videosu, İngilizce STAR cevabı","exam guide = sınav rehberi, practice question = deneme sorusu, domain = alan, scenario = senaryo, readiness = hazır olma durumu","aws certified developer associate exam guide DVA-C02 DVA-C03 practice questions skill builder"]
  ]};
