var PATH_BA={id:"ba",name:"Başlangıç: Bilgisayar ve İnternet",short:"Sıfırdan: bilgisayar, e-posta, GitHub",blurb:"Bilgisayara hiç dokunmadıysan buradan başla. Önce bilgisayarı tanırsın, sonra e-posta ve belge yazarsın, en sonunda GitHub'da kendi sayfanı yayınlarsın.",col:"ba",
 projects:[
 {id:"ba1",lv:1,title:"Bilgisayarı Tanı: İlk Gün",weeks:1,tools:"Windows veya Mac bilgisayar, tarayıcı (Chrome, Edge veya Firefox), Not Defteri veya Google Docs",
  why:"Her şey bilgisayarı rahat kullanmakla başlar. Bu projede açıp kapatmayı, fare ve klavyeyi, dosya ve klasörleri öğrenir, kendi bilgisayar rehberini yazarsın.",
  outcome:["Bilgisayarı doğru şekilde açıp kapatabilirsin","Dosya ve klasör oluşturup düzenli saklarsın","İnternette güvenli arama yapar ve ekran görüntüsü alırsın"],
  pitch:"I learned to use a computer from zero and wrote my own beginner computer guide.",
  steps:[
  ["Bilgisayarı aç ve doğru kapat","Bilgisayar bir ev gibidir: ışığı yakmak (açmak) ve çıkarken düzgünce kapatmak gerekir. Fişi çekmek, evi yangın çıkmış gibi terk etmek olur. Kapatırken bilgisayar açık işlerini kaydeder. Kısa cümle: önce Başlat, sonra Güç, sonra Kapat.","1) Güç düğmesine (içinde küçük bir daire ve çizgi olan tuş) bir kez bas. 2) Ekranda giriş (kilit) ekranını bekle. 3) Parolanı veya PIN'ini yaz, Enter tuşuna bas. 4) Masaüstünü gördüğünde sol alttaki Başlat düğmesine (pencere işareti) tıkla. 5) Güç simgesine, sonra Kapat seçeneğine tıkla. Ekranın kararıp ışığın söndüğünü göreceksin. Mac kullanıyorsan: sol üstteki elma simgesi, sonra Kapat.","Bilgisayarın kapalı ve açık halinin bir fotoğrafı veya 2 cümlelik not","power button = açma düğmesi, shut down = kapat, restart = yeniden başlat, sleep = uyku","how to turn on and shut down a Windows computer for beginners"],
  ["Fare ve klavye ile tanış","Fare, ekrandaki parmağındır. Sol tık 'seç' demektir, çift tık 'aç' demektir, sağ tık 'seçenekleri göster' demektir. Klavye ise yazı makinesidir. Terim: imleç, ekranda fareyle hareket eden küçük ok. Kısayol, iki tuşa birlikte basıp hızlı iş yapmaktır.","1) Fareyi hareket ettir ve oku ekranda gez. 2) Masaüstündeki bir simgeye bir kez sol tıkla; rengi değişecek. 3) Aynı simgeye sağ tıkla; küçük bir menü açılacak, sonra boş yere tıkla ve menüyü kapat. 4) Not Defteri'ni (Mac için Notlar) aç ve adını soyadını yaz. 5) Shift tuşuna basılı tutup bir harfe bas; büyük harf yazacak. 6) Yazını seç, Ctrl ve C ile kopyala, Ctrl ve V ile yapıştır (Mac: Cmd tuşu). Aynı yazının iki kez görünmesi başarıdır.","Adını iki kez yazan Not Defteri ekranının görüntüsü","mouse = fare, keyboard = klavye, click = tıklamak, shortcut = kısayol","computer mouse and keyboard basics for beginners"],
  ["Masaüstü, pencere ve görev çubuğu","Masaüstü çalışma masandır. Simgeler masadaki eşyalardır. Pencere açtığın her uygulamanın kağıdıdır; üst üste koyabilirsin. Görev çubuğu (ekranın altındaki şerit) açık işlerin listesidir. Kapatma, küçültme ve büyütme düğmeleri pencerenin sağ üst köşesindedir.","1) Not Defteri penceresini aç. 2) Sağ üstteki çizgi (küçült) düğmesine tıkla; pencere alta iner. 3) Alttaki görev çubuğunda simgesine tıkla; geri gelecek. 4) Pencerenin üst çubuğundan sürükleyerek yerini değiştir. 5) Kare (büyüt) düğmesine tıkla, pencere tüm ekranı kaplayacak. 6) X düğmesine basıp kapat; kaydetmek isteyip istemediğini soran bir kutu çıkarsa şimdilik Kaydetme seç.","Bir pencerenin küçültülmüş halinin görev çubuğunda göründüğü ekran görüntüsü","desktop = masaüstü, window = pencere, taskbar = görev çubuğu, minimize = küçült","Windows desktop taskbar window explained beginners"],
  ["Dosya ve klasör oluştur","Dosya, tek bir kağıttır. Klasör ise içine kağıtlar koyduğun dosya kutusudur. Düzenli kutular aradığını çabuk bulmanı sağlar. Dosya adının sonundaki .txt veya .pdf gibi kısma uzantı denir; dosyanın türünü söyler.","1) Dosya Gezgini'ni aç (görev çubuğundaki sarı klasör simgesi; Mac için Finder). 2) Sol listeden Belgeler klasörüne tıkla. 3) Boş bir yere sağ tıkla, Yeni, sonra Klasör seçeneğini seç. 4) Adını Bilgisayar-Egitimi yaz ve Enter'a bas. 5) Klasöre çift tıklayıp içine gir. 6) Yine sağ tık, Yeni, Metin Belgesi seç ve adını ilk-notum yap. 7) Dosyaya çift tıkla, bir cümle yaz ve Ctrl ve S ile kaydet. Klasörün içinde ilk-notum adlı bir dosya görmelisin.","Klasörün içinde dosyayı gösteren ekran görüntüsü","file = dosya, folder = klasör, rename = yeniden adlandır, extension = uzantı","how to create a folder and a file in Windows beginners"],
  ["Tarayıcıyı tanı","Tarayıcı, internetin kapısıdır; Chrome, Edge ve Firefox birer örnektir. Adres çubuğu, sitenin adresini yazdığın kutudur. Sekme, aynı pencerede birden fazla sayfa açmaktır. Site adresine URL denir. Adresin başındaki kilit simgesi bağlantının şifreli olduğunu gösterir.","1) Tarayıcıyı aç. 2) Üstteki adres çubuğuna wikipedia.org yaz ve Enter'a bas. 3) Sayfada bir bağlantıya tıkla ve geri okuyla (sol üstte) geri dön. 4) Ctrl ve T ile yeni sekme aç ve başka bir siteye git. 5) Sekmedeki X ile sekmeyi kapat. 6) Adres çubuğunun solundaki kilit simgesini bul. Sitenin açılması ve kilidi görmen yeterlidir.","İki sekmenin açık olduğu tarayıcı ekran görüntüsü","browser = tarayıcı, tab = sekme, address bar = adres çubuğu, bookmark = yer imi","what is a web browser and how to use tabs beginners"],
  ["Güvenli arama yap","Arama motoru, dev bir kütüphane görevlisidir; sen soruyu yazarsın, o sayfaları listeler. Ama listedeki her şeye güvenilmez. Sponsorlu (reklam) sonuçlar en üstte çıkabilir. Güvenilir olanlar genelde resmi kurum, bilinen kuruluş ve kilitli adreslerdir. Ters köşe: 'Hemen tıkla, para kazan' gibi sayfalar tuzak olabilir.","1) Tarayıcıda arama kutusuna bugünkü hava durumu Ankara yaz. 2) Sonuçlarda Reklam veya Sponsorlu yazan satırları bul, onlara tıklama. 3) Bir sonucun üzerine gelip alt köşede çıkan adrese bak. 4) Bir sayfaya girince adresin ve kilit simgesinin sana tanıdık göründüğünü kontrol et. 5) Hiç tanımadığın bir siteden program indirme. 6) Bir bilgiyi iki ayrı kaynaktan doğrula.","Aramanın sonuç sayfasında reklam satırını işaretlediğin ekran görüntüsü","search engine = arama motoru, result = sonuç, advertisement = reklam, trusted source = güvenilir kaynak","how to search the internet safely beginners spot ads"],
  ["Bir hesabı güvenli kullan","Hesap, bir sitedeki kişisel odandır; kullanıcı adı kapının numarası, parola anahtardır. Anahtarı kimseyle paylaşma. İyi parola uzundur: dört beş kelimelik bir cümle gibi. Aynı parolayı her yerde kullanma, çünkü bir kapı çalınırsa hepsi açılır. Giriş yaptığın ortak bilgisayarda işin bitince Çıkış yap.","1) Elinde bir e-posta hesabı varsa onu aç (yoksa sonraki projede açacaksın, şimdi bu adımda parola cümlesi üret). 2) Kendin için 4-5 kelimelik bir parola cümlesi uydur, örneğin rastgele kelimeler. Bunu kimseye gösterme. 3) Giriş ekranındaki göz simgesine basıp yazdığını kontrol et. 4) İşin bitince hesap simgesinden Çıkış yap seçeneğine tıkla. 5) Giriş sayfasına dönünce başarılı oldun. Parolayı ekran görüntüsüne alma.","Parolanı göstermeden, çıkış yaptıktan sonra giriş sayfasının ekran görüntüsü","account = hesap, username = kullanıcı adı, password = parola, log out = çıkış yap","how to create a strong password passphrase beginners"],
  ["Ekran görüntüsü al","Ekran görüntüsü, ekranın fotoğrafını çekmektir. Biriyle sorunu anlatırken veya yaptığını kanıtlarken en kolay yoldur. Windows'ta Windows tuşu, Shift ve S birlikte basılınca kırpma aracı açılır. Mac'te Cmd, Shift ve 4 tuşları. Görüntü genelde panoya kopyalanır veya Görüntüler klasörüne kaydedilir.","1) Ekranda göstermek istediğin bir pencere aç. 2) Windows tuşu + Shift + S tuşlarına birlikte bas (Mac: Cmd + Shift + 4). 3) Ekran kararınca fareyle bir dikdörtgen çiz. 4) Sağ altta çıkan bildirime tıkla veya Paint'e Ctrl ve V ile yapıştırıp Dosya, Kaydet de. 5) Dosyayı Bilgisayar-Egitimi klasörüne ekran1.png adıyla koy. Klasörde ekran1.png dosyasını görmelisin.","Klasördeki ekran1.png dosyası","screenshot = ekran görüntüsü, snip = kırp, clipboard = pano, save = kaydet","how to take a screenshot on Windows and Mac"],
  ["Kendi bilgisayar rehberini yaz","Öğrendiğini başkasına anlatabiliyorsan gerçekten öğrenmişsindir. Bir rehber, yapacağın işlerin adım adım listesidir. Bu belge senin ilk portföy parçan olacak, o yüzden içinde parola veya kişisel adres bulunmasın.","1) Not Defteri veya Google Docs aç. 2) Başlığa Benim Bilgisayar Rehberim yaz. 3) Şu 5 başlığı ekle: Açma ve kapama, Fare ve klavye kısayolları, Dosya ve klasör, Güvenli arama, Ekran görüntüsü. 4) Her başlığın altına kendi cümlelerinle 2-3 satır yaz. 5) Ekran görüntülerinden bir veya ikisini ekle. 6) Dosyayı bilgisayar-rehberim adıyla Bilgisayar-Egitimi klasörüne kaydet. Belgede en az 5 başlık görünmeli.","bilgisayar-rehberim dosyası ve klasör görüntüsü","guide = rehber, step by step = adım adım, heading = başlık, save as = farklı kaydet","how to write a simple how-to guide document for beginners"]
  ]},
 {id:"ba2",lv:1,title:"E-posta, Belge ve Kendi CV Taslağım",weeks:2,tools:"Gmail veya başka bir e-posta, Google Docs veya Microsoft Word, Google Drive (isteğe bağlı)",
  why:"İş, okul ve internet hesapları e-postayla yürür. Burada e-posta hesabı açar, düzgün e-posta yazar, bir belge hazırlar ve CV taslağını PDF yaparsın.",
  outcome:["E-posta hesabı açıp düzgün e-posta yazabilirsin","Belge, başlık ve tablo hazırlarsın","Bir CV taslağını PDF olarak kaydedersin"],
  pitch:"I set up a professional email, wrote documents with tables and exported my first CV draft as a PDF.",
  steps:[
  ["E-posta hesabı aç","E-posta adresi, internetteki posta kutunun adresidir. Hem mektup alıp göndermeye hem de başka sitelere üye olmaya yarar. Adres iki parçadır: adın, @ işareti ve sağlayıcının adı (örneğin gmail.com). İş ve okul için sade ve ciddi bir ad seç; uçuk lakaplar kötü izlenim bırakır.","1) Tarayıcıda Google hesabı oluşturma sayfasını ara ve Google'ın resmi sayfasına gir. 2) Adını, soyadını gir. 3) Adres olarak adsoyad gibi sade bir ad seç. 4) Uzun, tahmin edilmesi zor bir parola cümlesi yaz. 5) İstenirse telefon numarası ve doğum tarihi gir. 6) Hesap açılınca Gmail'e git; Gelen Kutusu başlığını göreceksin. Zaten e-postan varsa bu adımda yeni bir tane açmak zorunda değilsin.","Gelen Kutusu ekran görüntüsü (adresini karart)","email address = e-posta adresi, inbox = gelen kutusu, sign up = kayıt ol, username = kullanıcı adı","how to create a Gmail account step by step"],
  ["Düzgün bir e-posta yaz","İyi e-posta kısa bir mektuptur. Konu satırı, zarfın üstündeki başlık gibidir; alan kişi içeriği bir bakışta anlamalı. Selamlama, kısa ve net mesaj, nazik kapanış ve adın: bu dört parça yeter. Tüm harfleri büyük yazmak bağırmak gibi okunur.","1) Gmail'de sol üstteki Yaz (Oluştur) düğmesine tıkla. 2) Alıcı kutusuna kendi adresini yaz, böylece kendine gönderirsin. 3) Konu kutusuna Merhaba, ilk deneme e-postam yaz. 4) Mesaja Merhaba, selam ve iki cümle, sonra Saygılarımla ve adın şeklinde yaz. 5) Gönder düğmesine tıkla. 6) Gelen kutunda yeni e-postanın göründüğünü kontrol et ve aç.","Kendine gönderdiğin e-postanın gelen kutusundaki ekran görüntüsü","subject = konu, recipient = alıcı, send = gönder, greeting = selamlama","how to write a professional email subject greeting closing"],
  ["Belge aç ve yaz","Belge, bilgisayardaki yazı kağıdıdır. Google Docs tarayıcıda, Word ise bilgisayarda çalışır. Google Docs yazdıkça kendiliğinden kaydeder. Taslak, ilk ve düzeltilecek sürümdür; mükemmel olması gerekmez.","1) Tarayıcıda docs.google.com adresine git ve Google hesabınla giriş yap. 2) Boş belge seçeneğine tıkla. 3) Sol üstte Adsız belge yazan yere tıkla ve adını Deneme Belgesi yap. 4) Altına kendini tanıtan 5 cümle yaz. 5) Üstte Kaydedildi gibi bir yazı çıktığını gör. 6) Word kullanıyorsan Dosya, Yeni, Boş belge sırasını izle. Mac kullanıcıları için de adımlar aynıdır.","Başlığı ve 5 cümlesi olan belgenin ekran görüntüsü","document = belge, draft = taslak, untitled = adsız, auto save = otomatik kaydet","Google Docs tutorial for beginners create first document"],
  ["Başlık, kalın yazı ve liste","Biçimlendirme, yazıyı okumayı kolaylaştıran makyajdır. Başlıklar kitap bölümleri gibidir; kalın yazı vurgu içindir; liste ise maddeleri alt alta dizer. Ama az ve düzenli kullan; her şey kalınsa hiçbir şey öne çıkmaz.","1) Deneme Belgesi'nde ilk satırı seç (farenin sol tuşuna basılı sürükle). 2) Üst araç çubuğunda Normal metin yazan kutuya tıkla, Başlık 1 seç. 3) Bir cümlede önemli bir kelimeyi seç ve Ctrl ve B ile kalın yap. 4) Yeni satıra 3 sevdiğin şeyi yaz, hepsini seç ve araç çubuğundaki madde işaretli liste simgesine tıkla. 5) Başlığın büyüdüğünü ve noktaları görmelisin.","Başlık ve listeyi içeren belge ekran görüntüsü","heading = başlık, bold = kalın, list = liste, format = biçimlendir","Google Docs headings bold bullet list tutorial"],
  ["Tablo ekle","Tablo, satır ve sütunlardan oluşan bir ızgaradır; bilgiyi düzenli göstermek için kullanılır. Market listesi, ders programı ve bilgi tabloları buna örnektir. Satır yatay, sütun dikey bölümdür. CV'de çoğu kişi tablo kullanmaz, ama belgelerde işe yarar.","1) Belgede boş bir satıra git. 2) Üst menüden Ekle, sonra Tablo seç. 3) 3 sütun ve 4 satırlık kareyi işaretle. 4) İlk satıra Gün, Yapılacak, Tamam mı yaz. 5) Altına bu hafta yapacağın 3 işi doldur. 6) Tablonun düzgün ızgara halinde göründüğünü doğrula.","3 sütun ve 4 satırlık doldurulmuş tablonun ekran görüntüsü","table = tablo, row = satır, column = sütun, cell = hücre","Google Docs insert table tutorial beginners"],
  ["Dosya adlandırma düzeni kur","Dosya adı, dolap etiketidir. 'Yeni belge (3) son SON.docx' gibi adlarla aradığını bulamazsın. Kural: tarih, konu ve sürüm, boşluk yerine tire. Türkçe karakter ve özel işaretler bazı sitelerde sorun çıkarabilir; bu yüzden ç, ğ, ı, ö, ş, ü yerine c, g, i, o, s, u yazmak güvenlidir.","1) Belgeler içinde Belgelerim adlı bir klasör aç. 2) İçine cv, e-posta ve egitim adlı 3 alt klasör aç. 3) Kuralı belirle: konu-ad-soyad-v1 şeklinde (örneğin cv-ad-soyad-v1). 4) Deneme Belgesi dosyasının adını bu kurala göre değiştir (sağ tık, Yeniden adlandır). 5) Klasörlerin düzenli göründüğünü kontrol et.","Klasör ağacının ve dosya adı örneklerinin ekran görüntüsü","file name = dosya adı, version = sürüm, naming rule = adlandırma kuralı, subfolder = alt klasör","file naming convention best practices beginners"],
  ["CV taslağını yaz","CV, kendini bir sayfada anlatan tanıtım kartıdır. Okuyan kişi birkaç saniyede kim olduğunu, ne bildiğini, nerede çalıştığını veya okuduğunu görmelidir. Gerçek olmayan bilgi yazma. Tecrüben yoksa eğitimini, öğrendiklerini ve projelerini yaz; bu projelerin kendisi de bir deneyimdir.","1) Yeni belge aç ve adını cv-ad-soyad-v1 yap. 2) En üste adını büyük, altına e-postanı yaz (telefonu ve adresi şimdilik yazmayabilirsin). 3) Şu başlıkları ekle: Hakkımda, Eğitim, Beceriler, Projeler. 4) Hakkımda bölümüne 2-3 cümle yaz. 5) Beceriler bölümüne öğrendiğin 4-5 şeyi liste yap (örneğin: dosya yönetimi, e-posta, belge yazma). 6) Projeler bölümüne bu eğitimdeki ilk iki projeyi bir satırla ekle. 7) CV'nin bir sayfaya sığdığını kontrol et.","cv-ad-soyad-v1 belgesinin ekran görüntüsü","resume = özgeçmiş, skills = beceriler, education = eğitim, summary = özet","simple CV template for beginners with no experience"],
  ["PDF olarak kaydet ve gönder","PDF, belgenin dondurulmuş halidir. Kim açarsa açsın aynı görünür; yazı kayması olmaz. İş başvurusunda ve resmi evrakta genelde PDF istenir. Düzenlemek için asıl belgeyi sakla, göndermek için PDF kullan.","1) CV belgesini açık tut. 2) Google Docs'ta Dosya, Farklı indir, PDF belgesi (.pdf) yolunu izle (Word'de Dosya, Farklı Kaydet, tür olarak PDF). 3) İndirilen dosyayı Belgelerim içindeki cv klasörüne taşı. 4) PDF'e çift tıkla ve açıldığını kontrol et. 5) Yeni bir e-posta yaz, Ek ekle (ataç simgesi) ile PDF'i ekle ve kendi adresine gönder. 6) Gelen kutuda ataç simgeli e-postayı görmelisin.","cv-ad-soyad-v1.pdf dosyası ve ek içeren e-postanın ekran görüntüsü","PDF = taşınabilir belge, attachment = ek, download = indir, export = dışa aktar","how to save Google Docs as PDF and attach to email"]
  ]},
 {id:"ba3",lv:2,title:"GitHub'a İlk Adımım",weeks:2,tools:"GitHub hesabı, tarayıcı, Markdown (düz metin), önceki projelerin dosyaları",
  why:"GitHub, projelerini herkesin görebileceği bir vitrine koyduğun yerdir. Bu projenin sonunda kendi GitHub hesabında yayınlanmış gerçek bir repo ve profil sayfan olacak.",
  outcome:["GitHub hesabı açıp 2FA ile korursun","İlk reposunu açar, README.md yazar ve dosya yüklersin","Yayınlanmış bir repo linkin ve profil README sayfan olur"],
  pitch:"I published my first GitHub repository with a README and uploaded files, and it is the first page of my portfolio.",
  steps:[
  ["GitHub nedir, repo nedir","GitHub, projelerini internette saklayıp gösterdiğin bir yerdir; dosyalar için bir bulut dolabı ve vitrin gibidir. Repo (repository, depo), tek bir projenin klasörüdür. Git ise değişiklikleri takip eden araçtır; GitHub o aracı kullanan sitedir. Şimdilik komut yazmayacaksın, her şeyi tarayıcıdan yapacaksın.","1) Tarayıcıda github.com adresine git. 2) Ana sayfayı gez. 3) Arama kutusuna python yaz, bir örnek repo aç. 4) Repoda dosya listesini ve altında büyük yazıyı (README) bul. 5) Sayfanın en üstünde repo adının, dosyaların ve kısa açıklamanın olduğunu gör. 6) Bir cümleyle kendi kelimelerinle 'repo nedir' yaz.","Bir örnek reponun ekran görüntüsü ve 1 cümlelik tanımın","repository = depo, GitHub = GitHub, project = proje, public = herkese açık","what is GitHub and repository explained for beginners"],
  ["GitHub hesabı aç","Kullanıcı adın, GitHub'daki adresinin parçası olacak: github.com/kullaniciadi. İş verenler görebileceği için sade ve uygun bir ad seç. Parolan başka yerlerden farklı olsun. E-posta adresini doğrulamak gerekir; onay kodu e-postana gelir.","1) github.com sayfasında Sign up düğmesine tıkla. 2) E-posta adresini yaz (önceki projedeki adres olabilir). 3) Parola cümlesi oluştur. 4) Sade bir kullanıcı adı seç, örneğin ad-soyad. 5) Robot olmadığını doğrulayan kutuyu çöz. 6) E-postana gelen kodu girerek doğrula. 7) Giriş yapınca sağ üstte profil simgeni görmelisin.","Giriş yapılmış GitHub ana sayfası (e-postanı karart)","sign up = kayıt ol, username = kullanıcı adı, verify = doğrula, profile = profil","how to create a GitHub account step by step"],
  ["İki adımlı doğrulamayı (2FA) aç","2FA, kapıya ikinci kilit takmaktır. Parolanı biri öğrense bile telefonundaki ikinci kod olmadan giremez. Yedek kodlar (recovery codes) telefonu kaybedersen kurtarma anahtarıdır; onları güvenli yerde sakla, kimseyle paylaşma. GitHub 2FA kullanılmasını istiyor ve ayarı bunu yönlendirecek.","1) Sağ üstteki profil simgene, sonra Settings'e tıkla. 2) Sol menüden Password and authentication bölümünü bul. 3) Two-factor authentication kısmında Enable (etkinleştir) seçeneğine tıkla. 4) Bir kimlik doğrulama uygulaması (telefon uygulaması) veya yöntem seç ve ekrandaki adımları izle. 5) Recovery codes dosyasını indir ve güvenli bir klasöre koy. 6) Sayfada 2FA için Enabled benzeri bir yazı görmelisin.","2FA durumunu gösteren ekran görüntüsü (kodları gösterme)","two-factor = iki adımlı, recovery codes = kurtarma kodları, authenticator = doğrulayıcı, security = güvenlik","GitHub enable two-factor authentication tutorial"],
  ["İlk reponu aç","Repo, projenin evi olacak. Ad kısa, küçük harfli ve boşluksuz olmalı; boşluk yerine tire kullan. Public (herkese açık) seçersen herkes görür; Private (özel) ise sadece sen. Portföy için Public seçeceğiz, o yüzden içine kişisel bilgi (telefon, adres, parola) koymayacaksın.","1) Sayfanın sağ üstündeki artı (+) simgesine tıkla. 2) New repository seç. 3) Repository name kutusuna ilk-projem yaz. 4) Description kısmına Bilgisayar ve internet öğrenme projelerim yaz. 5) Public seçeneğini işaretle. 6) Add a README file kutusunu işaretle. 7) Create repository düğmesine bas. Sayfa açılınca üstte adını ve README.md dosyasını göreceksin.","Reponun ana sayfasının ekran görüntüsü","create = oluştur, public = herkese açık, private = özel, description = açıklama","GitHub create new repository README step by step"],
  ["README.md yaz","README, vitrinin giriş tabelasıdır; reposunun ne olduğunu anlatır. Dosya uzantısı .md Markdown demektir: düz yazıya işaret ekleyerek başlık ve liste yapmanı sağlar. Başlık için satır başına # koyarsın; liste için - koyarsın. Markdown'un kendisi kısa bir işaret dilidir.","1) Repo sayfasında README.md dosyasına tıkla. 2) Sağ üstteki kalem simgesine (Edit) tıkla. 3) Eski yazıyı sil, ilk satıra # İlk Projelerim yaz. 4) Altına kısa bir tanıtım cümlesi yaz. 5) Sonra ## Neler öğrendim başlığı ve altına - ile 3 madde ekle. 6) Preview sekmesine tıklayıp güzel görünüp görünmediğine bak. 7) Commit changes düğmesine, sonra yeşil Commit changes düğmesine bas. Sayfada yazının başlıklı ve listeli göründüğünü göreceksin.","Düzenlenmiş README görünen repo ekran görüntüsü","readme = beni oku, markdown = işaretleme dili, commit = kaydet, edit = düzenle","GitHub README markdown basics headings lists"],
  ["Web arayüzünden dosya yükle","Dosyaları komut yazmadan da yükleyebilirsin. Add file menüsü, dosyaları bir kutuya sürükle-bırak yapmanı sağlar. Commit, değişikliği kaydedip bir not eklemektir; not, değişikliği kısaca anlatır. Dikkat: CV'nde telefon veya adres varsa yükleme, çünkü repo herkese açık.","1) Repo ana sayfasında Add file menüsüne tıkla. 2) Upload files seçeneğini seç. 3) Dosya Gezgini'nden bilgisayar-rehberim dosyanı kutuya sürükle (isteğe bağlı: kişisel bilgisi olmayan bir ekran görüntüsü de). 4) Aşağıda commit mesajına Bilgisayar rehberimi ekledim yaz. 5) Commit changes düğmesine bas. 6) Dosya listesinde yüklediğin dosyanın adı görünecek.","Dosyanın listede göründüğü repo ekran görüntüsü","upload = yükle, drag and drop = sürükle bırak, commit message = kayıt notu, file list = dosya listesi","GitHub Add file Upload files commit changes tutorial"],
  ["Klasör düzeni ve ikinci dosya","İyi bir repo da düzenli bir klasör gibidir. Dosyaları belge, ekran ve benzeri klasörlerle ayırmak okuyanın işini kolaylaştırır. GitHub web arayüzünde klasör oluşturmak için dosya adına slash (eğik çizgi) yazman yeter.","1) Add file menüsünden Create new file seç. 2) Dosya adı kutusuna rehber/baslangic.md yaz; eğik çizgiyi yazınca klasör oluşur. 3) İçine kısa bir not yaz, örneğin bu klasörde rehberlerim var. 4) Commit changes düğmesine bas. 5) Repo ana sayfasında rehber adlı klasörü göreceksin. 6) README'ye bu klasöre bir satır ekle.","rehber klasörünü gösteren repo ekran görüntüsü","folder = klasör, create new file = yeni dosya oluştur, path = yol, slash = eğik çizgi","GitHub create new folder in repository web interface"],
  ["Profil README: vitrinin girişi","GitHub'da kullanıcı adınla aynı adlı bir public repo açarsan, içindeki README senin profil sayfanın üstünde görünür. Bir tanıtım kartı gibidir. İçine adını, öğrendiklerini ve projelerinin linklerini yazarsın. Kullanıcı adı ile repo adı harfi harfine aynı olmalıdır.","1) Artı simgesi, New repository seç. 2) Repository name kutusuna kendi kullanıcı adını tam olarak yaz. 3) Public ve Add a README file seçeneklerini işaretle. 4) Create repository'ye bas. 5) README.md'yi kalemle aç ve # Merhaba, ben Ad yaz. 6) Altına 3 satırlık tanıtım ve ilk-projem reposuna link ekle. 7) Commit changes ile kaydet. 8) Profil simgene tıklayıp Your profile sayfasına git ve yazının orada göründüğünü kontrol et.","Profil sayfanda README'nin göründüğü ekran görüntüsü","profile README = profil README, username = kullanıcı adı, introduction = tanıtım, link = bağlantı","GitHub profile README create special repository"],
  ["Bu benim portföyümün ilk sayfası","Portföy, yaptıklarının vitrinidir. İşverene yapabildiğini anlatmanın en inandırıcı yolu çalışmanı göstermektir. Bu repo senin ilk portföy sayfandır; ilerledikçe yeni projeler ekleyeceksin. Bir linki paylaşmadan önce bir arkadaşın gibi dışarıdan bakıp kontrol et: yanlış bilgi, özel veri var mı?","1) ilk-projem repo sayfasına git ve README'yi son kez oku. 2) Public yazısını (ad yanında) gör. 3) Tarayıcıda adres çubuğundaki repo linkini kopyala. 4) Tarayıcının gizli (Incognito veya Gizli pencere) moduna geç, linki yapıştır ve oturum açmadan açıldığını gör. 5) Linki CV taslağının Projeler bölümüne ekle ve PDF'i yeniden oluştur. 6) Linki kendine e-posta at.","Repo linkin (github.com/kullaniciadi/ilk-projem) ve gizli pencerede açılmış hali","portfolio = portföy, public link = herkese açık bağlantı, share = paylaş, showcase = vitrin","how to build a beginner portfolio on GitHub"]
  ]}
 ]};

var PATH_SUP={id:"sup",name:"BT Destek",short:"Dinle, çöz, belgele",blurb:"Bilgisayarı bozulan insanın yanına gitmeden önce işin mantığını öğren: bilet sistemi, sorun giderme, hesap ve yetki yönetimi. En sonunda GitHub'a koyabileceğin bir Help Desk portföyün olur.",col:"sup",
 projects:[
 {id:"sup1",lv:1,title:"Kendi Destek Masam: Bilet Sistemi ve Dokümantasyon",weeks:2,tools:"Google Sheets veya Notion, Google Docs, GitHub hesabı",
  why:"BT destek işinin kalbi bilettir: her sorun kayıt altına alınır, sıraya girer, çözülür ve kapanır. Önce kendi küçük destek masanı kurar, 10 sahte vakayı kayda geçirirsin.",
  outcome:["Bilet (ticket), öncelik ve kategori kavramlarını anlatabilirsin","Kendi bilet tablonu kurup 10 vakayı kayda geçirirsin","Bir sorunu başkasının anlayacağı şekilde yazıp kapanış notu bırakırsın"],
  pitch:"I built my own help desk ticket tracker from scratch and logged ten realistic support cases with priority, category and resolution notes.",
  steps:[
  ["Destek masası ne iş yapar?","Help Desk, binanın danışma masası gibidir. Biri gelir, derdini söyler, masa ya çözer ya doğru kişiye yönlendirir. BT desteğinde dert bilgisayar, telefon, internet veya hesap sorunudur. Destek çalışanı kullanıcıya 'kullanıcı' der, müşteri demez (iç destekte).","1) Bir kağıda 'okulda, hastanede, şirkette BT desteğe kim ne için başvurur?' diye 6 örnek yaz. 2) Her örneğin yanına 'acil' veya 'bekleyebilir' yaz. Göreceğin sonuç: 6 satırlık bir örnek listesi.","6 örnekli el yazısı veya dijital liste","help desk = destek masası, user = kullanıcı, issue = sorun, support = destek","what does an IT help desk do beginner"],
  ["Bilet (ticket) nedir?","Bilet, lokantadaki sipariş fişi gibidir. Garson siparişi aklında tutmaz, fişe yazar. Fiş kaybolmaz, sırası bellidir, kim aldı kim getirdi görünür. BT'de her sorun bir bilet olur: numarası, sahibi, durumu vardır.","1) Bir bilette olması gereken 8 bilgiyi tahmin ederek yaz. 2) Arama motorunda 'ticket fields' görsellerine bak. 3) Listeni sadeleştir. Göreceğin sonuç: bilet numarası, tarih, kullanıcı, sorun, kategori, öncelik, durum, çözüm gibi alanlar.","8 alanlı bilet şablonu taslağı","ticket = bilet, status = durum, assignee = atanan kişi, resolution = çözüm","what is a helpdesk ticket fields explained"],
  ["Tablonu kur","Tablo, bilet defterindir. Google Sheets ya da Notion bunun dijital halidir. Her satır bir bilet, her sütun bir bilgidir. Sütun adlarını baştan düzgün koymak sonradan bin kere işini kolaylaştırır.","1) Yeni bir Google Sheets aç. 2) İlk satıra alanları yaz: No, Tarih, Kullanıcı, Sorun, Kategori, Öncelik, Durum, Çözüm. 3) İlk satırı kalın yap ve dondur. Göreceğin sonuç: başlıkları sabit duran boş bir bilet tablosu.","Boş bilet tablosunun ekran görüntüsü","spreadsheet = elektronik tablo, column = sütun, row = satır, freeze = dondur","google sheets freeze header row tutorial"],
  ["Kategori ve durum listeleri","Kategori, çamaşırı renklerine göre ayırmak gibidir. Sonra bulmak kolay olur. Durum ise kargo takibi gibidir: Yeni, İşlemde, Kullanıcıyı Bekliyor, Çözüldü, Kapandı. Seçenekleri serbest yazdırmazsan tablo karışmaz.","1) Kategori listesi yaz: Donanım, Yazılım, Ağ, Hesap ve Parola, Yazıcı, Diğer. 2) Durum listesi yaz: Yeni, İşlemde, Beklemede, Çözüldü, Kapandı. 3) Sheets'te Veri menüsünden 'Veri doğrulama' ile bu sütunlara açılır liste ekle. Göreceğin sonuç: hücreye tıklayınca seçenek listesi açılır.","Açılır listeli sütunların ekran görüntüsü","category = kategori, dropdown = açılır liste, validation = doğrulama, backlog = birikmiş iş","google sheets dropdown list data validation"],
  ["Öncelik: acil ile önemli aynı şey değil","Hastane acilinde herkes aynı anda bakılmaz. Triyaj vardır: kalp krizi önce, burkulma sonra. BT'de de öncelik iki şeye bakar: kaç kişiyi etkiliyor (etki) ve ne kadar çabuk lazım (aciliyet). Bütün şirketin interneti gitti ise yüksek öncelik, tek kişinin ekran parlaklığı düşük öncelik.","1) Öncelik sütununa liste ekle: Kritik, Yüksek, Orta, Düşük. 2) Her seviye için tek cümlelik tanım yaz (örnek: Kritik = herkesin işi durdu). 3) Tanımları ayrı bir 'Kurallar' sekmesine koy. Göreceğin sonuç: 4 seviyenin tanımı olan ikinci bir sekme.","Öncelik tanımları sekmesi","priority = öncelik, impact = etki, urgency = aciliyet, critical = kritik","ticket priority impact urgency matrix beginner"],
  ["İlk 5 sahte vakayı yaz","Kötü bilet: 'bilgisayar çalışmıyor'. İyi bilet: 'Muhasebe, 3. kat, bilgisayar açılıyor ama mavi ekran veriyor, dün güncellemeden sonra başladı'. Doktora gidip 'bir şeyim var' demek yerine belirtiyi anlatmak gibi. Gerçek kişi adı ve gerçek şirket verisi kullanma, sahte isim uydur.","1) Sahte kullanıcı adları uydur (Ayşe, Mehmet gibi). 2) Beş vaka yaz: parola unutma, yazıcı çıktı vermiyor, wifi bağlanmıyor, e-posta dolu, ekran bozuk. 3) Her vakada belirtiyi, ne zaman başladığını ve ne denendiğini yaz. Göreceğin sonuç: 5 dolu satır.","5 vakalı tablo","symptom = belirti, reproduce = tekrar üretmek, description = açıklama, details = ayrıntılar","how to write a good support ticket description"],
  ["Sonraki 5 vaka ve çözüm notu","Çözüm notu, tamirci faturası gibidir. 'Ne yapıldı' yazılmazsa aynı sorun gelince herkes baştan başlar. İyi not kısa ve nettir: neden oldu, ne yapıldı, kullanıcı doğruladı mı.","1) Beş vaka daha ekle: yavaş bilgisayar, VPN bağlanmıyor, hesap kilitlendi, yeni çalışan kurulumu, telefon e-posta eşitleme. 2) Her bilet için Çözüm sütununa 1-2 cümle yaz. 3) Durumunu Kapandı yap. Göreceğin sonuç: toplam 10 kapanmış bilet.","10 vakalı tam bilet tablosu","root cause = kök neden, workaround = geçici çözüm, closed = kapandı, verify = doğrulamak","ticket resolution notes best practices helpdesk"],
  ["Tablodan özet çıkar","Veri, tek başına yığındır; saymaya başlayınca bilgiye dönüşür. Örneğin 'en çok hangi kategoriden bilet geliyor' sorusu, hangi eğitimin verilmesi gerektiğini gösterir. Sheets'in Pivot tablosu bunu otomatik sayar.","1) Tabloyu seç. 2) Ekle menüsünden Pivot tablo aç. 3) Satıra Kategori, değere Bilet No (COUNTA) koy. Göreceğin sonuç: her kategoride kaç bilet olduğunu gösteren küçük tablo.","Pivot tablo ekran görüntüsü","pivot table = özet tablo, count = say, summary = özet, trend = eğilim","google sheets pivot table beginner count"],
  ["README yaz ve GitHub'a yükle","README, projenin kapağıdır. İşe bakan kişi ilk onu açar. Anlatacağın şey: bu proje ne, nasıl kullanılır, içinde ne var. Gerçek kişi bilgisi koymadığından emin ol.","1) GitHub'da 'it-support-desk' adlı depo (repository) aç. 2) Tabloyu CSV olarak indirip yükle. 3) README.md içine proje amacı, alan açıklamaları, öncelik tanımları ve 3 örnek bilet yaz. 4) Ekran görüntüsünü ekle. Göreceğin sonuç: GitHub sayfanda düzgün görünen bir proje.","GitHub depo bağlantısı: README, CSV ve ekran görüntüsü","repository = depo, README = tanıtım dosyası, upload = yüklemek, commit = kaydet","how to create github repository upload files readme beginner"]
  ]},
 {id:"sup2",lv:1,title:"Windows ve Ağ Sorun Giderme Günlüğü",weeks:3,tools:"Kendi Windows bilgisayarın, Komut İstemi, Olay Görüntüleyicisi, Google Docs veya Markdown",
  why:"Destek çalışanı tahmin etmez, sistemli bakar. Kendi bilgisayarında temel araçları dener, her sorun için belirti-neden-çözüm kartı yazarsın. Bu kartlar ileride bilgi bankası makalelerine dönüşür.",
  outcome:["ipconfig, ping ve nslookup ile ağ sorununu adım adım daraltırsın","Disk, sürücü, güvenli mod ve olay günlüğü araçlarını tanırsın","8 adet belirti-neden-çözüm kartı yazıp GitHub'a koyarsın"],
  pitch:"I wrote a Windows and network troubleshooting journal with symptom, cause and fix cards, tested on my own computer.",
  steps:[
  ["Sorun gidermenin mantığı","Doktor önce hastaya sorular sorar, sonra muayene eder, sonra ilaç yazar. Sorun gidermede de sıra aynıdır: 1) belirtiyi anla, 2) neyin değiştiğini sor, 3) en basit ihtimalden başla, 4) tek seferde tek şey değiştir, 5) sonucu doğrula, 6) not al.","1) Bu altı basamağı bir kağıda yaz. 2) 'Yazıcı çalışmıyor' sorununa altı basamağı sırayla uygula ve her basamağa 1 cümle yaz. Göreceğin sonuç: yeniden kullanabileceğin bir sorun giderme sırası.","6 basamaklı sorun giderme şablonu","troubleshooting = sorun giderme, symptom = belirti, hypothesis = varsayım, verify = doğrula","IT troubleshooting methodology steps beginner"],
  ["Belirti-neden-çözüm kartı","Kart, tarif defteri gibidir. Tarifte malzeme, yapılış ve sonuç vardır. Bizim kartta: Belirti (ne görülüyor), Neden (muhtemelen niye), Çözüm (adımlar), Doğrulama (düzeldi mi). Bu günlüğün her sayfası böyle olacak.","1) Google Docs'ta 'Kart Şablonu' adlı bir sayfa aç. 2) Dört başlığı yaz: Belirti, Neden, Çözüm, Doğrulama. 3) Altına tarih ve Windows sürümü için iki satır ekle. Göreceğin sonuç: kopyalayıp doldurulabilir boş kart.","Kart şablonu belgesi","symptom = belirti, cause = neden, solution = çözüm, template = şablon","IT knowledge base article template symptom cause solution"],
  ["Ağ bağlantısı: ipconfig","Evin adresi olmadan postacı gelmez. Bilgisayarın da ağda bir adresi vardır: IP adresi. ipconfig komutu o adresi gösterir. Yanında 'ağ geçidi' (gateway) yazar: bu, evinin kapısı olan modemin adresidir.","1) Win+R tuşlarına bas, cmd yaz, Enter. 2) Siyah pencerede ipconfig yaz, Enter. 3) 'IPv4 Adresi' ve 'Varsayılan Ağ Geçidi' satırlarını bul. Göreceğin sonuç: 192.168 ile başlayan bir adres olması çok yaygındır (evlerde sık görülür).","ipconfig çıktısının ekran görüntüsü (adresleri karartabilirsin) ve ilk kartın","IP address = IP adresi, gateway = ağ geçidi, adapter = ağ kartı, command prompt = komut istemi","ipconfig command explained beginners"],
  ["Ağ bağlantısı: ping","Ping, birine 'orada mısın?' diye seslenmek gibidir. Karşıdan cevap gelirse hat çalışıyordur, süre de cevabın ne kadar çabuk geldiğini gösterir. Sırayla seslen: önce kendine, sonra modeme, sonra internete.","1) Komut istemine ping 127.0.0.1 yaz (kendine). 2) ping yazıp bir boşluk bırak ve ağ geçidi adresini yaz (modeme). 3) ping 8.8.8.8 yaz (internete; bu, Google'ın herkese açık DNS adresidir). Göreceğin sonuç: hangi basamakta cevap kesiliyorsa sorun oradadır. Bu sırayı karta yaz.","3 ping çıktısı ve 'nerede kesilirse ne anlama gelir' tablosu","ping = yoklama, reply = cevap, timeout = zaman aşımı, packet loss = paket kaybı","ping command troubleshoot network step by step"],
  ["DNS: internetin telefon rehberi","İnsan google.com yazar, bilgisayar ise sayı adresiyle konuşur. DNS, ismi sayıya çeviren telefon rehberidir. Rehber bozulursa 'internet var ama site açılmıyor' olur. Belirti: ping 8.8.8.8 çalışır ama ping google.com çalışmaz.","1) ping google.com dene. 2) nslookup google.com yaz. 3) ipconfig /flushdns komutuyla önbelleği temizle. 4) Tekrar dene. Göreceğin sonuç: nslookup bir adres listesi döndürür.","DNS kartı: belirti, nslookup çıktısı, flushdns çözümü","DNS = alan adı sistemi, cache = önbellek, flush = temizlemek, resolve = çözümlemek","DNS explained simple nslookup flushdns"],
  ["Disk temizleme ve yer açma","Disk dolunca bilgisayar, tıka basa dolu bir depo gibi yavaşlar. Önce neyin yer kapladığına bak, sonra geçici dosyaları sil. Önemli dosyaya dokunma, emin değilsen silme.","1) Win+R, cleanmgr yaz, Enter. 2) Sürücüyü seç ve silinecek kategorileri işaretle (geçici dosyalar gibi). 3) Ayarlar içindeki Depolama sayfasında en çok yer tutanları gör. Göreceğin sonuç: temizlik öncesi ve sonrası boş alan farkı.","Önce/sonra boş alan ekran görüntüsü ve disk kartı","disk cleanup = disk temizleme, temporary files = geçici dosyalar, storage = depolama, free space = boş alan","windows disk cleanup free up space beginner"],
  ["Sürücü (driver) sorunları","Sürücü, tercümandır. Windows ile ekran kartı arasında konuşmayı çevirir. Tercüman yanlışsa cihaz ya çalışmaz ya garip çalışır. Aygıt Yöneticisi'nde sarı ünlem, sorunlu cihazın işaretidir.","1) Win+R, devmgmt.msc yaz, Enter. 2) Listede sarı ünlemli cihaz ara. 3) Bir cihaza sağ tıkla, Özellikler'de durumunu oku. 4) Sadece okumak yeterli; değiştirme gerekmiyorsa dokunma. Göreceğin sonuç: kendi cihazlarının listesi.","Aygıt Yöneticisi ekran görüntüsü ve sürücü kartı (ne zaman güncelleme, ne zaman geri alma)","driver = sürücü, device manager = aygıt yöneticisi, update = güncellemek, roll back = geri almak","windows device manager driver problem yellow exclamation"],
  ["Güvenli mod","Güvenli mod, arabayı yedek lastikle çalıştırmak gibidir. Yalnızca gerekli parçalar çalışır. Bilgisayar normal açılmıyorsa sorunun sürücü mü program mı olduğunu anlamak için kullanılır. Bu adımı dikkatli ve sadece kendi bilgisayarında dene.","1) Önemli işlerini kaydet. 2) Başlat menüsünde Güç düğmesine bas, Shift tuşunu basılı tutarak Yeniden Başlat'a tıkla. 3) Sorun Gider, Gelişmiş Seçenekler, Başlangıç Ayarları yolunu izle. 4) Güvenli mod seçeneğini seç. Göreceğin sonuç: ekranda 'Güvenli Mod' yazısı ve düşük çözünürlük.","Güvenli modda ekran görüntüsü ve 'ne zaman kullanılır' kartı","safe mode = güvenli mod, restart = yeniden başlat, startup = açılış, boot = açılmak","how to boot windows safe mode shift restart"],
  ["Olay Görüntüleyicisi: bilgisayarın karnesi","Windows her önemli olayı bir güvenlik kamerası gibi kaydeder. Mavi ekran veya beklenmedik kapanma sonrası 'ne oldu' sorusunun cevabı burada. Kırmızı 'Hata' ve sarı 'Uyarı' kayıtlarına bakılır.","1) Win+R, eventvwr yaz, Enter. 2) Windows Günlükleri, Sistem'i aç. 3) Tarihe göre sırala, bir Hata kaydına çift tıkla. 4) Olay kimliğini (Event ID) ve kaynak adını not al. Göreceğin sonuç: bir hata kaydının ayrıntı penceresi.","Bir hata kaydının ekran görüntüsü ve kart: kayıt nasıl aranır","event log = olay günlüğü, error = hata, warning = uyarı, source = kaynak","windows event viewer beginner system log errors"],
  ["Günlüğü derle ve GitHub'a koy","Tek tek kartlar dağınık notlardır; bir araya gelince el kitabı olur. Hedef: 8 kart, kısa bir içindekiler listesi, ve bir sayfa 'sorun gidermede altın kurallar'. Kendi bilgisayarına ait özel bilgileri (adres, kullanıcı adı) karart.","1) 8 kartı tek belgede topla (ağ 3, disk, sürücü, güvenli mod, olay günlüğü, bir tane de seçtiğin ek sorun). 2) Başa içindekiler ekle. 3) Markdown olarak kaydet. 4) 'windows-troubleshooting-journal' deposuna yükle. Göreceğin sonuç: GitHub'da okunabilir bir günlük.","GitHub bağlantısı: README ve 8 kartlı günlük","journal = günlük, table of contents = içindekiler, redact = karartmak, guide = rehber","markdown documentation github readme examples"]
  ]},
 {id:"sup3",lv:2,title:"Kullanıcı Hesapları, Yetki ve Güvenlik Temelleri",weeks:4,tools:"VirtualBox, Windows Server veya Windows evaluation sürümü (kendi sanal makinende), Google Sheets, Google Docs",
  why:"Destek çalışanının günlük işinin büyük kısmı hesap açmak, parola sıfırlamak ve 'bu kişi neye erişebilsin' sorusuna cevap vermektir. Bunu zararsız bir sanal makinede uygulayıp prosedür ve yetki matrisi çıkarırsın.",
  outcome:["Kullanıcı, grup, izin ve Active Directory kavramlarını anlatabilirsin","Sanal makinede kullanıcı, grup ve klasör izni laboratuvarı kurarsın","Parola sıfırlama prosedürü, yetki matrisi ve MFA anlatımı yazarsın"],
  pitch:"I built a virtual lab for user accounts and permissions, then documented a password reset procedure and an access matrix.",
  steps:[
  ["Hesap, kimlik ve yetki","Otel gibi düşün. Kimlik: seni tanır (resepsiyonda adın). Doğrulama: sen o kişi misin (kimliğini göstermen). Yetki: hangi odalara girebilirsin (kart anahtarın). BT'de bu üçü hep ayrı sorulur. İkinci kelime: en az yetki ilkesi, yani herkese yalnızca işi için gereken kadar anahtar.","1) Üç kavramı kendi cümlelerinle yaz. 2) Bir hastane çalışanı için örnek ver: kim girebilir, kim giremez. Göreceğin sonuç: yarım sayfa kavram notu.","Kavram notu: kimlik, doğrulama, yetki, en az yetki","authentication = kimlik doğrulama, authorization = yetkilendirme, identity = kimlik, least privilege = en az yetki","authentication vs authorization simple explanation"],
  ["Active Directory kavramı","Active Directory (AD), şirketin kimlik defteridir. Çalışanların hesapları ve grupları tek yerde durur, bir hesap açınca o kişi bütün bilgisayarlarda tanınır. Bu defteri tutan sunucuya etki alanı denetleyicisi (domain controller) denir. Şirketler çalışanları bu defterden yönetir.","1) Bir sayfaya şirket örneği çiz: 1 sunucu, 3 bilgisayar, 5 kullanıcı. 2) Okla göster: kullanıcı giriş yapınca bilgisayar defterden kimliğini sorar. Göreceğin sonuç: AD'nin nasıl çalıştığını gösteren basit şema.","Elle veya çizim aracıyla yapılmış AD şeması","Active Directory = dizin hizmeti, domain = etki alanı, domain controller = etki alanı denetleyicisi, directory = dizin","active directory explained simple for beginners"],
  ["Sanal makine nedir, VirtualBox kur","Sanal makine, bilgisayarın içinde başka bir bilgisayar çalıştırmaktır; deneme odası gibidir. Bozarsan ana bilgisayarın etkilenmez. VirtualBox bunun ücretsiz aracıdır. Bilgisayarında yeterli bellek (RAM) olması gerekir; az ise yerel hesap laboratuvarıyla devam et.","1) VirtualBox'ı resmi sitesinden indir ve kur. 2) Microsoft'un resmi sitesinden Windows Server veya Windows değerlendirme (evaluation) ISO dosyasını indir. 3) VirtualBox'ta Yeni sanal makine oluştur, ISO'yu seç. Göreceğin sonuç: listede yeni makinen.","VirtualBox'ta sanal makine listesi ekran görüntüsü","virtual machine = sanal makine, host = ana bilgisayar, guest = konuk sistem, ISO = disk kalıbı","virtualbox install windows evaluation vm beginner"],
  ["Windows'u sanal makineye kur ve anlık görüntü al","Kurulum bitince 'anlık görüntü' (snapshot) al. Bu, oyundaki kayıt noktasıdır. Bir şeyi bozarsan geri dönersin. Deneme yapmadan önce her zaman al.","1) Sanal makineyi başlat ve kurulum adımlarını izle. 2) Yönetici parolasını güvenli bir yere yaz. 3) VirtualBox menüsünden Makine, Anlık Görüntü Al seç, adı 'temiz-kurulum' olsun. Göreceğin sonuç: Windows masaüstü ve anlık görüntü listesi.","Çalışan sanal makine ve anlık görüntü ekran görüntüsü","snapshot = anlık görüntü, install = kurmak, administrator = yönetici, restore = geri yüklemek","virtualbox snapshot take restore tutorial"],
  ["Yerel kullanıcı ve grup oluştur","Grup, sınıf listesi gibidir. Tek tek öğrenciye değil 'sınıfa' yetki verirsin. Yerel kullanıcılar yalnızca o bilgisayarın içinde geçerlidir. Server kurduysan Active Directory bölümünü de ek olarak dene.","1) Sanal makinede Win+R, lusrmgr.msc yaz (Pro/Server sürümlerinde açılır). 2) Üç kullanıcı oluştur: ayse, mehmet, deniz. 3) Muhasebe ve Satis adlı iki grup aç. 4) Ayşe'yi Muhasebe'ye, Mehmet'i Satis'a ekle. Göreceğin sonuç: grup içinde üyelerin listesi.","Kullanıcı ve grup ekranı görüntüsü","user = kullanıcı, group = grup, member = üye, local = yerel","create local user and group windows lusrmgr"],
  ["Klasör izni laboratuvarı","İzin, odanın anahtarlığıdır: oku, yaz, değiştir, tam denetim. Mantık: izni kişiye değil gruba ver. Bu, yeni çalışan geldiğinde tek tek ayar yapmayı önler.","1) Diskte Muhasebe-Belgeleri ve Satis-Belgeleri adlı iki klasör aç. 2) Klasöre sağ tıkla, Özellikler, Güvenlik sekmesine gir. 3) Muhasebe grubuna yalnızca ilk klasör için Değiştir izni ver. 4) Satis grubuna ikinci klasör için ver. 5) Ayşe ile giriş yap, ikinci klasörü açmayı dene. Göreceğin sonuç: erişim reddedildi mesajı.","İzin ekranı ve 'erişim reddedildi' mesajı ekran görüntüleri","permission = izin, read = oku, write = yazmak, access denied = erişim reddedildi","windows folder permissions security tab beginner"],
  ["Parola sıfırlama prosedürü","Parola sıfırlamak banka şubesinde kimlik göstermeden kartı yeniden basmak gibidir; önce kimliği doğrularsın. Aksi halde bir dolandırıcı 'ben Ayşe'yim' diyerek hesabı ele geçirir. Prosedür sırası: kimlik doğrula, geçici parola ver, ilk girişte değiştirt, bileti kaydet.","1) Kullanıcı hesabına sağ tıkla, Parolayı Ayarla ile yeni geçici parola belirle. 2) 'Kullanıcı ilk girişte parolayı değiştirmeli' kutusunu işaretle. 3) Giriş yap ve değiştirmeyi gör. 4) Bu adımları yeni bir belgeye yaz. Göreceğin sonuç: giriş ekranında parolayı değiştirme isteği.","1 sayfalık parola sıfırlama prosedürü: kimlik doğrulama soruları, adımlar, bilet kaydı","password reset = parola sıfırlama, verify identity = kimlik doğrulamak, temporary = geçici, policy = politika","help desk password reset procedure verify identity"],
  ["Hesap kilitleme ve devre dışı bırakma","Biri işten ayrılınca hesabı silmeyiz; önce kapatırız (devre dışı). Anahtarı kasada tutmak gibi: kapı kapalı ama bilgi duruyor. Birkaç yanlış parola sonrası otomatik kilit de bir güvenlik önlemidir.","1) Mehmet hesabını açıp 'Hesap devre dışı' kutusunu işaretle. 2) Giriş yapmayı dene ve mesajı oku. 3) Hesabı yeniden etkinleştir. 4) 'İşten ayrılma' ve 'hesap kilitlendi' için iki kısa prosedür yaz. Göreceğin sonuç: devre dışı hesap giriş mesajı.","2 prosedür kartı ve ekran görüntüsü","disable account = hesabı devre dışı bırakmak, lockout = kilitlenme, offboarding = işten ayrılma süreci, enable = etkinleştirmek","windows disable user account vs delete offboarding"],
  ["Yetki matrisi","Matris, sınıf yoklama çizelgesi gibidir. Satırlarda roller, sütunlarda kaynaklar. Kesişimde ne yapabildikleri yazar. Bu tablo, 'kim neye erişir' sorusunun tek sayfalık cevabıdır.","1) Sheets'te yeni sayfa aç. 2) Satırlar: Muhasebe, Satış, BT Destek, Yönetici. 3) Sütunlar: Muhasebe-Belgeleri, Satis-Belgeleri, Yazıcı, Sunucu Yönetimi. 4) Her hücreye Yok, Oku, Değiştir veya Tam yaz. 5) En az yetki ilkesine uy. Göreceğin sonuç: dolu bir 4x4 tablo.","Yetki matrisi tablosu","access matrix = erişim matrisi, role = rol, resource = kaynak, full control = tam denetim","role based access control matrix example"],
  ["MFA'yı sade dille anlat","MFA (çok faktörlü doğrulama), evin kapısına hem anahtar hem şifre koymak gibidir. Faktörler: bildiğin şey (parola), sahip olduğun şey (telefon), olduğun şey (parmak izi). Parola çalınsa bile ikinci faktör kapıyı kapalı tutar. Kullanıcıya şikayetsiz kabul ettirmek de destek işidir.","1) Kendi e-posta hesabında MFA aç. 2) Kullanıcıya gönderilecek 120 kelimelik sade bir duyuru yaz. Teknik terim kullanma. 3) Sık sorulan 5 soruyu cevapla (telefon kaybolursa ne olur gibi). Göreceğin sonuç: kullanıcıya gönderilebilir duyuru ve SSS.","MFA kullanıcı duyurusu ve 5 soruluk SSS","MFA = çok faktörlü doğrulama, factor = faktör, authenticator = doğrulayıcı, backup code = yedek kod","explain MFA to non technical users help desk"],
  ["Laboratuvar raporu ve GitHub","Deney yaptıysan rapor yazılır; yoksa kimse yaptığını bilmez. Raporda kurulum, adımlar, karşılaşılan sorunlar ve ekran görüntüleri olur. Parolaları, lisans anahtarlarını ve gerçek kişi bilgilerini kesinlikle koyma.","1) 'access-management-lab' adlı depo aç. 2) README'ye laboratuvarın amacını ve kurulumu yaz. 3) Prosedürleri ve yetki matrisini yükle. 4) Ekran görüntülerinden hassas bilgiyi kontrol et. Göreceğin sonuç: GitHub'da dolu bir laboratuvar deposu.","GitHub bağlantısı: README, prosedürler, yetki matrisi","lab report = laboratuvar raporu, procedure = prosedür, screenshot = ekran görüntüsü, sensitive data = hassas veri","how to document a home lab github readme"]
  ]},
 {id:"sup4",lv:3,cap:true,title:"Kapston: Help Desk Portföyü (Bilgi Bankası + SLA + Rapor)",weeks:6,tools:"Google Sheets, Google Docs veya Markdown, Git ve GitHub, LinkedIn ve CV",
  why:"sup1-sup3'te parçaları ayrı ayrı yaptın. Bu kapstonda hepsini gerçek bir destek ekibinin kullanacağı bütüne çevirirsin: bilgi bankası, SLA tablosu, haftalık rapor ve süreç dokümanı. Sonunda işe başvururken gösterebileceğin tek bir GitHub deposu olur.",
  outcome:["20 makalelik bir bilgi bankası yazarsın","SLA tablosu ve haftalık metrik raporu hazırlarsın","ITIL gibi çerçevelerin temel kavramlarını (olay, talep, problem, değişiklik) ayırt edersin","Portföyü GitHub'a yükler ve CV'ne doğru cümlelerle yazarsın"],
  pitch:"I built a complete help desk portfolio with a 20-article knowledge base, an SLA table, a weekly metrics report and a support process document, all published on GitHub.",
  steps:[
  ["Portföyün planı ve depo iskeleti","Portföy, mimarın maketi gibidir. İş verenin gözü önce dosya düzenine bakar. Düzenli klasörler 'bu kişi düzenli çalışıyor' mesajı verir. Önceki projelerinden işe yarayanları bu çatıya taşıyacaksın.","1) GitHub'da 'helpdesk-portfolio' deposunu aç. 2) Klasörler oluştur: knowledge-base, sla, reports, process, labs. 3) sup1-sup3 çıktılarından uygun olanı labs içine kopyala. 4) README'ye 5 satırlık içindekiler yaz. Göreceğin sonuç: düzenli klasör yapısı.","Depo ekran görüntüsü: klasör yapısı ve ana README","portfolio = portföy, folder structure = klasör yapısı, repository = depo, overview = genel bakış","IT help desk portfolio github structure example"],
  ["ITIL nedir? Temel kavramlar","ITIL, BT hizmetlerinin nasıl yönetileceğine dair yaygın bir en iyi uygulamalar çerçevesidir; yemek tarifi kitabı gibi. Bu projede sertifika sınavı hedeflemiyoruz, yalnızca kavramları öğrenip onlara hazırlık için temel kuruyoruz. Dört kelime: Olay (bozuk bir şey: yazıcı çalışmıyor), Talep (istenen bir şey: yeni fare), Problem (olayın arkasındaki ortak neden), Değişiklik (sistemde planlı bir güncelleme).","1) Dört kavramı kendi sözlerinle tanımla. 2) Her biri için sup1 biletlerinden bir örnek bul. 3) Sheets'e 'Kavram, Tanım, Örnek' adlı 4 satırlık tablo yap. Göreceğin sonuç: dört kavramı ayıran tablo.","ITIL kavram tablosu (4 satır)","incident = olay, service request = hizmet talebi, problem = problem, change = değişiklik","ITIL incident vs service request vs problem vs change simple"],
  ["Bilgi bankası makalesinin anatomisi","Bilgi bankası, mutfak tarif defteridir. İyi makale başkasının tek başına uygulayabileceği kadar nettir. Yapı: başlık (belirti gibi yaz), kime, sorun, adımlar, olmazsa ne yapılır, ilgili makaleler. Dil sade olmalı, teknik terim gerekiyorsa yanında açıklanmalı.","1) Tek bir makale şablonu yap: Başlık, Kime Uygun, Belirti, Çözüm Adımları, Hâlâ Olmazsa, Etiketler. 2) sup2'den bir kartı bu şablona çevir. 3) Bir arkadaşına ver, tek başına uygulayabiliyor mu bak. Göreceğin sonuç: test edilmiş ilk makale.","Şablon ve ilk makale (Markdown)","knowledge base = bilgi bankası, article = makale, step by step = adım adım, tags = etiketler","how to write knowledge base articles IT support"],
  ["Makaleler 1-8: hesap ve parola","Önce en sık gelen konulardan başla; çünkü en çok işe yarayan bunlar. Her makale bir sorunu çözsün, tek konuda kalsın. Kısa başlıklar: 'Parolamı unuttum', 'Hesabım kilitlendi'.","1) Sekiz makale yaz: parola unutma, hesap kilitlendi, MFA kurulumu, MFA telefon kaybı, e-posta imzası, e-posta dolu, wifi bağlanmıyor, VPN bağlanmıyor. 2) Her birini şablona göre yaz. 3) knowledge-base klasörüne yükle. Göreceğin sonuç: 8 makale dosyası.","knowledge-base klasöründe 8 makale","password = parola, lockout = kilitlenme, email = e-posta, connect = bağlanmak","password reset article example knowledge base"],
  ["Makaleler 9-14: Windows ve donanım","Burada sup2 günlüğünden yararlanırsın. Aynı bilgiyi kullanıcı için sadeleştir. Teknik kullanıcıya değil, ilk kez bilgisayar kullanan birine yaz. Her makaleye 'bu adımlar işe yaramazsa bilet aç' notu ekle.","1) Altı makale yaz: bilgisayar yavaş, disk dolu, internet var site açılmıyor, yazıcıya bağlanamıyorum, ekran görüntü yok, bilgisayar açılmıyor. 2) Yazarken ipconfig, ping ve disk temizleme adımlarını kullan. Göreceğin sonuç: toplam 14 makale.","14 makalelik klasör","slow computer = yavaş bilgisayar, printer = yazıcı, display = ekran, power = güç","IT support common problems article ideas"],
  ["Makaleler 15-20: yeni çalışan ve güvenlik","Yeni çalışan kurulumu ve güvenlik uyarıları, destek masasının önleyici kısmıdır. Sorun olmadan önce anlatılan makale, çözümden değerlidir. Kullanıcıları korkutmadan, rahat anlat.","1) Altı makale yaz: yeni çalışan hesap kurulum kontrol listesi, işten ayrılan çalışan kontrol listesi, şüpheli e-posta nasıl anlaşılır, dosya paylaşımı güvenli mi, yedekleme nasıl yapılır, ekran kilitleme. 2) Hepsini yükle. Göreceğin sonuç: tam 20 makale.","20 makalelik bilgi bankası ve içindekiler dosyası","onboarding = işe yeni başlama süreci, checklist = kontrol listesi, phishing = oltalama, backup = yedek","IT onboarding checklist new employee template"],
  ["SLA nedir? Tabloyu kur","SLA (hizmet seviyesi anlaşması), pizzacının '30 dakikada gelmezse bedava' sözü gibidir. Destek ekibi ne kadar sürede ilk cevap verecek, ne kadar sürede çözecek, bunu önceden söyler. Bu sayılar sana ait uydurma değil, kendi projen için belirlediğin hedeflerdir; bunu belgede belirt.","1) sup1 öncelik seviyelerini tabloya al. 2) Her seviye için 'ilk cevap hedefi' ve 'çözüm hedefi' sütunları ekle. 3) Süreleri kendi proje varsayımın olarak yaz ve 'örnek hedefler' diye işaretle. 4) sla klasörüne yükle. Göreceğin sonuç: 4 satırlık SLA tablosu.","SLA tablosu (sla klasöründe)","SLA = hizmet seviyesi anlaşması, response time = ilk cevap süresi, resolution time = çözüm süresi, target = hedef","SLA help desk response time resolution time explained"],
  ["Haftalık metrik raporu","Rapor, araba göstergesi paneli gibidir. Hızı, yakıtı, ısıyı gösterir; böylece sürücü karar verir. Ölçülecekler: açılan bilet, kapanan bilet, kategoriye göre dağılım, SLA'ya uyum oranı. Verini kendi sahte biletlerinden üret ve sahte olduğunu raporda yaz.","1) sup1 tablosunu genişlet: 30 sahte bilet ve açılış-kapanış tarihleri ekle. 2) Pivot ile kategori ve haftalık dağılımı çıkar. 3) Sheets'te bir sütun ve bir çubuk grafik ekle. 4) Yanına 5 cümlelik yorum yaz: ne oldu, neden, ne yapılmalı. Göreceğin sonuç: grafikli bir haftalık rapor.","Haftalık rapor (PDF veya ekran görüntüsü) ve veri tablosu","metric = ölçüt, report = rapor, chart = grafik, trend = eğilim","help desk weekly report metrics ticket volume resolution"],
  ["Destek süreci dokümanı","Süreç belgesi, yangın tatbikatı talimatı gibidir. Panikte kimse düşünmez, adım adım izler. Akış: bilet gelir, sınıflandırılır, öncelik verilir, çözülür veya üst seviyeye aktarılır, kullanıcı onaylar, bilet kapanır. Üst seviye aktarım 'ben çözemiyorum, uzmanına veriyorum' demektir.","1) Bir sayfalık akış şeması çiz (draw.io veya Docs çizim). 2) Rolleri yaz: kullanıcı, 1. seviye destek, 2. seviye destek. 3) Üst seviyeye ne zaman aktarılır, 3 kural yaz. 4) process klasörüne yükle. Göreceğin sonuç: şema ve 1-2 sayfalık süreç belgesi.","Süreç akış şeması ve süreç belgesi","workflow = iş akışı, escalation = üst seviyeye aktarma, tier 1 = birinci seviye destek, handoff = devir","IT support process workflow tier 1 tier 2 escalation"],
  ["Gerçek bir kullanıcı gibi test et","Yazdığın belgeleri bir başkası okumadan bitmiş sayma. Yemeği yapan kişi tuzu kendi tatmaz. Birine 3 makaleyi ver, sadece makaleye bakarak sorunu çözmesini iste, nerede tıkandığını izle.","1) Tanıdığın birine 3 makale ver. 2) Onu bölmeden izle, tıkandığı yeri not al. 3) Makaleyi düzelt. 4) Düzeltme notunu depoya 'iyileştirmeler.md' olarak ekle. Göreceğin sonuç: değişiklik kaydı.","iyileştirmeler.md dosyası: önce/sonra","usability test = kullanılabilirlik testi, feedback = geri bildirim, improve = iyileştirmek, revision = düzeltme","how to test documentation with a real user"],
  ["Depoyu parlat ve GitHub'a yükle","İşveren birkaç dakika bakar. İlk ekranda ne olduğu, nasıl gezileceği ve neyi gösterdiğin net olmalı. README, dükkanın vitrini. Bölümler: ne yaptım, içinde ne var, nasıl okunur, öğrendiklerim. Gizli bilgi (parola, gerçek isim, gerçek şirket verisi) kalmadığından emin ol.","1) README'yi yeniden yaz: 3 cümlelik özet, klasör tablosu, 3 örnek bağlantı. 2) Tüm dosyalarda gizli bilgi taraması yap. 3) Depo açıklamasını ve konu etiketlerini (topics) ekle. 4) Ana sayfaya bir ekran görüntüsü koy. Göreceğin sonuç: açıldığında ne olduğu anlaşılan depo.","Son halde GitHub deposu bağlantısı","README = tanıtım dosyası, topic = konu etiketi, description = açıklama, public = herkese açık","how to write a great github readme portfolio project"],
  ["CV ve LinkedIn'e yaz","CV'de 'bilgi bankası yazdım' demek yetmez; ne yaptığını ve çıktısını göster. Fiille başla ve çıktıyı belirt. Rakam kullanacaksan yalnızca gerçek olanı yaz (20 makale, 4 öncelik seviyesi gibi kendi yaptıkların). Uydurma etki iddiası ekleme.","1) CV'nde Projeler bölümüne 3 madde yaz. Örnek: 20 makalelik bilgi bankası hazırladım. 2) Depo bağlantısını ekle. 3) LinkedIn'de Öne Çıkanlar bölümüne depoyu ekle. 4) İngilizce 3 cümlelik kendini tanıtma metni yaz. Göreceğin sonuç: güncellenmiş CV ve LinkedIn sayfası.","CV projeler bölümü ve LinkedIn öne çıkanlar ekran görüntüsü","resume = özgeçmiş, project = proje, featured = öne çıkan, entry level = başlangıç seviyesi","entry level IT help desk resume projects section"]
  ]}
]};

var PATH_GOLD={id:"gold",name:"Altın Vuruş",short:"Tüm becerilerin tek projede",blurb:"Şimdiye kadar öğrendiğin her şey tek bir gerçek üründe birleşir: küçük bir BT Destek Masası servisi. Planlar, ağdaki yerini çizer, kodlar, test eder, güvenliğini kurar, buluta koyar, İngilizce belgelersin. Sonunda GitHub'da duran, mülakatta anlatabileceğin tek büyük bir portföy projen olur. Her adım, ilgili dersteki yetkinliğin yeterince gelişmişse açılır.",col:"gold",
 projects:[
 {id:"gold1",lv:3,cap:true,title:"Altın Vuruş: Güvenli, Test Edilmiş, Bulutta Çalışan Destek Masası Servisi",weeks:12,tools:"Bilgisayarın, Visual Studio Code, .NET SDK 8 veya üstü, Git ve GitHub hesabı, Cisco Packet Tracer veya diagrams.net, Docker Desktop (isteğe bağlı), ücretsiz katmanı olan bir bulut hesabı",
  why:"Tek tek dersler parçadır, bu proje ise parçaları birleştiren makinedir. Kullanıcıların bilet açtığı, destek ekibinin gördüğü ve durumları değiştirdiği gerçek bir servis yaparsın. İş görüşmesinde 'ne yaptın' sorusuna tek bir güçlü cevabın olur: planladım, kodladım, test ettim, güvenli hale getirdim, yayınladım, belgeledim.",
  outcome:["Bilet açan, listeleyen ve durumunu değiştiren yetkili bir C# web servisini baştan sona yazarsın","Servisi otomatik testlerle, güvenlik kurallarıyla ve GitHub Actions ile bulutta çalışır hale getirirsin","İngilizce README, olay müdahale planı, CV cümleleri ve mülakat anlatımıyla projeyi portföyüne koyarsın"],
  pitch:"I designed, built, tested, secured and deployed a small help desk ticket service, and documented it in English with a CI pipeline and an incident response plan.",
  steps:[
  ["1. Planlama ve bilet kuralları","Bina yapmadan önce plan çizilir. Plansız yazılan kod, planı olmayan inşaata benzer: duvar çıkar ama kapı yeri unutulur. Burada üç şeye karar verirsin: kim kullanacak (roller), bilet neleri taşıyacak (alanlar), bilet hangi yolları izleyecek (durum akışı). Destek masası dersinde kurduğun bilet mantığını şimdi yazılıma çeviriyorsun.","1) Bilgisayarda helpdesk-gold adlı bir klasör aç, VS Code ile aç, terminalde git init yaz. 2) docs/PLAN.md oluştur ve üç rolü yaz: Kullanıcı, Destek Elemanı, Yönetici; her rol için yapabildiği 3 işi listele. 3) Aynı dosyaya bilet alanlarını yaz: Id, Başlık, Açıklama, Kategori, Öncelik, Durum, Açan, Atanan, Açılış zamanı, Güncelleme zamanı. 4) Durum akışını yaz: Yeni, İşlemde, Beklemede, Çözüldü, Kapandı; hangi durumdan hangisine geçilebileceğini ok işaretiyle göster ve geçersiz bir geçiş örneği ver (örnek: Kapandı'dan İşlemde'ye doğrudan geçilmez). 5) docs/KURALLAR.md içine öncelik tablosunu (Kritik, Yüksek, Orta, Düşük) ve ilk yanıt hedef sürelerini yaz (örnek: Kritik 1 saat, Düşük 2 iş günü). 6) git add . ve git commit -m plan komutlarını çalıştır. Göreceğin sonuç: git log çıktısında ilk kayıt ve iki dolu belge.","docs/PLAN.md ve docs/KURALLAR.md (roller, alanlar, durum akışı, öncelik ve süre tablosu)","requirement = gereksinim, workflow = iş akışı, role = rol, priority = öncelik","software requirements document simple example ticket system","pj:sup1"],
  ["2. Ağ ve ortam şeması: sunucu ağda nerede?","Servisin bir evi olmalı. Apartman gibi düşün: dışarıdan gelen ziyaretçi önce kapıdan (güvenlik duvarı), sonra danışmadan (router) geçer, içeride dairesine (sunucu) ulaşır. Özel IP adresleri apartmanın iç numaralarıdır, dışarıdan görünmez. NAT, apartmanın tek dış adresini paylaştıran görevlidir. Hangi kapının (port) açık olduğunu bilmek güvenliğin ilk adımıdır.","1) Cisco Packet Tracer'ı aç (Cisco Networking Academy hesabıyla ücretsiz indirilir); açamıyorsan tarayıcıdan diagrams.net'i kullan. 2) Çalışma alanına 2 PC, 1 switch, 1 router ve 1 sunucu koy, kabloları bağla. 3) IP planını yaz: kullanıcı ağı 192.168.10.0/24, sunucu ağı 192.168.20.0/24, sunucuya sabit adres ver (örnek 192.168.20.10), PC'lerde Desktop sekmesindeki IP Configuration ekranından ayar yap. 4) Bir PC'nin komut satırından sunucuya ping at ve sonucu not al. 5) Çizimine internet bulutunu ve güvenlik duvarını ekle, port tablosu yaz: 443 HTTPS dışarıya açık, 22 SSH yalnızca yönetici adresine, veri tabanı portu hiç dışarı açık değil. 6) docs/AG-SEMASI.md içine şemanın PNG'sini koy, altına 5 cümleyle 'bir kullanıcı bilet açarken istek hangi yoldan geçer' diye anlat. 7) Çizimdeki en az 3 kuralı (örnek: veri tabanı dışarıya kapalı) neden öyle olduğuyla açıkla. Göreceğin sonuç: ping cevap veren bir topoloji ve açıklamalı şema.","docs/AG-SEMASI.md, ag-semasi.png ve (varsa) Packet Tracer .pkt dosyası","network diagram = ağ şeması, firewall = güvenlik duvarı, port = bağlantı noktası, subnet = alt ağ","network diagram web server firewall router switch beginner","sk:ccna:1.7;at:sw:6"],
  ["3. Veri modeli ve API tasarımı: kodlama","Veri modeli, bilet defterinin sütunlarıdır; API ise defterin önündeki gişedir. Kullanıcı defteri doğrudan karıştırmaz, gişeye başvurur: bilet aç, biletleri göster, durumu değiştir. Gişe kural koyar: başlıksız bilet kabul edilmez. Minimal API bunu az satırla yapmanı sağlar.","1) Terminalde dotnet --version yaz ve 8 veya üstü olduğunu gör. 2) Proje klasöründe dotnet new web -n HelpDesk -o src/HelpDesk ve dotnet new gitignore komutlarını çalıştır. 3) src/HelpDesk klasöründe dotnet add package Microsoft.EntityFrameworkCore.Sqlite ve dotnet add package Swashbuckle.AspNetCore komutlarını çalıştır. 4) Ticket.cs dosyasında Ticket sınıfını yaz (Id, Title, Description, Category, Priority, Status, CreatedBy, AssignedTo, CreatedAt, UpdatedAt); Status ve Priority için enum kullan. 5) HelpDeskDb.cs dosyasında DbContext'ten türeyen sınıf yaz ve DbSet olarak Tickets alanını ekle; bağlantı metni olarak Data Source=helpdesk.db değerini (çift tırnak içinde) UseSqlite içine ver. 6) TicketRules.cs dosyasında CanMove(from, to) fonksiyonunu yaz; 1. adımdaki durum akışını bir kural tablosu olarak koy. 7) Program.cs içinde dört uç nokta tanımla: MapPost ile /api/tickets (bilet aç), MapGet ile /api/tickets (liste), MapGet ile /api/tickets/{id} (tek bilet), MapPatch ile /api/tickets/{id}/status (durum değiştir); başlık boşsa Results.BadRequest, geçişe izin yoksa Results.Conflict, bilet yoksa Results.NotFound dön. 8) Program.cs başında db.Database.EnsureCreated() çağır, UseSwagger ve UseSwaggerUI ekle. 9) dotnet run ile çalıştır, tarayıcıda /swagger adresini aç, bir bilet oluştur, listele, durumunu değiştir. Göreceğin sonuç: Swagger sayfasında çalışan 4 uç nokta ve helpdesk.db dosyası.","src/HelpDesk klasörü (Ticket.cs, HelpDeskDb.cs, TicketRules.cs, Program.cs) ve docs/API.md (4 uç noktanın tablosu)","endpoint = uç nokta, model = veri modeli, validation = doğrulama, request = istek","aspnet core minimal api ef core sqlite tutorial beginner","sk:bk:1.7;at:bk:6"],
  ["4. Test planı ve otomatik testler","Test, uçuş öncesi kontrol listesidir. Pilot motoru çalıştırıp 'umarım olur' demez, listeyi tek tek işaretler. Birim test küçük bir parçayı (durum kuralı), entegrasyon testi ise tüm gişeyi baştan sona dener. Önce plan yazarsın, sonra planı otomatik çalışan teste çevirirsin. Test yoksa her değişiklik kumardır.","1) docs/TEST-PLANI.md oluştur ve 10 satırlık bir tablo yaz: Senaryo, Beklenen sonuç, Otomatik mi. 2) Proje kökünde dotnet new xunit -n HelpDesk.Tests -o tests/HelpDesk.Tests komutunu çalıştır. 3) dotnet add tests/HelpDesk.Tests reference src/HelpDesk/HelpDesk.csproj ve dotnet add tests/HelpDesk.Tests package Microsoft.AspNetCore.Mvc.Testing komutlarını çalıştır. 4) src/HelpDesk/Program.cs dosyasının en sonuna public partial class Program { } satırını ekle (test projesinin uygulamayı başlatabilmesi için). 5) TicketRulesTests.cs dosyasında 3 geçerli ve 3 geçersiz durum geçişini test et. 6) ApiTests.cs dosyasında WebApplicationFactory<Program> kullan ve şu üç senaryoyu yaz: boş başlıkla bilet açınca 400, geçerli bilet açınca 201, açılan bilet listede görünür. 7) Testlerin gerçek helpdesk.db dosyasına yazmaması için testte ayrı bir veri tabanı dosya adı kullan. 8) Proje kökünde dotnet test çalıştır. Göreceğin sonuç: Passed yazan, en az 9 testlik yeşil bir özet. 9) Bir testi bilerek bozup kırmızı olduğunu gör, sonra düzelt.","docs/TEST-PLANI.md ve tests/HelpDesk.Tests klasörü (en az 9 test, dotnet test çıktısının ekran görüntüsü)","test case = test senaryosu, assertion = doğrulama, unit test = birim test, coverage = kapsama","xunit unit test aspnet core WebApplicationFactory integration test","pj:qa1;at:sw:10"],
  ["5. Güvenlik: parola, yetki, giriş, log","Kapıya kilit takmak yetmez, kimin hangi odaya gireceğini de bilmelisin. Parolayı düz yazı saklamak, anahtarı paspasın altına koymaktır; bunun yerine özet (hash) saklanır, geri çevrilemez. Giriş yapınca sana yaka kartı (token) verilir. Her kapıda kart okunur: kart yoksa 401, kart var ama yetki yoksa 403. Kim ne zaman girmeye çalıştı, güvenlik kamerası gibi log tutar.","1) User.cs dosyasında User sınıfını yaz: Id, Email, PasswordHash, Role (User, Agent, Admin). 2) Parola için Microsoft.AspNetCore.Identity içindeki PasswordHasher<User> sınıfını kullan: kayıtta HashPassword, girişte VerifyHashedPassword çağır; düz parolayı veri tabanına da loga da yazma. 3) src/HelpDesk klasöründe dotnet add package Microsoft.AspNetCore.Authentication.JwtBearer komutunu çalıştır. 4) Gizli anahtarı koda yazma: dotnet user-secrets init ve dotnet user-secrets set komutuyla Jwt:Key değerini en az 32 karakterlik rastgele bir metin olarak sakla. 5) Program.cs içinde AddAuthentication ile AddJwtBearer ayarla, AddAuthorization ekle, UseAuthentication ve UseAuthorization çağır. 6) /api/auth/login uç noktası yaz: doğru parolada token üret, yanlışta 401 dön. 7) Bilet uç noktalarına RequireAuthorization ekle; durum değiştirme ve atama uç noktalarını yalnızca Agent ve Admin rolüne aç; Kullanıcı rolü sadece kendi açtığı biletleri görsün. 8) AddRateLimiter ve UseRateLimiter ile giriş uç noktasına dakikada sınırlı deneme koy. 9) ILogger ile başarılı ve başarısız girişleri logla (e-posta yaz, parola ve token yazma). 10) dotnet list package --vulnerable komutunu çalıştır ve sonucu not et. 11) docs/GUVENLIK.md içine 5 satırlık tehdit tablosu yaz (örnek: başkasının biletini okuma, parola tahmin etme) ve her birinin önlemini yaz. 12) Testlere 3 senaryo ekle: tokensız istek 401, Kullanıcı rolü durum değiştirirse 403, başkasının bileti görünmez. Göreceğin sonuç: dotnet test hâlâ yeşil.","docs/GUVENLIK.md, güvenlik testleri ve dotnet list package --vulnerable çıktısı (gizli anahtar repoda olmamalı)","hash = özet, token = kimlik jetonu, authorization = yetkilendirme, rate limit = istek sınırı","aspnet core jwt bearer authentication minimal api password hasher","sk:sec:1.7;at:sec:6"],
  ["6. Bulut ve otomatik dağıtım: CI/CD ve maliyet","CI/CD, fabrikadaki bant gibidir. Kodu GitHub'a gönderince bant kendi kendine çalışır: derle, test et, paketle. Hata varsa bant durur, bozuk ürün müşteriye ulaşmaz. Bulut ise kiralık dükkandır: kira sayacı çalışır. Ücretsiz katmanın sınırı vardır, aşarsan fatura gelir. O yüzden dükkan açmadan önce bütçe alarmı kurarsın.","1) Proje köküne Dockerfile yaz: ilk aşamada mcr.microsoft.com/dotnet/sdk:8.0 imajıyla dotnet publish, ikinci aşamada mcr.microsoft.com/dotnet/aspnet:8.0 imajıyla çalıştırma; ayrıca .dockerignore dosyasına bin ve obj yaz. 2) .github/workflows/ci.yml oluştur: tetikleyici olarak push, adımlar olarak actions/checkout, actions/setup-dotnet (dotnet-version 8.0.x), sonra run satırlarıyla dotnet restore, dotnet build --no-restore ve dotnet test. 3) Kodu GitHub'a gönder, deponun Actions sekmesinde yeşil tik gör. 4) Program.cs içine AddHealthChecks ve MapHealthChecks ile /health yolunu ekle. 5) Dağıtım yeri seç (örnek: Azure App Service ücretsiz F1 katmanı veya Dockerfile kabul eden ücretsiz bir platform); kayıttan önce güncel fiyat ve ücretsiz katman koşulları sayfasını oku, koşullar değişebilir. 6) Hesapta harcama limiti veya bütçe uyarısı kur (Azure kullanıyorsan Cost Management içindeki Budgets bölümü); uyarı kurulmadan hiçbir kaynak açma. 7) Jwt Key gibi gizli değerleri platformun ortam değişkenleri bölümüne gir, repoya yazma. 8) Dağıtımı yap, tarayıcıda /health adresini aç ve OK cevabını gör. 9) docs/DAGITIM.md içine adımları, tahmini aylık maliyeti ve ücretsiz katman sınırlarını yaz. 10) Ekran görüntüsü aldıktan sonra istersen kaynakları durdur veya sil. Not: ücretsiz katmanlarda uygulama bir süre istek gelmezse uyur, ilk istek yavaş olabilir. Göreceğin sonuç: Actions'ta yeşil derleme ve çalışan bir bulut adresi.","Dockerfile, .github/workflows/ci.yml, docs/DAGITIM.md (maliyet notu) ve Actions yeşil tik ekran görüntüsü","pipeline = otomatik hat, deploy = dağıtmak, free tier = ücretsiz katman, budget alert = bütçe uyarısı","github actions dotnet build test workflow and azure app service free tier budget alert","pj:bk2;sk:bk:2.0"],
  ["7. İngilizce README, bilet şablonları ve demo anlatımı","README, dükkanın vitrinidir. İşe alımcı depoya girince ilk 20 saniyede ne olduğunu anlamazsa çıkar. Bilet yazışma şablonları ise hazır cümle kalıplarıdır: her seferinde sıfırdan yazmazsın, ton hep kibar ve net olur. Demo anlatımı da asansör konuşmasıdır: 90 saniyede ne yaptığını söylersin.","1) README.md dosyasını İngilizce yaz; başlıklar: What it is, Features, Tech stack, How to run (dotnet run), How to test (dotnet test), API overview, Security notes, Roadmap. 2) docs/TEMPLATES.md içine 4 İngilizce şablon yaz: ticket received, need more information, issue resolved, escalation to a senior agent; her biri 3-5 kısa cümle olsun ve selamlama, durum ve sonraki adım içermeli. 3) docs/DEMO.md içine 90 saniyelik İngilizce demo metni yaz: sorun, çözüm, bir bilet açışın, bir durum değişikliği, güvenlik ve test, tek cümle kapanış. 4) Metni sesli 3 kez oku ve süresini ölç. 5) Windows'ta Win+G ile açılan Xbox Game Bar'dan ekran kaydı al, demoyu anlatarak kaydet. 6) Metinleri bir dil aracına veya Claude'a göster, düzeltmeleri anlayarak kabul et; anlamadığın cümleyi kullanma. Göreceğin sonuç: baştan sona İngilizce, hatasız okunan bir README ve 4 şablon.","README.md (İngilizce), docs/TEMPLATES.md, docs/DEMO.md ve demo videosu veya GIF bağlantısı","ticket received = bilet alındı, escalate = üst kademeye aktarmak, resolved = çözüldü, demo script = demo metni","how to write a good github readme and helpdesk reply templates in english","sk:eng:1.7;at:en:8"],
  ["8. İzleme, log okuma ve olay müdahale mini planı","Yangın çıkınca yangın tatbikatı yapmış olan sakin kalır. Servis çökünce de aynı: plan önceden yazılmışsa panik azalır. Log, geçmişin kara kutusudur; ne olduğunu oradan okursun. Olay müdahalesinin sırası bellidir: fark et, doğrula, sınırla, düzelt, haber ver, öğren.","1) Program.cs içine app.Use ile küçük bir ara katman ekle: her isteğin yolunu, durum kodunu ve süresini ILogger ile yaz. 2) PowerShell'de dotnet run 2>&1 | Tee-Object -FilePath logs/app.log komutuyla çıktıyı hem ekrana hem dosyaya yaz; logs klasörünü .gitignore'a ekle. 3) Başka bir pencerede Get-Content logs/app.log -Tail 50 -Wait komutuyla logu canlı izle. 4) Sahte saldırı yap: yanlış parolayla 10 kez giriş dene, sonra Select-String -Path logs/app.log -Pattern Warning komutuyla bu denemeleri bul ve zaman damgalarını not al. 5) Uygulamayı kapatıp /health adresinin cevap vermediğini gör; 'servis yanıt vermiyor' durumu için docs/RUNBOOK.md içine kontrol sırası yaz (süreç çalışıyor mu, port açık mı, log ne diyor, son dağıtım ne zaman). 6) docs/OLAY-PLANI.md oluştur: önem seviyeleri (SEV1 servis tamamen kapalı, SEV2 bir özellik bozuk, SEV3 küçük sorun), ilk 15 dakikada yapılacaklar, kullanıcıya bilgi verme şablonu, olay sonrası inceleme formu (ne oldu, neden, ne düzelttik, tekrar olmaması için ne yapacağız). 7) Yanlış giriş senaryosunu sahte olay olarak plana göre yaz ve incelemeyi doldur. Göreceğin sonuç: logda bulduğun gerçek izler ve doldurulmuş bir olay raporu.","docs/RUNBOOK.md, docs/OLAY-PLANI.md ve doldurulmuş docs/OLAY-ORNEGI.md (log kesiti içinde parola veya token olmamalı)","incident = olay, log = kayıt, monitoring = izleme, post-mortem = olay sonrası inceleme","incident response plan template small team and read application logs powershell select-string","pj:sec2;at:sec:10"],
  ["9. Yayın: GitHub, portföy, CV, LinkedIn ve mülakat","İyi iş yaptıysan bunu görünür kılmalısın. Dükkanı açtın, şimdi tabelayı asıyorsun. Depo temiz ve düzenli olmalı, çünkü işe alımcı önce oraya bakar. CV'de proje tek satır, LinkedIn'de kısa bir hikaye, mülakatta ise iki dakikalık bir anlatıdır. Aynı proje üç farklı boyutta anlatılır.","1) GitHub'da helpdesk-gold adıyla herkese açık depo oluştur ve tüm projeyi gönder. 2) Yayından önce git grep -i password ve git grep -i secret komutlarını çalıştır; gerçek parola, token veya gerçek kişi verisi çıkarsa sil, git geçmişinde de varsa anahtarı yenile. 3) docs/img klasörüne Swagger, yeşil Actions ve /health ekran görüntülerini koy, README'ye ekle. 4) Deponun sağındaki ayar simgesinden kısa açıklama ve topics etiketleri ekle (örnek: aspnet-core, help-desk, csharp, ci-cd). 5) README'nin başına Actions durum rozetini koy. 6) Deponun Settings içindeki Pages bölümünden bir portföy sayfası aç veya PORTFOLIO.md yaz: projenin amacı, mimari şema, ekran görüntüleri, demo bağlantısı. 7) docs/CV-LINKEDIN.md içine CV için 3 İngilizce madde yaz (örnek kalıp: Built and tested a help desk API with role-based access, X automated tests and a CI pipeline) ve LinkedIn Projects bölümü için 3-4 cümlelik açıklama yaz. 8) docs/MULAKAT.md içine 2 dakikalık Türkçe anlatım ve İngilizce kısa sürümü yaz: sorun, planım, ağ, kod, test, güvenlik, bulut, ne öğrendim. 9) Şu 5 soruya birer paragraf cevap hazırla: neden bu mimariyi seçtin, en zor hata neydi, güvenliği nasıl düşündün, bir şey bozulsa ne yapardın, bir sonraki adımın ne. 10) Bir arkadaşına veya aynaya karşı anlatımı süre tutarak yap. Göreceğin sonuç: temiz bir depo, tek sayfalık portföy ve ezbere değil anlayarak anlattığın bir hikaye.","Herkese açık GitHub depo bağlantısı, portföy sayfası, docs/CV-LINKEDIN.md ve docs/MULAKAT.md","portfolio = portföy, repository = depo, interview = mülakat, achievement = başarı","how to present a github project in portfolio cv linkedin and interview star method","pj:ba3"]

function glossFor(text){

    for(var i=0;i<g[2].length;i++){
      var a=g[2][i].toLowerCase();if(a.length<3)continue;

}
