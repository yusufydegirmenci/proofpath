<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel="stylesheet" href="css/genel.css"><link rel="stylesheet" href="css/vardiya.css"><link rel="stylesheet" href="css/fetih.css"><link rel="stylesheet" href="css/ders-odasi.css"><link rel="stylesheet" href="css/animasyon-atolyesi.css"><link rel="stylesheet" href="css/seviye-sinavi.css"><link rel="stylesheet" href="css/son-eklemeler.css"></head><body>
<title>Proofpath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@500;700&family=Patrick+Hand&display=swap">
<style>
/* Gece/gündüz şehri: koyu modda gece, açık modda sabah ışığı. İki iz: CCNA turkuaz, İngilizce kehribar. */
:root{
  --bg:#f1ede4; --panel:#f9f6ef; --panel2:#e9e3d6; --ink:#2d2b27; --mute:#6a655b; --line:#d9d1c0; --gold:#94701e; --gold-soft:#eee0bb; --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --net:#2d7d74; --net-soft:#d6e7e1; --on-net:#ffffff; --eng:#98600f; --eng-soft:#f0dfbd;
  --rust:#b5583a; --rust-soft:#f2d9cb; --ok:#3d7d56; --warn:#b07a18; --bad:#b04545;
  --heat0:#e4dccb; --heat1:#cfe3dc; --heat2:#9fcdc3; --heat3:#5fa99d; --heat4:#2f7f74;
  --sky1:#f4e2c0; --sky2:#cbd9e6; --orb:#f0b45a; --orbglow:rgba(240,170,80,.45); --star:0;
  --bld:#4a5766; --bld2:#66768a; --dark-win:rgba(40,50,62,.30); --shadow:0 1px 2px rgba(60,50,30,.06),0 6px 18px rgba(60,50,30,.06);
  --f-body:"Familjen Grotesk",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --gold:#d6b567; --gold-soft:#38321f; --f-disp:"Fraunces",Georgia,"Times New Roman",serif; --bg:#1a1d21; --panel:#23272c; --panel2:#2c3137; --ink:#d9d6ce; --mute:#9a9a94; --line:#363b41;
  --net:#6cc0b2; --net-soft:#23403c; --on-net:#10231f; --eng:#d8a45e; --eng-soft:#3a3020;
  --rust:#d9825f; --rust-soft:#3a261d; --ok:#6dbb8a; --warn:#d3a24a; --bad:#d97878;
  --heat0:#262c33; --heat1:#27413e; --heat2:#2f6a62; --heat3:#4a9a8d; --heat4:#79c7b9;
  --sky1:#1b2438; --sky2:#2c3b5c; --orb:#e8e4d8; --orbglow:rgba(220,225,240,.30); --star:1;
  --bld:#1b2029; --bld2:#2a3340; --dark-win:rgba(140,160,190,.12); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#d6b567; --gold-soft:#38321f; --f-disp:"Fraunces",Georgia,"Times New Roman",serif; --bg:#1a1d21; --panel:#23272c; --panel2:#2c3137; --ink:#d9d6ce; --mute:#9a9a94; --line:#363b41;
  --net:#6cc0b2; --net-soft:#23403c; --on-net:#10231f; --eng:#d8a45e; --eng-soft:#3a3020;
  --rust:#d9825f; --rust-soft:#3a261d; --ok:#6dbb8a; --warn:#d3a24a; --bad:#d97878;
  --heat0:#262c33; --heat1:#27413e; --heat2:#2f6a62; --heat3:#4a9a8d; --heat4:#79c7b9;
  --sky1:#1b2438; --sky2:#2c3b5c; --orb:#e8e4d8; --orbglow:rgba(220,225,240,.30); --star:1;
  --bld:#1b2029; --bld2:#2a3340; --dark-win:rgba(140,160,190,.12); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}
.label{font:600 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
/* rütbe şeridi */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.hero-top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.rank{font-size:30px;font-weight:700;letter-spacing:-.01em}
.xpbar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--net);border-radius:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:78px}
.stat b{font:600 22px/1.1 var(--f-mono)}
.gate{font-size:13px;color:var(--mute)}
/* sekmeler */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{appearance:none;border:0;background:none;color:var(--mute);font:600 14px var(--f-body);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--net)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--net);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.alert{border:1px solid var(--rust);background:var(--rust-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.alert.warn{border-color:var(--warn)}
.coach{border-left:3px solid var(--net);padding-left:12px}
.coach.eng{border-left-color:var(--eng)}
/* şehir */
.district{display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.skyline{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:6px 2px 4px;border-bottom:2px solid var(--line)}
.bld{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bld .tower{width:100%;border-radius:4px 4px 0 0;position:relative;background:var(--net);display:flex;align-items:flex-end;justify-content:center;color:#fff;font:600 11px var(--f-mono);padding-bottom:3px}
.bld.eng .tower{background:var(--eng)}
.bld.locked .tower{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
.bld.next .tower{background:var(--panel2);border:1.5px solid var(--net);color:var(--net)}
.bld.rust .tower{background:var(--rust);color:#fff}
.bld.rust .tower::after{content:"";position:absolute;left:30%;top:8%;width:2px;height:40%;background:var(--bg);transform:rotate(14deg)}
.bld .nm{font-size:11.5px;line-height:1.25;text-align:center;overflow-wrap:anywhere;min-height:2.5em}
.bld .age{font:400 10.5px var(--f-mono);color:var(--mute)}
.bld.rust .age{color:var(--rust);font-weight:600}
@media (prefers-reduced-motion:no-preference){.bld.next .tower{animation:glow 2.4s ease-in-out infinite}}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--net) 25%,transparent)}}
/* ofis / dizi */
.step{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.ring{width:34px;height:34px}
.pill{font:600 11px var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--net-soft);color:var(--net)}
.pill.eng{background:var(--eng-soft);color:var(--eng)}
.pill.rust{background:var(--rust-soft);color:var(--rust)}
.story .cliff{font-style:italic;border-left:3px solid var(--eng);padding-left:12px}
.words{display:flex;flex-wrap:wrap;gap:6px}
/* ısı haritası */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.cell{width:16px;height:16px;border-radius:3px;background:var(--heat0)}
.cell.l1{background:var(--heat1)}.cell.l2{background:var(--heat2)}.cell.l3{background:var(--heat3)}.cell.l4{background:var(--heat4)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--panel2);border-radius:5px;position:relative;overflow:hidden}
.barrow .track>i{position:absolute;inset:0 auto 0 0;background:var(--net);border-radius:5px}
.chart text{fill:var(--mute);font:10px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ok);stroke-dasharray:4 4;stroke-width:1.2}
.chart .ln{fill:none;stroke:var(--net);stroke-width:2}
.chart .dot{fill:var(--net)}
.chart.eng .ln{stroke:var(--eng)}.chart.eng .dot{fill:var(--eng)}
/* formlar */
form{display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
input,textarea,select{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.btn{appearance:none;border:1px solid var(--net);background:var(--net);color:#fff;font:600 14px var(--f-body);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:none;color:var(--net)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rew{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rew:last-child{border-bottom:0}
.badge{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:130px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--mute);font-size:14px}
details summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
/* sınıf */
.stage{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
@media (max-width:560px){.stage{grid-template-columns:1fr}}
.fig{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px}
.fig .who{font:600 12px var(--f-mono)}
.fig .role{font-size:11.5px;color:var(--mute);text-align:center}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bubble .sit{font-size:16px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--net)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.fb{border-left:3px solid var(--net);padding-left:12px;display:grid;gap:6px}
.fb.bad{border-left-color:var(--bad)}
.fb.good{border-left-color:var(--ok)}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:22px;height:8px;border-radius:4px;background:var(--panel2)}
.prog i.ok{background:var(--ok)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--net)}
.livebar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--panel2)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--mute);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--net);color:var(--on-net)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10231f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10231f}}
.breakdown{display:flex;flex-wrap:wrap;gap:6px}
.breakdown span{border:1px solid var(--eng);border-radius:99px;padding:2px 10px;font-size:13px}

.lsn{display:grid;gap:14px}
.lsn h3{margin:0;font:600 17px var(--f-body)}
.lsn p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.lbox{border-left:3px solid var(--net);background:var(--panel2);border-radius:0 8px 8px 0;padding:10px 12px;display:grid;gap:6px;min-width:0}
.lbox.eng{border-left-color:var(--eng)}.lbox.warn{border-left-color:var(--rust)}
.lcode{font:13px/1.5 var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto;margin:0}
.lsteps{margin:0;padding-left:20px;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:grid;gap:2px;text-align:center;border:1px solid var(--eng);background:var(--eng-soft);border-radius:8px;padding:6px 10px;min-width:0}
.chip b{font-size:15px}.chip i{font:11px var(--f-mono);color:var(--mute);font-style:normal}
.lscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.lscroll .opt{white-space:nowrap;flex:0 0 auto}
.lscroll .opt[aria-pressed=true]{border-color:var(--net);background:var(--net-soft)}

.rcard{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.rcard a{font-weight:600;overflow-wrap:anywhere}
.route{display:grid;gap:10px}
.rstep{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rstep .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:inline-block}
.rstep.done .dot{background:var(--ok);border-color:var(--ok)}
.rstep.done .t{color:var(--mute);text-decoration:line-through}
.rstep .l{display:flex;gap:10px;align-items:center;min-width:0}

/* ===== v7: ön yüz ===== */
body{padding-inline:0;padding-block:0 96px;background:var(--bg)}
.wrap{max-width:1040px;gap:0}
main#view{padding-inline:16px;padding-top:18px}
h2{font-size:20px;letter-spacing:-.01em}
.panel{border-radius:18px;box-shadow:var(--shadow);padding:18px}
.btn{background:linear-gradient(135deg,var(--net),color-mix(in srgb,var(--net) 78%,var(--bk)));border:0;color:var(--on-net);border-radius:12px;padding:10px 16px;box-shadow:0 6px 18px color-mix(in srgb,var(--net) 30%,transparent);transition:transform .12s ease,box-shadow .12s ease,filter .12s}
.btn:hover:not([disabled]){filter:brightness(1.06)}
.btn:active:not([disabled]){transform:translateY(1px) scale(.99)}
.btn.ghost{background:none;border:1px solid color-mix(in srgb,var(--net) 55%,var(--line));color:var(--net);box-shadow:none}
.btn.big{font-size:16px;padding:14px 20px;border-radius:14px;width:100%}
.opt,.empty,.lbox,.rcard,input,textarea,select{border-radius:12px}
.xpbar{height:8px;border-radius:99px}.xpbar>i{border-radius:99px;background:linear-gradient(90deg,var(--net),color-mix(in srgb,var(--net) 78%,var(--bk)))}
/* kahraman */
.hero{display:block;position:relative;overflow:hidden;border:0;border-radius:0 0 28px 28px;padding:0;gap:0;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);box-shadow:var(--shadow)}
.hero .stars{position:absolute;inset:0;opacity:var(--star);pointer-events:none}
.hero .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7}
.hero .orb{position:absolute;right:8%;top:22px;width:46px;height:46px;border-radius:50%;background:var(--orb);box-shadow:0 0 40px 12px var(--orbglow)}
.hero-in{position:relative;max-width:1040px;margin:0 auto;padding:22px 16px 0;display:grid;gap:16px}
.greet .label{color:color-mix(in srgb,var(--ink) 65%,transparent)}
.greet h1{font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.greet p{margin:0;max-width:34em;font-size:15px;color:color-mix(in srgb,var(--ink) 82%,transparent)}
.hero-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rankring{position:relative;width:104px;height:104px}
.rankring svg{width:100%;height:100%}
.rankring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.rankring b{font:700 22px var(--f-mono)}.rankring span{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--mute)}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:99px;padding:6px 12px;font:600 13px var(--f-mono)}
.hchip svg{width:16px;height:16px}
.rankname{font-size:22px;font-weight:700;letter-spacing:-.01em}
.nextline{font-size:13px;color:color-mix(in srgb,var(--ink) 70%,transparent)}
.hero-cta{max-width:420px}
.skyline-svg{display:block;width:100%;height:auto;max-height:200px;margin-top:2px}
.skyline-svg .win{fill:var(--dark-win)}
.skyline-svg .lit.ccna{fill:var(--net)}.skyline-svg .lit.eng{fill:var(--eng)}.skyline-svg .lit.rust{fill:var(--rust)}
.skyline-svg .glowg{filter:drop-shadow(0 0 2px color-mix(in srgb,var(--net) 70%,transparent))}
.skyline-svg .beacon{fill:var(--net)}.skyline-svg .beacon.eng{fill:var(--eng)}
@media (prefers-reduced-motion:no-preference){.skyline-svg .beacon{animation:beacon 1.6s ease-in-out infinite}.hero .stars i{animation:tw 3s ease-in-out infinite}.hero .stars i:nth-child(odd){animation-delay:1.2s}}
@keyframes beacon{50%{opacity:.25}}@keyframes tw{50%{opacity:.2}}
/* gezinme */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(9,1fr);gap:0;border:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow:visible}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;border-radius:12px;font:600 10.5px var(--f-body);color:var(--mute);min-width:0}
.tab svg{width:22px;height:22px;transition:transform .15s}
.tab[aria-selected="true"]{color:var(--net);background:color-mix(in srgb,var(--net) 12%,transparent);border:0}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08)}
@media (min-width:760px){
  .tabs{position:sticky;top:0;bottom:auto;display:flex;justify-content:center;gap:6px;border:0;border-bottom:1px solid var(--line);padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent)}
  .tab{flex-direction:row;gap:8px;padding:8px 16px;font-size:14px;border-radius:99px}
  body{padding-block:0 40px}
}
/* giriş animasyonu */
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

function lineChart(pts,cls){
  var W=340,H=170,l=30,r=10,t=10,b=24,w=W-l-r,hh=H-t-b;
  var svg=sv("svg",{class:"chart "+(cls||""),viewBox:"0 0 "+W+" "+H,width:"100%",role:"img","aria-label":"Sınav sonuçları grafiği"});

  if(!pts.length){svg.append(sv("text",{x:W/2,y:H/2,"text-anchor":"middle"},"Henüz sınav yok"));return svg}
  var n=pts.length,xs=function(i){return n===1?l+w/2:l+w*i/(n-1)},ys=function(v){return t+hh-hh*Math.max(0,Math.min(100,v))/100};

function skyline(){
  var C=topicsOf("ccna"),E=topicsOf("eng"),items=[];
  C.forEach(function(t){items.push({t:t,k:"ccna"})});
  if(C.length&&E.length)items.push({gap:true});
  E.forEach(function(t){items.push({t:t,k:"eng"})});
  if(!C.length&&!E.length)for(var z=0;z<26;z++)items.push({t:{status:"locked",mastery:0},k:"ccna"});
  var step=13,W=items.length*step+8,H=120,g=sv("g",null),i=0,x=4;
  var svg=sv("svg",{class:"skyline-svg",viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMax meet","aria-hidden":"true"});
  items.forEach(function(it,idx){
    if(it.gap){x+=step;return}
    var t=it.t,m=Math.round(num(t.mastery)),a=daysAgo(t.lastReview),locked=t.status==="locked",nxt=t.status==="next";
    var rust=(t.status==="built"||t.status==="building")&&m>0&&a!=null&&a>7;
    var bh=(it.k==="eng"?34:40)+((idx*53)%7)*(it.k==="eng"?7:9);
    var y=H-bh,w=11,cols=2,rows=Math.max(2,Math.floor((bh-8)/6)),tot=rows*cols,lit=locked?0:Math.round(m/100*tot);
    var grp=sv("g",{class:lit?"glowg":""});
    grp.append(sv("rect",{x:x,y:y,width:w,height:bh,rx:1.5,fill:"var(--bld2)",opacity:locked?.32:1}));
    if(!locked){
      for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
        var n=r*cols+c,isLit=n<lit;/* alttan yukarı: satır 0 en altta */
        var wy=y+bh-6-r*6;
        if(wy<y+3)continue;
        grp.append(sv("rect",{x:x+2+c*4.5,y:wy,width:3,height:3.4,rx:.6,class:"win"+(isLit?" lit "+(rust?"rust":it.k):"")}));
      }
    }
    if(t.status==="built")grp.append(sv("line",{x1:x+w/2,x2:x+w/2,y1:y,y2:y-5,stroke:"var(--mute)","stroke-width":.8}));
    if(nxt)grp.append(sv("circle",{cx:x+w/2,cy:y-3,r:2,class:"beacon"+(it.k==="eng"?" eng":"")}));
    svg.append(grp);x+=step;
  });
  svg.append(sv("rect",{x:0,y:H-1.5,width:W,height:1.5,fill:"var(--bld)"}));
  return svg;
}

    }

}
