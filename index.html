<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Proofpath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Gece/gündüz şehri: koyu modda gece, açık modda sabah ışığı. İki iz: CCNA turkuaz, İngilizce kehribar. */
:root{
  --bg:#f1ede4; --panel:#f9f6ef; --panel2:#e9e3d6; --ink:#2d2b27; --mute:#6a655b; --line:#d9d1c0; --gold:#94701e; --gold-soft:#eee0bb; --f-disp:"Fraunces",Georgia,"Times New Roman",serif;
  --net:#2d7d74; --net-soft:#d6e7e1; --on-net:#ffffff; --eng:#98600f; --eng-soft:#f0dfbd;
  --rust:#b5583a; --rust-soft:#f2d9cb; --ok:#3d7d56; --warn:#b07a18; --bad:#b04545;
  --heat0:#e4dccb; --heat1:#cfe3dc; --heat2:#9fcdc3; --heat3:#5fa99d; --heat4:#2f7f74;
  --sky1:#f4e2c0; --sky2:#cbd9e6; --orb:#f0b45a; --orbglow:rgba(240,170,80,.45); --star:0;
  --bld:#4a5766; --bld2:#66768a; --dark-win:rgba(40,50,62,.30); --shadow:0 1px 2px rgba(60,50,30,.06),0 6px 18px rgba(60,50,30,.06);
  --f-body:"Familjen Grotesk",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --gold:#d6b567; --gold-soft:#38321f; --f-disp:"Fraunces",Georgia,"Times New Roman",serif; --bg:#1a1d21; --panel:#23272c; --panel2:#2c3137; --ink:#d9d6ce; --mute:#9a9a94; --line:#363b41;
  --net:#6cc0b2; --net-soft:#23403c; --on-net:#10231f; --eng:#d8a45e; --eng-soft:#3a3020;
  --rust:#d9825f; --rust-soft:#3a261d; --ok:#6dbb8a; --warn:#d3a24a; --bad:#d97878;
  --heat0:#262c33; --heat1:#27413e; --heat2:#2f6a62; --heat3:#4a9a8d; --heat4:#79c7b9;
  --sky1:#1b2438; --sky2:#2c3b5c; --orb:#e8e4d8; --orbglow:rgba(220,225,240,.30); --star:1;
  --bld:#1b2029; --bld2:#2a3340; --dark-win:rgba(140,160,190,.12); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --gold:#d6b567; --gold-soft:#38321f; --f-disp:"Fraunces",Georgia,"Times New Roman",serif; --bg:#1a1d21; --panel:#23272c; --panel2:#2c3137; --ink:#d9d6ce; --mute:#9a9a94; --line:#363b41;
  --net:#6cc0b2; --net-soft:#23403c; --on-net:#10231f; --eng:#d8a45e; --eng-soft:#3a3020;
  --rust:#d9825f; --rust-soft:#3a261d; --ok:#6dbb8a; --warn:#d3a24a; --bad:#d97878;
  --heat0:#262c33; --heat1:#27413e; --heat2:#2f6a62; --heat3:#4a9a8d; --heat4:#79c7b9;
  --sky1:#1b2438; --sky2:#2c3b5c; --orb:#e8e4d8; --orbglow:rgba(220,225,240,.30); --star:1;
  --bld:#1b2029; --bld2:#2a3340; --dark-win:rgba(140,160,190,.12); --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.28); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);padding-inline:16px;padding-block:18px 48px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:18px;font-weight:600}
h3{font-size:15px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.small{font-size:13px}
.label{font:600 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
/* rütbe şeridi */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
.hero-top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.rank{font-size:30px;font-weight:700;letter-spacing:-.01em}
.xpbar{height:10px;background:var(--panel2);border-radius:6px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:var(--net);border-radius:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:78px}
.stat b{font:600 22px/1.1 var(--f-mono)}
.gate{font-size:13px;color:var(--mute)}
/* sekmeler */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-bottom:0}
.tab{appearance:none;border:0;background:none;color:var(--mute);font:600 14px var(--f-body);padding:10px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--net)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--net);outline-offset:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.alert{border:1px solid var(--rust);background:var(--rust-soft);border-radius:8px;padding:10px 14px;font-size:14px}
.alert.warn{border-color:var(--warn)}
.coach{border-left:3px solid var(--net);padding-left:12px}
.coach.eng{border-left-color:var(--eng)}
/* şehir */
.district{display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.skyline{display:flex;align-items:flex-end;gap:10px;overflow-x:auto;padding:6px 2px 4px;border-bottom:2px solid var(--line)}
.bld{flex:0 0 74px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.bld .tower{width:100%;border-radius:4px 4px 0 0;position:relative;background:var(--net);display:flex;align-items:flex-end;justify-content:center;color:#fff;font:600 11px var(--f-mono);padding-bottom:3px}
.bld.eng .tower{background:var(--eng)}
.bld.locked .tower{background:transparent;border:1.5px dashed var(--line);color:var(--mute)}
.bld.next .tower{background:var(--panel2);border:1.5px solid var(--net);color:var(--net)}
.bld.rust .tower{background:var(--rust);color:#fff}
.bld.rust .tower::after{content:"";position:absolute;left:30%;top:8%;width:2px;height:40%;background:var(--bg);transform:rotate(14deg)}
.bld .nm{font-size:11.5px;line-height:1.25;text-align:center;overflow-wrap:anywhere;min-height:2.5em}
.bld .age{font:400 10.5px var(--f-mono);color:var(--mute)}
.bld.rust .age{color:var(--rust);font-weight:600}
@media (prefers-reduced-motion:no-preference){.bld.next .tower{animation:glow 2.4s ease-in-out infinite}}
@keyframes glow{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--net) 25%,transparent)}}
/* ofis / dizi */
.step{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.ring{width:34px;height:34px}
.pill{font:600 11px var(--f-mono);padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.pill.ok{background:var(--net-soft);color:var(--net)}
.pill.eng{background:var(--eng-soft);color:var(--eng)}
.pill.rust{background:var(--rust-soft);color:var(--rust)}
.story .cliff{font-style:italic;border-left:3px solid var(--eng);padding-left:12px}
.words{display:flex;flex-wrap:wrap;gap:6px}
/* ısı haritası */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.cell{width:16px;height:16px;border-radius:3px;background:var(--heat0)}
.cell.l1{background:var(--heat1)}.cell.l2{background:var(--heat2)}.cell.l3{background:var(--heat3)}.cell.l4{background:var(--heat4)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(90px,150px) 1fr 44px;gap:10px;align-items:center;font-size:13px}
.barrow .track{height:10px;background:var(--panel2);border-radius:5px;position:relative;overflow:hidden}
.barrow .track>i{position:absolute;inset:0 auto 0 0;background:var(--net);border-radius:5px}
.chart text{fill:var(--mute);font:10px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ok);stroke-dasharray:4 4;stroke-width:1.2}
.chart .ln{fill:none;stroke:var(--net);stroke-width:2}
.chart .dot{fill:var(--net)}
.chart.eng .ln{stroke:var(--eng)}.chart.eng .dot{fill:var(--eng)}
/* formlar */
form{display:grid;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 130px;min-width:0}
input,textarea,select{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.btn{appearance:none;border:1px solid var(--net);background:var(--net);color:#fff;font:600 14px var(--f-body);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:none;color:var(--net)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rew{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rew:last-child{border-bottom:0}
.badge{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:130px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--mute);font-size:14px}
details summary{cursor:pointer;font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
/* sınıf */
.stage{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
@media (max-width:560px){.stage{grid-template-columns:1fr}}
.fig{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px}
.fig .who{font:600 12px var(--f-mono)}
.fig .role{font-size:11.5px;color:var(--mute);text-align:center}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.bubble .sit{font-size:16px;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{appearance:none;text-align:left;font:15px var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not([disabled]){border-color:var(--net)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--panel))}
.fb{border-left:3px solid var(--net);padding-left:12px;display:grid;gap:6px}
.fb.bad{border-left-color:var(--bad)}
.fb.good{border-left-color:var(--ok)}
.prog{display:flex;gap:6px;flex-wrap:wrap}
.prog i{width:22px;height:8px;border-radius:4px;background:var(--panel2)}
.prog i.ok{background:var(--ok)}.prog i.no{background:var(--bad)}.prog i.cur{background:var(--net)}
.livebar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--panel2)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{appearance:none;border:0;background:var(--panel);color:var(--mute);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--net);color:var(--on-net)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10231f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10231f}}
.breakdown{display:flex;flex-wrap:wrap;gap:6px}
.breakdown span{border:1px solid var(--eng);border-radius:99px;padding:2px 10px;font-size:13px}

.lsn{display:grid;gap:14px}
.lsn h3{margin:0;font:600 17px var(--f-body)}
.lsn p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}
.lbox{border-left:3px solid var(--net);background:var(--panel2);border-radius:0 8px 8px 0;padding:10px 12px;display:grid;gap:6px;min-width:0}
.lbox.eng{border-left-color:var(--eng)}.lbox.warn{border-left-color:var(--rust)}
.lcode{font:13px/1.5 var(--f-mono);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;overflow-x:auto;margin:0}
.lsteps{margin:0;padding-left:20px;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:grid;gap:2px;text-align:center;border:1px solid var(--eng);background:var(--eng-soft);border-radius:8px;padding:6px 10px;min-width:0}
.chip b{font-size:15px}.chip i{font:11px var(--f-mono);color:var(--mute);font-style:normal}
.lscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.lscroll .opt{white-space:nowrap;flex:0 0 auto}
.lscroll .opt[aria-pressed=true]{border-color:var(--net);background:var(--net-soft)}

.rcard{display:grid;gap:4px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.rcard a{font-weight:600;overflow-wrap:anywhere}
.route{display:grid;gap:10px}
.rstep{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.rstep .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:inline-block}
.rstep.done .dot{background:var(--ok);border-color:var(--ok)}
.rstep.done .t{color:var(--mute);text-decoration:line-through}
.rstep .l{display:flex;gap:10px;align-items:center;min-width:0}

/* ===== v7: ön yüz ===== */
body{padding-inline:0;padding-block:0 96px;background:var(--bg)}
.wrap{max-width:1040px;gap:0}
main#view{padding-inline:16px;padding-top:18px}
h2{font-size:20px;letter-spacing:-.01em}
.panel{border-radius:18px;box-shadow:var(--shadow);padding:18px}
.btn{background:linear-gradient(135deg,var(--net),color-mix(in srgb,var(--net) 78%,var(--bk)));border:0;color:var(--on-net);border-radius:12px;padding:10px 16px;box-shadow:0 6px 18px color-mix(in srgb,var(--net) 30%,transparent);transition:transform .12s ease,box-shadow .12s ease,filter .12s}
.btn:hover:not([disabled]){filter:brightness(1.06)}
.btn:active:not([disabled]){transform:translateY(1px) scale(.99)}
.btn.ghost{background:none;border:1px solid color-mix(in srgb,var(--net) 55%,var(--line));color:var(--net);box-shadow:none}
.btn.big{font-size:16px;padding:14px 20px;border-radius:14px;width:100%}
.opt,.empty,.lbox,.rcard,input,textarea,select{border-radius:12px}
.xpbar{height:8px;border-radius:99px}.xpbar>i{border-radius:99px;background:linear-gradient(90deg,var(--net),color-mix(in srgb,var(--net) 78%,var(--bk)))}
/* kahraman */
.hero{display:block;position:relative;overflow:hidden;border:0;border-radius:0 0 28px 28px;padding:0;gap:0;background:linear-gradient(180deg,var(--sky1),var(--sky2));color:var(--ink);box-shadow:var(--shadow)}
.hero .stars{position:absolute;inset:0;opacity:var(--star);pointer-events:none}
.hero .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.7}
.hero .orb{position:absolute;right:8%;top:22px;width:46px;height:46px;border-radius:50%;background:var(--orb);box-shadow:0 0 40px 12px var(--orbglow)}
.hero-in{position:relative;max-width:1040px;margin:0 auto;padding:22px 16px 0;display:grid;gap:16px}
.greet .label{color:color-mix(in srgb,var(--ink) 65%,transparent)}
.greet h1{font-size:clamp(28px,6vw,44px);font-weight:700;letter-spacing:-.02em;margin:8px 0 6px}
.greet p{margin:0;max-width:34em;font-size:15px;color:color-mix(in srgb,var(--ink) 82%,transparent)}
.hero-row{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.rankring{position:relative;width:104px;height:104px}
.rankring svg{width:100%;height:100%}
.rankring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.05}
.rankring b{font:700 22px var(--f-mono)}.rankring span{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--mute)}
.chipsrow{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(8px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);border-radius:99px;padding:6px 12px;font:600 13px var(--f-mono)}
.hchip svg{width:16px;height:16px}
.rankname{font-size:22px;font-weight:700;letter-spacing:-.01em}
.nextline{font-size:13px;color:color-mix(in srgb,var(--ink) 70%,transparent)}
.hero-cta{max-width:420px}
.skyline-svg{display:block;width:100%;height:auto;max-height:200px;margin-top:2px}
.skyline-svg .win{fill:var(--dark-win)}
.skyline-svg .lit.ccna{fill:var(--net)}.skyline-svg .lit.eng{fill:var(--eng)}.skyline-svg .lit.rust{fill:var(--rust)}
.skyline-svg .glowg{filter:drop-shadow(0 0 2px color-mix(in srgb,var(--net) 70%,transparent))}
.skyline-svg .beacon{fill:var(--net)}.skyline-svg .beacon.eng{fill:var(--eng)}
@media (prefers-reduced-motion:no-preference){.skyline-svg .beacon{animation:beacon 1.6s ease-in-out infinite}.hero .stars i{animation:tw 3s ease-in-out infinite}.hero .stars i:nth-child(odd){animation-delay:1.2s}}
@keyframes beacon{50%{opacity:.25}}@keyframes tw{50%{opacity:.2}}
/* gezinme */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(9,1fr);gap:0;border:0;border-top:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));overflow:visible}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:0;border-radius:12px;font:600 10.5px var(--f-body);color:var(--mute);min-width:0}
.tab svg{width:22px;height:22px;transition:transform .15s}
.tab[aria-selected="true"]{color:var(--net);background:color-mix(in srgb,var(--net) 12%,transparent);border:0}
.tab[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08)}
@media (min-width:760px){
  .tabs{position:sticky;top:0;bottom:auto;display:flex;justify-content:center;gap:6px;border:0;border-bottom:1px solid var(--line);padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent)}
  .tab{flex-direction:row;gap:8px;padding:8px 16px;font-size:14px;border-radius:99px}
  body{padding-block:0 40px}
}
/* giriş animasyonu */
@media (prefers-reduced-motion:no-preference){
  .enter>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(n+5){animation-delay:.2s}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
/* günlük rota */
.route{background:linear-gradient(160deg,color-mix(in srgb,var(--net) 10%,var(--panel)),var(--panel) 55%);border-color:color-mix(in srgb,var(--net) 35%,var(--line))}
.rstep[data-track="eng"] .dot{border-color:var(--eng)}.rstep[data-track="ccna"] .dot{border-color:var(--net)}

/* v8: kademe kutlaması, semt sisi */

.ms{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,#02060f 72%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow-y:auto}

@media (prefers-reduced-motion:no-preference){

  .ms-svg .wnew{animation:mswin .5s ease both}
  .ms-fogout{animation:msfog 2.4s ease 1.6s both}
  .ms-ring{animation:msring 1.4s ease-out .9s both}
  .ms-flag{transform-box:fill-box;transform-origin:left center;animation:msflag .6s ease 1.3s both}
  .dp.active .dot{animation:pulse 2.2s ease-in-out infinite}
}
@keyframes msin{from{opacity:0}}
@keyframes mscard{from{opacity:0;transform:translateY(24px) scale(.94)}}
@keyframes msup{from{transform:translateY(var(--d,40px))}}

}
@media (prefers-reduced-motion:no-preference){

}

function checkMilestones(){
  if(!S.topics.length)return;
  var cur={},dn={};
  S.topics.forEach(function(t){cur[t.id]=stageOf(t)});
  var dsAll=districtsOf("ccna");dsAll.forEach(function(d){dn[d.name]=d.done});
  var base=seenLoad();
  if(!base||!base.s){seenSave({s:cur,d:dn,q:{}});return}
  var ch=false,evs=[];
  S.topics.forEach(function(t){
    var o=base.s[t.id];
    if(o==null){base.s[t.id]=cur[t.id];ch=true;return}
    if(cur[t.id]>o)evs.push({kind:"stage",t:t,from:o,to:cur[t.id],track:t.track});
    if(cur[t.id]!==o){base.s[t.id]=cur[t.id];ch=true}
  });
  base.d=base.d||{};
  dsAll.forEach(function(d){
    if(d.done&&base.d[d.name]===false){
      evs=evs.filter(function(e){return !(e.kind==="stage"&&e.track==="ccna"&&(e.t.area||"Genel")===d.name)});
      evs.push({kind:"district",d:d,track:"ccna"});
    }
    if(base.d[d.name]!==d.done){base.d[d.name]=d.done;ch=true}
  });
  if(ch)seenSave(base);
  /* tek kutlama: semt > en yüksek kademe; "yeni bina açıldı" zaten sahnede sis olarak çekiliyor */
  evs.sort(function(a,b){return ((a.kind==="district"?9:a.to)-(b.kind==="district"?9:b.to))||0});
  if(evs.length)S.ms.queue.push(evs[evs.length-1]);
  if(S.ms.queue.length&&!S.ms.open)setTimeout(openMilestone,350);
}

 {t:"eng",d:3,q:"\"I have worked here ___ 2024.\"",o:["for","since","from","at"],a:1,w:"since + başlangıç zamanı (2024); for + süre (two years)."},
 {t:"eng",d:3,q:"\"The meeting was ___ because of the outage.\"",o:["postponed","posted","postpone","postponing"],a:0,w:"was + V3: postponed = ertelendi (pasif)."},
 {t:"eng",d:3,q:"\"Please find the report attached.\" ne anlama gelir?",o:["Raporu bul","Rapor ekte, lütfen bakın","Raporu sildim","Raporu bekle"],a:1,w:"E-posta kalıbı: rapor ekte, bakmanızı rica ederim."}
];
var QB_SEC=[
{t:"sec",d:1,q:"CIA üçlüsündeki “Integrity” (bütünlük) neyi korur?",o:["Verinin yalnızca yetkili kişilerce okunmasını","Verinin izinsiz ya da fark edilmeden değiştirilmemesini","Sistemin ihtiyaç anında erişilebilir olmasını","Verinin daha az yer kaplamasını"],a:1,w:"Bütünlük, mühürlü bir zarf gibidir: açılıp içi değiştirilirse fark edilir. Okuma yetkisi gizliliğin (confidentiality), erişilebilirlik ise availability'nin işidir. [1.1]"},
{t:"sec",d:1,q:"Otopark girişine dikilen beton bariyerler (bollard) hangi güvenlik kontrolü kategorisine girer?",o:["Teknik (technical)","Fiziksel (physical)","Yönetsel (managerial)","Operasyonel (operational)"],a:1,w:"Bariyer, kapıdaki kilit gibi elle tutulur bir engeldir; bu yüzden fiziksel kontroldür. Teknik kontroller yazılım/donanım ayarları, yönetsel kontroller politika ve risk kararlarıdır. [1.1]"},
{t:"sec",d:2,q:"Bir çalışan şirket VPN'ine bağlı olsa bile her uygulamaya girerken kimliği, cihazı ve bağlamı yeniden kontrol ediliyor. Bu hangi yaklaşımdır?",o:["Çevre (perimeter) tabanlı güven modeli","Örtük güven (implicit trust)","Zero Trust (sıfır güven)","Gizlilik yoluyla güvenlik (security through obscurity)"],a:2,w:"Zero Trust, binaya girdin diye her odanın kapısını açmayan otel gibidir: her kapıda kartını yeniden okutursun. “İçerideysen güvenilirsin” fikri çevre modeline aittir. [1.1]"},
{t:"sec",d:1,q:"Değişiklik yönetiminde, bir güncelleme canlı sistemi bozarsa önceki duruma nasıl dönüleceğini anlatan plana ne denir?",o:["Kabul edilebilir kullanım politikası (AUP)","Geri dönüş planı (backout plan)","Bakım penceresi (maintenance window)","Varlık envanteri (asset inventory)"],a:1,w:"Backout plan, yeni yola çıkmadan önce dönüş biletini cebe koymak gibidir. Bakım penceresi değişikliğin ne zaman yapılacağını söyler, nasıl geri alınacağını değil. [1.2]"},
{t:"sec",d:2,q:"Bir yönetici mesai saatinde, kimseye danışmadan firewall kuralını değiştirdi ve satış sistemi kapandı. En çok hangi değişiklik yönetimi adımı atlanmıştır?",o:["Olay sonrası ders çıkarma toplantısı","Yıllık penetrasyon testi","Çalışan farkındalık eğitimi","Etki analizi ve değişiklik danışma kurulu (CAB) onayı"],a:3,w:"Ameliyattan önce tahlil yapılır ve konsey onay verir; burada ikisi de atlanmış. Etki analizi “neyi bozar?” sorusunu, CAB onayı da “şimdi yapmak doğru mu?” sorusunu cevaplar. [1.2]"},
{t:"sec",d:1,q:"Aynı anahtarın hem şifrelemede hem şifre çözmede kullanıldığı yöntem hangisidir?",o:["Asimetrik şifreleme (ör. RSA)","Simetrik şifreleme (ör. AES)","Hash fonksiyonu (ör. SHA-256)","Dijital imza"],a:1,w:"Simetrik şifreleme, evin kapısını kilitleyen ve açan tek anahtar gibidir. RSA'da açık/özel anahtar çifti vardır; SHA-256 ise geri çözülmez, şifreleme değil özet çıkarmadır. [1.3]"},
{t:"sec",d:2,q:"Bir web uygulaması kullanıcı parolalarını veritabanında saklayacak. En doğru yöntem hangisidir?",o:["Her parolaya rastgele tuz (salt) ekleyip bcrypt gibi yavaş bir parola hash fonksiyonuyla saklamak","Parolaları AES ile şifreleyip anahtarı aynı sunucuda tutmak","Parolaları Base64 ile kodlayıp saklamak","Parolaları düz metin saklayıp veritabanının adresini gizli tutmak"],a:0,w:"Parola hash'i, kıymaya çevrilmiş et gibidir: kıymadan eti geri yapamazsın. Salt her kıymaya farklı baharat katar, böylece hazır tablolarla (rainbow table) eşleştirme işe yaramaz; Base64 ise yalnızca kodlamadır, herkes geri çevirir. [1.3]"},
{t:"sec",d:3,q:"Ayşe, Ali'ye dijital olarak imzalanmış bir e-posta gönderiyor. Ayşe imzayı oluşturmak için hangi anahtarı kullanır?",o:["Ayşe'nin açık (public) anahtarı","Ali'nin açık (public) anahtarı","Ayşe'nin özel (private) anahtarı","Ali'nin özel (private) anahtarı"],a:2,w:"İmza, yalnızca sahibinin elinde olan ıslak imza mührü gibidir: Ayşe kendi özel anahtarıyla imzalar, herkes Ayşe'nin açık anahtarıyla doğrular. Bu da inkâr edilemezliği (non-repudiation) sağlar. [1.3]"},
{t:"sec",d:1,q:"“Hacktivist” olarak adlandırılan bir saldırganın temel motivasyonu genellikle nedir?",o:["İdeolojik ya da politik bir mesaj vermek","Bir devlet adına uzun süreli casusluk yapmak","Yalnızca fidye ile para kazanmak","Bilmeden yanlış dosyayı silmek"],a:0,w:"Hacktivist, pankart yerine klavye kullanan protestocu gibidir: amaç bir davaya dikkat çekmektir. Devlet adına casusluk nation-state aktörlerin, fidye ise organize suç gruplarının tipik motivasyonudur. [2.2]"},
{t:"sec",d:1,q:"Kargo firması gibi davranan bir SMS ile kullanıcıyı sahte bağlantıya tıklatmaya çalışmaya ne denir?",o:["Vishing","Whaling","Smishing","Pharming"],a:2,w:"Smishing = SMS + phishing; oltayı mesaj kutusuna atmaktır. Vishing sesli arama, whaling üst yöneticileri hedefleyen oltalama, pharming ise trafiği sahte siteye yönlendirmedir. [2.3]"},
{t:"sec",d:2,q:"Bir şirketin kullandığı muhasebe yazılımının resmî güncelleme paketine, üreticinin sunucusu ele geçirilerek zararlı kod eklenmiş. Bu hangi saldırı türüdür?",o:["Watering hole saldırısı","Kaba kuvvet (brute force) saldırısı","Evil twin saldırısı","Tedarik zinciri (supply chain) saldırısı"],a:3,w:"Fabrikada şişeye karıştırılan zehir gibi: tüketici güvendiği markayı açar, zarar ürünün içinden gelir. Watering hole ise hedefin sık ziyaret ettiği bir siteyi tuzaklamaktır. [2.3]"},
{t:"sec",d:1,q:"“Zero-day” zafiyet ne demektir?",o:["Üreticinin henüz bilmediği ya da yamasının henüz bulunmadığı açık","Yaması yıllar önce çıkmış ama uygulanmamış açık","Yalnızca fiziksel erişimle sömürülebilen açık","Antivirüsün zaten tanıdığı eski bir zararlı"],a:0,w:"Zero-day, kilit üreticisinin haberi olmadan çoğaltılmış bir anahtar gibidir: savunanın hazırlanmak için “sıfır günü” vardır. Yaması çıkmış ama uygulanmamış açık ise yama yönetimi eksikliğidir. [2.4]"},
{t:"sec",d:2,q:"Bir giriş formuna kullanıcı adı olarak ' OR '1'='1 yazıldığında parola bilinmeden sisteme girilebiliyor. Bu hangi zafiyettir?",o:["SQL enjeksiyonu (SQL injection)","Siteler arası betik çalıştırma (XSS)","Siteler arası istek sahteciliği (CSRF)","Arabellek taşması (buffer overflow)"],a:0,w:"Girdi, dilekçeye eklenen gizli bir satır gibi SQL sorgusunun parçası olup “her zaman doğru” koşulu oluşturuyor. XSS kurbanın tarayıcısında betik çalıştırır, veritabanı sorgusunu değiştirmez. [2.4]"},
{t:"sec",d:3,q:"Kendi lab ortamındaki uygulamada SQL enjeksiyonu bulundu. Kök nedeni en etkili biçimde gideren çözüm hangisidir?",o:["Uygulamayı HTTPS'e taşımak","Veritabanı sunucusuna antivirüs kurmak","Kullanıcı parolalarının minimum uzunluğunu artırmak","Parametreli sorgular (prepared statements) kullanmak"],a:3,w:"Parametreli sorgu, formdaki boşlukları yalnızca “veri” olarak doldurtan şablon gibidir; kullanıcı girdisi komut olarak çalışamaz. HTTPS yalnızca yoldaki trafiği korur, sorguya ne girdiğini değil. [4.1]"},
{t:"sec",d:2,q:"Loglarda bir kullanıcı 10:00'da Ankara'dan, 10:07'de başka bir kıtadan oturum açmış görünüyor. Bu hangi şüpheli göstergedir?",o:["Kaynak tükenmesi (resource exhaustion)","Eksik loglar (missing logs)","İmkânsız seyahat (impossible travel)","Hesap kilitlenmesi (account lockout)"],a:2,w:"Aynı kişinin 7 dakikada kıtalar arası uçması mümkün olmadığı gibi, bu giriş deseni de çalınmış kimlik bilgisine işaret eder. Hesap kilitlenmesi ise genelde çok sayıda hatalı denemenin sonucudur. [2.5]"},
{t:"sec",d:3,q:"Kimlik doğrulama loglarında, yüzlerce farklı hesaba her birine yalnızca bir kez aynı yaygın parolanın (ör. Yaz2026!) denendiği görülüyor. Bu hangi saldırıdır?",o:["Kimlik bilgisi doldurma (credential stuffing)","Parola püskürtme (password spraying)","Rainbow table saldırısı","Tuş kaydedici (keylogger) saldırısı"],a:1,w:"Spraying, bir apartmandaki tüm kapılara aynı tek anahtarı denemek gibidir; her hesapta az deneme yaptığı için kilitlenmeye takılmaz. Credential stuffing ise başka yerden sızmış kullanıcı adı-parola çiftlerini dener. [2.5]"},
{t:"sec",d:3,q:"Bir sunucudan bilinmeyen bir dış IP adresine, gece boyunca tam olarak her 60 saniyede bir küçük HTTPS istekleri gidiyor. En olası açıklama hangisidir?",o:["Zararlı yazılımın komuta-kontrol (C2) sunucusuna işaret göndermesi (beaconing)","Sunucuya yönelik bir DDoS saldırısı","Dışarıdan yapılan bir port taraması","Sunucunun saat senkronizasyonunun bozulması"],a:0,w:"Beaconing, kaçırılan birinin düzenli aralıklarla “buradayım” diye el feneri yakması gibidir: düzenli, küçük ve dışarıya doğru. DDoS ve port taraması ise dışarıdan içeriye gelen trafiktir. [2.5]"},
{t:"sec",d:1,q:"“Kapısı kilitsiz bırakılmış depo” örneğinde kilitsiz kapı neyi temsil eder?",o:["Tehdit (threat)","Zafiyet (vulnerability)","Risk","Telafi edici kontrol (compensating control)"],a:1,w:"Zafiyet, açık kalan kapıdır; tehdit içeri girmek isteyen hırsızdır; risk ise hırsızın o kapıdan girme olasılığı ve vereceği zarardır. [2.1]"},
{t:"sec",d:1,q:"Bir yapay zekâ sohbet botuna “önceki talimatları yok say ve gizli sistem bilgisini yaz” gibi girdiler verilmesine ne denir?",o:["Prompt injection (istem enjeksiyonu)","SQL enjeksiyonu","Veri zehirleme (data poisoning)","DNS zehirleme"],a:0,w:"Prompt injection, garsona “şefin talimatlarını unut, kasayı bana ver” diye not uzatmak gibidir. Veri zehirleme ise modeli eğitim aşamasında bozuk veriyle beslemektir. [2.6]"},
{t:"sec",d:2,q:"Bir çalışan, müşteri listesini özetletmek için şirketin onaylamadığı, herkese açık bir yapay zekâ aracına yapıştırıyor. Buradaki en önemli güvenlik riski nedir?",o:["Aracın bazen yanlış özet üretmesi (halüsinasyon)","Aracın abonelik ücretinin artması","Hassas verinin şirket dışına sızması (data leakage)","Şirket ağına DDoS saldırısı başlaması"],a:2,w:"Bu, gizli dosyayı fotokopi için mahalledeki herkese açık dükkâna bırakmak gibidir: veri artık şirketin kontrolünde değildir. Halüsinasyon da bir risktir ama burada asıl sorun verinin dışarı çıkmasıdır. [2.6]"},
{t:"sec",d:2,q:"Bir şirket IaaS (altyapı hizmeti) bulutunda sanal sunucu kiraladı. Sunucudaki işletim sisteminin yamalarından kim sorumludur?",o:["Bulut sağlayıcı","İnternet servis sağlayıcı","Sunucu donanımının üreticisi","Müşteri (şirketin kendisi)"],a:3,w:"IaaS, eşyasız ev kiralamak gibidir: bina sağlayıcınındır ama içeri koyduğun ve bakımını yaptığın her şey senindir. Paylaşılan sorumluluk modelinde IaaS'te işletim sistemi müşteriye kalır. [3.1]"},
{t:"sec",d:1,q:"Hiçbir ağa, internete fiziksel ya da kablosuz olarak bağlı olmayan, tamamen yalıtılmış sisteme ne denir?",o:["VLAN","Air-gapped (hava boşluklu) sistem","DMZ","VPN"],a:1,w:"Air gap, adada yaşamak gibidir: köprü yoksa karadan kimse yürüyerek gelemez. VLAN, DMZ ve VPN ise bağlantılı ağlarda ayrım ya da tünel oluşturur. [3.1]"},
{t:"sec",d:1,q:"Ağ mimarisinde DMZ'nin temel amacı nedir?",o:["Tüm iç ağ trafiğini şifrelemek","Kullanıcılara otomatik IP adresi dağıtmak","Kablosuz ağın kapsama alanını genişletmek","İnternete açık sunucuları iç ağdan ayıran ara bir bölge oluşturmak"],a:3,w:"DMZ, evin bahçe kapısıyla iç kapısı arasındaki avlu gibidir: misafiri avluda ağırlarsın, salona almazsın. Web sunucusu ele geçirilse bile iç ağ bir katman daha geride kalır. [3.2]"},
{t:"sec",d:2,q:"Bir ofiste muhasebe bilgisayarları ile misafir Wi-Fi'ye bağlanan cihazlar aynı düz ağda. En uygun iyileştirme hangisidir?",o:["Ağı VLAN'larla bölmek ve aralarına erişim kuralları koymak","Wi-Fi parolasını daha uzun yapmak","Kablosuz ağın adını (SSID) gizlemek","Daha yüksek hızlı bir switch almak"],a:0,w:"Segmentasyon, otelde misafir katı ile kasa odasını ayrı kartlarla açılır yapmak gibidir. Uzun parola ve SSID gizlemek misafirin içeri girdikten sonra muhasebeye ulaşmasını engellemez. [3.2]"},
{t:"sec",d:3,q:"Bir firewall kuralları yukarıdan aşağı okur ve ilk eşleşen kuralı uygular. Kurallar: 1) deny tcp any → 10.0.0.5 port 22, 2) allow tcp 10.0.1.0/24 → any port 22, 3) deny any any. 10.0.1.7 adresinden 10.0.0.5:22'ye bağlantı ne olur?",o:["Kural 1 ile engellenir","Kural 2 ile izin verilir","Kural 3 ile engellenir","Hiçbir kurala uymadığı için izin verilir"],a:0,w:"Firewall, sıradaki ilk görevlinin kararını uygulayan kapı gibidir: istek önce kural 1'e eşleşir ve orada reddedilir, alttaki daha “özel görünen” kural 2'ye hiç bakılmaz. [3.2]"},
{t:"sec",d:1,q:"Bir dizüstü bilgisayarın diskinin BitLocker ile tamamen şifrelenmesi öncelikle hangi veri durumunu korur?",o:["Durağan veri (data at rest)","Hareketteki veri (data in transit)","Kullanımdaki veri (data in use)","Silinmiş veri (deleted data)"],a:0,w:"Disk şifreleme, kasada duran evrakı kilitlemek gibidir; laptop çalınsa bile disk okunamaz. Ağda giden veriyi korumak ise TLS gibi hareketteki veri yöntemlerinin işidir. [3.3]"},
{t:"sec",d:2,q:"Bir çağrı merkezi ekranında müşterinin kart numarası **** **** **** 1234 şeklinde gösteriliyor. Bu hangi veri koruma tekniğidir?",o:["Hashleme (hashing)","Tokenizasyon (tokenization)","Veri maskeleme (data masking)","Steganografi"],a:2,w:"Maskeleme, belgenin bir kısmını siyah bantla kapatmak gibidir: kişi işini görecek kadarını görür. Tokenizasyon ise gerçek veriyi tamamen anlamsız bir yer tutucuyla değiştirip asıl veriyi ayrı bir kasada tutar. [3.3]"},
{t:"sec",d:2,q:"İş birimi “bir arızada en fazla 15 dakikalık veri kaybını kabul edebiliriz” diyor. Bu 15 dakika hangi metriktir?",o:["RTO (Recovery Time Objective)","MTBF (Mean Time Between Failures)","RPO (Recovery Point Objective)","MTTR (Mean Time To Repair)"],a:2,w:"RPO, oyunda en son kayıt noktasına ne kadar geri düşmeye razı olduğundur (veri kaybı). RTO ise oyunun yeniden açılmasının ne kadar sürebileceğidir (kesinti süresi). [3.4]"},
{t:"sec",d:3,q:"Fidye yazılımı ağdaki tüm sunucuları ve ağa sürekli bağlı NAS üzerindeki yedekleri de şifreledi. Hangi yedekleme yaklaşımı bu kaybı önlerdi?",o:["Çevrim dışı (offline) ya da değiştirilemez (immutable) bir yedek kopyası tutmak","Aynı sunucuda RAID 1 ile ikinci bir disk kullanmak","NAS yedeklemesini saatlik yerine dakikalık yapmak","Dosyaları zip'leyip aynı ağ paylaşımında saklamak"],a:0,w:"Yangına karşı evrakın bir kopyasını başka binadaki kasada tutmak gibi: saldırgan ulaşamadığı kopyayı şifreleyemez. RAID bir yedek değil, disk arızasına karşı süreklilik önlemidir; şifrelenen veriyi o da aynen kopyalar. [3.4]"},
{t:"sec",d:1,q:"Eski diskleri elden çıkarmadan önce üzerindeki verileri kurtarılamaz hale getirme sürecine ne denir?",o:["Veri temizleme (sanitization)","Veri sınıflandırma (classification)","Veri saklama (retention)","Veri maskeleme (masking)"],a:0,w:"Sanitization, gizli evrakı çöpe atmadan önce kâğıt öğütücüden geçirmek gibidir. Yalnızca dosyaları silmek veya formatlamak, verinin özel araçlarla geri getirilmesini her zaman engellemez. [4.2]"},
{t:"sec",d:1,q:"Zafiyetlerin ciddiyetini 0 ile 10 arasında puanlayan standart sistem hangisidir?",o:["CVE","SIEM","SOAR","CVSS"],a:3,w:"CVSS, hastanedeki aciliyet derecesi gibidir: hangi hastaya önce bakılacağını söyler. CVE ise zafiyetin kimlik numarasıdır (ör. CVE-2021-44228), puan değildir. [4.3]"},
{t:"sec",d:2,q:"Zafiyet tarayıcısı bir Linux sunucuda yalnızca Windows'u etkileyen bir açık raporluyor. Bu sonuç nasıl sınıflandırılır?",o:["Yanlış negatif (false negative)","Gerçek pozitif (true positive)","Yanlış pozitif (false positive)","Zero-day"],a:2,w:"Yanlış pozitif, duman yokken çalan yangın alarmı gibidir: uyarı var ama gerçek sorun yok. Yanlış negatif ise yangın varken susan alarmdır ve daha tehlikelidir. [4.3]"},
{t:"sec",d:1,q:"Farklı cihazlardan gelen logları tek yerde toplayan, ilişkilendiren ve şüpheli durumlarda alarm üreten sistem hangisidir?",o:["DLP","WAF","NAC","SIEM"],a:3,w:"SIEM, binadaki tüm kameraları tek ekranda izleyen güvenlik odası gibidir. DLP veri sızıntısını, WAF web saldırılarını, NAC ise ağa kimin bağlanabileceğini kontrol eder. [4.4]"},
{t:"sec",d:2,q:"Bir çalışan, binlerce TC kimlik numarası içeren bir dosyayı kişisel e-posta adresine göndermeye çalıştığında gönderim otomatik olarak engellendi. Bunu hangi araç yapmıştır?",o:["IDS (Intrusion Detection System)","DLP (Data Loss Prevention)","Yük dengeleyici (load balancer)","Zafiyet tarayıcısı"],a:1,w:"DLP, mağaza çıkışında etiketli ürünü fark edip öten kapı gibidir: hassas veri kalıbını tanır ve dışarı çıkmasını durdurur. IDS ise genelde yalnızca uyarır, engellemez. [4.4]"},
{t:"sec",d:1,q:"Aşağıdakilerden hangisi gerçek bir çok faktörlü kimlik doğrulamadır (MFA)?",o:["Parola + güvenlik sorusu cevabı","PIN + parola","Parola + telefondaki doğrulama uygulamasının ürettiği kod","Kullanıcı adı + parola"],a:2,w:"MFA farklı türden faktörler ister: bildiğin bir şey (parola) + sahip olduğun bir şey (telefon). Parola ile güvenlik sorusu ikisi de “bildiğin şey” olduğu için iki adım olsa da tek faktördür. [4.5]"},
{t:"sec",d:2,q:"Yeni başlayan bir stajyerin muhasebe raporlarını okuması gerekiyor ama değiştirmemesi gerekiyor. En doğru yetkilendirme hangisidir?",o:["İşler aksamasın diye Domain Admin grubuna eklemek","Muhasebe müdürünün hesabını ortak kullandırmak","Yalnızca o raporlara okuma (read-only) yetkisi vermek","Tam yetki verip yaptıklarını loglamak"],a:2,w:"En az yetki (least privilege), misafire tüm evin değil yalnızca misafir odasının anahtarını vermek gibidir. Loglamak iyi bir ek önlemdir ama yanlış yetkiyi düzeltmez. [4.5]"},
{t:"sec",d:3,q:"Bir sistemde erişim şöyle tanımlanmış: “Yalnızca İK departmanındaki kullanıcılar, mesai saatleri içinde ve şirket tarafından yönetilen bir cihazdan personel dosyalarını açabilir.” Bu hangi erişim kontrol modelidir?",o:["RBAC (rol tabanlı erişim kontrolü)","ABAC (öznitelik tabanlı erişim kontrolü)","DAC (isteğe bağlı erişim kontrolü)","MAC (zorunlu erişim kontrolü)"],a:1,w:"ABAC, kapıdaki görevlinin hem kartına, hem saate, hem de hangi kapıdan geldiğine bakması gibidir. RBAC yalnızca role bakardı; burada saat ve cihaz gibi ek öznitelikler de karar veriyor. [4.5]"},
{t:"sec",d:2,q:"Kullanıcılar oltalama e-postası bildirdiğinde, sistem e-postadaki bağlantıyı otomatik inceliyor, zararlıysa aynı e-postayı tüm posta kutularından silip bir kayıt (ticket) açıyor. Bu hangi tür çözümdür?",o:["DLP politikası","SOAR ile otomatik müdahale akışı (playbook)","Yedekleme yazılımı","Yük dengeleyici (load balancer)"],a:1,w:"SOAR, yangın alarmı çaldığında kapıları kendiliğinden kapatıp itfaiyeyi arayan bina sistemi gibidir: tekrar eden adımları otomatik ve tutarlı yapar, analiste zaman kazandırır. [4.6]"},
{t:"sec",d:1,q:"Olay müdahalesinde (incident response), enfekte olduğu anlaşılan bir bilgisayarı ağdan ayırmak hangi aşamaya aittir?",o:["Kontrol altına alma (containment)","Kökünü kazıma (eradication)","Kurtarma (recovery)","Ders çıkarma (lessons learned)"],a:0,w:"Containment, evde yangın çıkan odanın kapısını kapatmak gibidir: önce yayılmayı durdurursun, söndürme ve tamir sonra gelir. [4.7]"},
{t:"sec",d:3,q:"Bir sunucuda fidye yazılımı tespit edildi ve analiz tamamlandı. Sonraki adımların doğru sırası hangisidir?",o:["Yedekten geri yükle → izole et → zararlıyı temizle → ders çıkar","İzole et (containment) → zararlıyı temizle (eradication) → yedekten geri yükle (recovery) → ders çıkar (lessons learned)","Zararlıyı temizle → ders çıkar → izole et → yedekten geri yükle","Ders çıkar → izole et → yedekten geri yükle → zararlıyı temizle"],a:1,w:"Sel basan evde önce suyu kesersin, sonra suyu boşaltır, sonra boyarsın, en son da tesisatın neden patladığını konuşursun. Temizlemeden geri yüklemek, zararlının geri yüklenen sisteme yeniden bulaşmasına yol açabilir. [4.7]"},
{t:"sec",d:3,q:"Hâlâ çalışan bir sunucudan adli delil toplanacak. Uçuculuk sırasına (order of volatility) göre aşağıdakilerden hangisi önce toplanmalıdır?",o:["Yerel diskin imajı","Uzak log sunucusundaki kayıtlar","Geçen haftanın yedek teypleri","RAM (bellek) içeriği"],a:3,w:"Uçuculuk sırası, buzu sıcakta önce toplamak gibidir: en çabuk kaybolan önce alınır. RAM, makine kapanınca ya da yeniden başlayınca silinir; disk ve yedekler çok daha kalıcıdır. [4.8]"},
{t:"sec",d:1,q:"Çalışanların şirket bilgisayarlarını, e-postayı ve interneti nasıl kullanabileceğini tanımlayan belge hangisidir?",o:["Hizmet seviyesi anlaşması (SLA)","Gizlilik sözleşmesi (NDA)","Mutabakat zaptı (MOU)","Kabul edilebilir kullanım politikası (AUP)"],a:3,w:"AUP, sitenin ortak alan kullanım kuralları gibidir: neyin serbest, neyin yasak olduğunu yazar. SLA ise bir hizmet sağlayıcının taahhüt ettiği hizmet düzeyini tanımlar. [5.1]"},
{t:"sec",d:2,q:"Bir şirket, çok yüksek riskli bulduğu eski bir uygulamayı yamalamak yerine tamamen kapatmaya karar veriyor. Bu hangi risk yanıtıdır?",o:["Devretme (transfer)","Kabul (acceptance)","Azaltma (mitigation)","Kaçınma (avoidance)"],a:3,w:"Kaçınma, buzlu yolda kaymamak için o yola hiç çıkmamaktır. Sigorta yaptırmak devretme, zincir takmak azaltma, “olursa olur” demek ise kabuldür. [5.2]"},
{t:"sec",d:3,q:"Bir sunucunun değeri 100.000 TL. Bir sel olayında değerinin %40'ı kaybediliyor (exposure factor) ve böyle bir selin yılda 0,25 kez olması bekleniyor (ARO). Yıllık beklenen kayıp (ALE) kaç TL'dir?",o:["25.000 TL","40.000 TL","160.000 TL","10.000 TL"],a:3,w:"Önce tek olay kaybı: SLE = 100.000 × 0,40 = 40.000 TL. Sonra ALE = SLE × ARO = 40.000 × 0,25 = 10.000 TL; tıpkı “bir kaza kaç para tutar × yılda kaç kez olur” hesabı gibi. [5.2]"},
{t:"sec",d:2,q:"Bir bulut tedarikçisiyle yapılan sözleşmeye, tedarikçinin güvenlik kontrollerinin müşteri ya da bağımsız bir denetçi tarafından incelenebilmesini sağlayan madde eklendi. Bu maddeye ne denir?",o:["Gizlilik sözleşmesi (NDA)","Hizmet seviyesi anlaşması (SLA)","Mutabakat zaptı (MOU)","Denetim hakkı maddesi (right-to-audit clause)"],a:3,w:"Denetim hakkı, kiraladığın deponun içini gerektiğinde gelip kontrol etme iznidir. Bu madde olmadan tedarikçinin “güvendeyiz” sözüne güvenmek zorunda kalırsın. [5.3]"},
{t:"sec",d:1,q:"Avrupa Birliği'nde kişisel verilerin korunmasını düzenleyen ve Türkiye'deki KVKK'ya benzeyen düzenleme hangisidir?",o:["PCI DSS","HIPAA","GDPR","ISO 9001"],a:2,w:"GDPR, AB vatandaşlarının kişisel verileri için “bu veri kimin, nasıl kullanılır” kurallarını koyan anayasa gibidir. PCI DSS kart verisi, HIPAA ABD sağlık verisi içindir; ISO 9001 ise kalite yönetimi standardıdır. [5.4]"},
{t:"sec",d:2,q:"Bir penetrasyon testi öncesinde test ekibine ağ şeması, IP listeleri ve uygulamanın kaynak kodu tamamen veriliyor. Bu test türü hangisidir?",o:["Bilinmeyen ortam (unknown environment / black box) testi","Bilinen ortam (known environment / white box) testi","Kısmen bilinen ortam (partially known environment / gray box) testi","Pasif keşif (passive reconnaissance)"],a:1,w:"Bilinen ortam testi, evin planını elinde tutan bir ustanın kaçak aramasına benzer: her şey görünür, daha derin bakılır. Hiç bilgi verilmeyen test ise dışarıdan gelen bir yabancının bakış açısıdır. [5.5]"},
{t:"sec",d:1,q:"Çalışanlara kontrollü sahte oltalama e-postaları gönderip kimin bağlantıya tıkladığını ölçmek ve tıklayanlara eğitim vermek hangi faaliyettir?",o:["Zafiyet taraması (vulnerability scan)","Masaüstü tatbikatı (tabletop exercise)","Oltalama simülasyonu kampanyası (phishing simulation)","Yedekten geri yükleme testi"],a:2,w:"Oltalama simülasyonu, yangın tatbikatı gibidir: gerçek yangın olmadan insanların nasıl davrandığını görür ve eksikleri eğitimle kapatırsın. Masaüstü tatbikatı ise ekibin bir senaryoyu masada konuşarak prova etmesidir. [5.6]"}
];

var QB_BK=[
{t:"bk",d:1,q:"Sunucudaki veriyi değiştirmeden okumak için kullanılan HTTP metodu hangisidir?",o:["POST","DELETE","GET","PATCH"],a:2,w:"GET, kütüphanede rafa bakmak gibidir: kitabı okursun ama raftaki düzen değişmez. Veri eklemek için POST, silmek için DELETE kullanılır."},
{t:"bk",d:1,q:"HTTP 404 durum kodu ne anlama gelir?",o:["Sunucu çöktü","İstek başarılı oldu","Kullanıcı giriş yapmadı","İstenen kaynak bulunamadı"],a:3,w:"404, yanlış kapı numarasını çalmak gibidir: bina (sunucu) ayakta ama aradığın daire (kaynak) yok."},
{t:"bk",d:1,q:"REST API'de yeni bir kayıt başarıyla oluşturulduğunda döndürülmesi en uygun durum kodu hangisidir?",o:["201 Created","301 Moved Permanently","400 Bad Request","500 Internal Server Error"],a:0,w:"201 Created, “siparişin alındı, işte fiş numaran” demektir: yeni kaynak oluştu. 2xx başarı, 4xx istemci hatası, 5xx sunucu hatası ailesidir."},
{t:"bk",d:1,q:"JSON (JavaScript Object Notation, veri değişim biçimi) verileri nasıl tutar?",o:["Yalnızca satır-sütun tablosu halinde","Anahtar-değer çiftleri ve diziler halinde","Sıkıştırılmış resim dosyası halinde","Yalnızca sayılar halinde"],a:1,w:"JSON bir kimlik kartı gibidir: “ad”: “Yusuf”, “şehir”: “Ankara”. Birden çok değer gerekiyorsa köşeli parantezli dizi kullanılır."},
{t:"bk",d:1,q:"SQL'de bir tablodan satırları okumak için hangi komut kullanılır?",o:["INSERT","UPDATE","SELECT","DROP"],a:2,w:"SELECT, arşivden dosya istemek gibidir: veriyi getirir, değiştirmez. INSERT ekler, UPDATE değiştirir, DROP tabloyu tamamen siler."},
{t:"bk",d:1,q:"İlişkisel veritabanında bir tablodaki her satırı benzersiz biçimde tanımlayan sütuna ne denir?",o:["Foreign key (yabancı anahtar)","View (görünüm)","Trigger (tetikleyici)","Primary key (birincil anahtar)"],a:3,w:"Primary key, TC kimlik numarası gibidir: iki kişide aynı olamaz. Foreign key ise başka tablodaki bir primary key'e işaret eden bağlantıdır."},
{t:"bk",d:1,q:"Git'te yaptığın değişiklikleri yerel depoya kalıcı bir kayıt noktası olarak ekleyen komut hangisidir?",o:["git push","git clone","git status","git commit"],a:3,w:"git commit, oyunda “kaydet” noktası gibidir: istediğinde bu ana geri dönebilirsin. git push bu kayıtları uzak depoya (GitHub gibi) gönderir."},
{t:"bk",d:1,q:"Birim test (unit test) neyi test eder?",o:["Tüm sistemi gerçek kullanıcı gibi baştan sona","Sunucu donanımının sıcaklığını","Kodun küçük bir parçasını (ör. tek fonksiyon) diğer parçalardan yalıtılmış biçimde","İnternet bağlantısının hızını"],a:2,w:"Birim test, arabayı toplamadan önce her vidayı tek tek kontrol etmek gibidir. Tüm sistemi baştan sona deneyen teste end-to-end test denir."},
{t:"bk",d:2,q:"Kullanıcı giriş yapmış ama yalnızca yöneticilerin açabildiği bir sayfayı istiyor. Sunucunun döndürmesi en uygun durum kodu hangisidir?",o:["401 Unauthorized","403 Forbidden","404 Not Found","500 Internal Server Error"],a:1,w:"401 “seni tanımıyorum, önce kimliğini göster”, 403 “seni tanıyorum ama bu odaya giriş iznin yok” demektir. Burada kimlik belli, yetki eksik."},
{t:"bk",d:2,q:"Milyonlarca satırlık users tablosunda WHERE email = '...' sorgusu çok yavaş çalışıyor. En mantıklı ilk adım hangisidir?",o:["Sorguyu SELECT * olarak değiştirmek","email sütununa indeks (index) eklemek","Veritabanı sunucusunu her gün yeniden başlatmak","email sütununu silmek"],a:1,w:"İndeks, kitabın sonundaki dizin gibidir: tüm sayfaları çevirmek yerine doğrudan ilgili sayfaya gidersin. Karşılığında yazma işlemleri biraz yavaşlar ve ek yer kaplar."},
{t:"bk",d:2,q:"JWT (JSON Web Token) hakkında hangisi doğrudur?",o:["İçeriği varsayılan olarak şifrelidir, içine parola konabilir","Süresi hiçbir zaman dolmaz","Yalnızca sunucudaki veritabanında saklanır, istemciye gönderilmez","İmzası, içeriğin değiştirilmediğini doğrular; içerik ise Base64URL ile kodlandığı için herkes okuyabilir"],a:3,w:"JWT, mühürlü ama şeffaf zarf gibidir: mühür (imza) açılıp açılmadığını gösterir, ama içindeki yazı dışarıdan okunur. Bu yüzden içine gizli bilgi konmaz."},
{t:"bk",d:2,q:"Kullanıcı parolaları veritabanında nasıl saklanmalıdır?",o:["Düz metin olarak","Base64 ile kodlanarak","bcrypt gibi yavaş ve tuzlu (salt) bir hash algoritmasıyla","Bir anahtarla şifrelenip anahtar kaynak kodda tutularak"],a:2,w:"Hash, kıyma makinesi gibidir: kıymadan eti geri elde edemezsin. Salt her parolaya farklı baharat ekler; böylece aynı parolalar bile farklı görünür. Base64 şifreleme değildir, geri çözülür."},
{t:"bk",d:2,q:"Üretim (production) loglarına hangisi YAZILMAMALIDIR?",o:["İsteğin benzersiz kimliği (request ID)","Kullanıcının parolası","Hatanın mesajı","İsteğin kaç milisaniye sürdüğü"],a:1,w:"Log, kara kutu kaydı gibidir: birçok kişi okuyabilir. Parola, kart numarası gibi hassas veriler loga girerse sızıntı demektir."},
{t:"bk",d:3,q:"İstemci bir ödeme API'sine istek gönderdi, ağ zaman aşımına uğradı ve istemci isteği yeniden deniyor. Çift ödemeyi önlemenin en sağlam yolu hangisidir?",o:["Yeniden denemeyi tamamen kapatmak","Ödeme isteğini GET metoduna çevirmek","İstemcideki zaman aşımı süresini artırmak","Her ödeme için benzersiz bir idempotency key (tekrar güvenli anahtar) gönderip sunucunun aynı anahtarı ikinci kez işlememesini sağlamak"],a:3,w:"Idempotency key, kargo takip numarası gibidir: aynı numarayla ikinci paket gelirse depo “bu zaten işlendi” der. Böylece yeniden deneme güvenli olur."},
{t:"bk",d:3,q:"API'de beklenmeyen bir istisna (exception) oluştu. İstemciye ne dönülmesi en doğru yaklaşımdır?",o:["Tüm stack trace'i (hata izi) istemciye göstermek","200 OK ile boş gövde dönmek","500 durum kodu, genel bir hata mesajı ve bir iz numarası dönüp ayrıntıyı sunucu loguna yazmak","Bağlantıyı yanıt vermeden kapatmak"],a:2,w:"Restoranda mutfakta tabak kırılınca garson müşteriye “bir aksilik oldu, hemen ilgileniyoruz” der, kırık parçaları masaya getirmez. Ayrıntı loga, iz numarası ise ikisini eşleştirmeye yarar."},
{t:"bk",d:3,q:"main dalına hatalı bir commit yapıp push ettin ve ekip arkadaşların bu değişikliği çekti. Geri almanın güvenli yolu hangisidir?",o:["git reset --hard ile geri alıp force push yapmak","git revert ile hatalı commit'i tersine çeviren yeni bir commit oluşturmak","Depoyu silip yeniden oluşturmak","Yerel .git klasörünü silmek"],a:1,w:"git revert, deftere düzeltme satırı eklemek gibidir: eski satırı silmezsin, “bu iptal” yazarsın. Paylaşılmış geçmişi force push ile yeniden yazmak arkadaşlarının deposunu bozar."},
{t:"bk",d:1,q:"Sunucu yönetmeden, bir olay tetiklendiğinde kod çalıştıran AWS hizmeti hangisidir?",o:["Amazon EC2","AWS Lambda","Amazon EBS","Amazon Route 53"],a:1,w:"Lambda, kapı zili gibidir: zil (olay) çalınca biri kapıyı açar, sen ev (sunucu) bakımıyla uğraşmazsın. EC2'de ise sunucuyu sen yönetirsin. [DVA-Geliştirme]"},
{t:"bk",d:1,q:"Amazon DynamoDB'de partition key'in (bölüm anahtarı) temel görevi nedir?",o:["Tablonun şifreleme anahtarını belirlemek","Öğenin hangi bölüme (partition) yazılacağını belirlemek ve öğeyi bulmak için kullanılmak","Yedekleme sıklığını belirlemek","Tablodaki sütun sayısını sınırlamak"],a:1,w:"Partition key, postadaki posta kodu gibidir: mektubun hangi dağıtım merkezine gideceğini belirler. Değerleri iyi dağılmış bir anahtar, yükü bölümlere eşit yayar. [DVA-Geliştirme]"},
{t:"bk",d:1,q:"Bir mesajı aynı anda birden çok aboneye yayınlayan (publish/subscribe) AWS hizmeti hangisidir?",o:["Amazon SNS","Amazon SQS","Amazon S3","AWS KMS"],a:0,w:"SNS, okul anonsu gibidir: bir kez söylenir, tüm sınıflar duyar. SQS ise sıra numaralı bekleme kuyruğudur; mesajı bir tüketici alıp işler. [DVA-Geliştirme]"},
{t:"bk",d:2,q:"DynamoDB tablosunun partition key'i userId. Artık email ile de verimli sorgu yapman gerekiyor ve tablo zaten oluşturulmuş. Ne eklemelisin?",o:["email'i sort key yapan bir LSI (Local Secondary Index)","Her sorguda tüm tabloyu Scan edip filtrelemek","Tabloyu silip email ile yeniden kurmak","Partition key'i email olan bir GSI (Global Secondary Index)"],a:3,w:"GSI, aynı kitaplığa ikinci bir katalog eklemek gibidir: farklı bir partition key ile arama yapar ve sonradan eklenebilir. LSI aynı partition key'i kullanır ve yalnızca tablo oluşturulurken tanımlanabilir. [DVA-Geliştirme]"},
{t:"bk",d:2,q:"SQS tüketicin bir mesajı işlerken uzun sürüyor ve bu sırada başka bir tüketici aynı mesajı alıp tekrar işliyor. Hangi ayarı değiştirmelisin?",o:["Mesaj boyutunu küçültmek","Visibility timeout'u (görünmezlik süresi) işleme süresinden uzun yapmak","Kuyruğu SNS konusuyla değiştirmek","Kuyruğu silip yeniden oluşturmak"],a:1,w:"Visibility timeout, kütüphanede ödünç alınan kitabın rafta “yok” görünme süresi gibidir: süre dolmadan iade edilmezse kitap tekrar rafta görünür ve başkası alır. [DVA-Geliştirme]"},
{t:"bk",d:2,q:"SQS kuyruğunu sürekli yoklayan uygulaman çok sayıda boş yanıt alıyor ve gereksiz istek maliyeti oluşuyor. En uygun çözüm hangisidir?",o:["Yoklama sıklığını artırmak","Bir dead-letter queue eklemek","Long polling (uzun yoklama) kullanmak, yani WaitTimeSeconds değerini sıfırdan büyük ayarlamak","Mesajları S3'e yazmak"],a:2,w:"Long polling, postaneye her beş dakikada bir gitmek yerine gişede mektup gelene kadar bir süre beklemek gibidir: daha az boş yol, daha az istek. [DVA-Geliştirme]"},
{t:"bk",d:2,q:"Siparişlerin gönderildiği sırayla ve tekrarsız (exactly-once processing) işlenmesi gerekiyor. Hangi kuyruk türü uygundur?",o:["SQS Standard kuyruk","SNS Standard konu","S3 olay bildirimi","SQS FIFO kuyruk"],a:3,w:"FIFO (First In, First Out), fırındaki sıra numarası gibidir: önce gelen önce alır ve aynı numara iki kez çağrılmaz. Standard kuyruk sırayı garanti etmez ve bir mesaj birden fazla teslim edilebilir. [DVA-Geliştirme]"},
{t:"bk",d:2,q:"Lambda fonksiyonunda AWS SDK istemcisini ve veritabanı bağlantısını nerede oluşturmak performans için daha iyidir?",o:["Handler'ın dışında (başlatma kodunda), böylece sıcak (warm) ortamda sonraki çağrılarda yeniden kullanılır","Her çağrıda handler fonksiyonunun içinde","Her çağrıda /tmp klasörüne yazıp okuyarak","Her istek için ayrı bir Lambda fonksiyonu oluşturarak"],a:0,w:"Çay ocağında semaveri her bardak için yeniden kaynatmazsın; bir kez yakar, sıcakken tekrar tekrar doldurursun. Handler dışındaki kod ortam ilk açıldığında çalışır ve sonraki çağrılarda korunabilir. [DVA-Geliştirme]"},
{t:"bk",d:3,q:"İki istek aynı anda DynamoDB'deki aynı stok öğesini güncelliyor ve biri diğerinin yazdığını eziyor. Bunu önlemenin uygun yolu hangisidir?",o:["Öğede bir sürüm numarası tutup ConditionExpression ile koşullu yazma yapmak (optimistic locking)","Güncellemeden önce tabloyu Scan ile kontrol etmek","Okumaları eventually consistent (nihai tutarlı) yapmak","Tabloya bir GSI eklemek"],a:0,w:"Koşullu yazma, ortak belgede “yalnızca ben açtığımdan beri kimse değiştirmediyse kaydet” demek gibidir. Sürüm numarası değişmişse yazma reddedilir, uygulama güncel veriyi okuyup yeniden dener. [DVA-Geliştirme]"},
{t:"bk",d:3,q:"Kullanıcıların tarayıcıdan özel (private) bir S3 bucket'ına doğrudan dosya yüklemesi gerekiyor; onlara AWS kimlik bilgisi vermek istemiyorsun. En uygun yöntem hangisidir?",o:["Sunucu tarafında kısa ömürlü bir presigned URL (önceden imzalı adres) üretip istemciye vermek","Bucket'ı herkese açık (public) yapmak","Erişim anahtarlarını JavaScript koduna gömmek","Root hesabın kimlik bilgilerini paylaşmak"],a:0,w:"Presigned URL, otelin belirli bir süre için tek odayı açan kart anahtarı gibidir: süre dolunca çalışmaz ve yalnızca o işlem için geçerlidir. Bucket özel kalır. [DVA-Geliştirme]"},
{t:"bk",d:1,q:"Bir Lambda fonksiyonunun ya da EC2 sunucusunun başka bir AWS hizmetine erişmesi için en güvenli yöntem hangisidir?",o:["Erişim anahtarını (access key) kaynak koda yazmak","Kaynağa bir IAM rolü atamak","Root hesabın kimlik bilgilerini kullanmak","Anahtarı herkese açık bir dosyada tutmak"],a:1,w:"IAM rolü, işe göre verilen geçici yaka kartı gibidir: AWS kısa ömürlü kimlik bilgilerini kendisi verir ve yeniler. Koda gömülen anahtar ise kaybolan ev anahtarı gibi risklidir. [DVA-Güvenlik]"},
{t:"bk",d:1,q:"En az yetki (least privilege) ilkesi ne anlama gelir?",o:["Her kullanıcıya yönetici yetkisi vermek","İzinleri yılda bir kez gözden geçirmek","Bir kullanıcıya ya da role yalnızca işini yapması için gereken izinleri vermek","Tüm kullanıcıları aynı gruba koymak"],a:2,w:"Temizlik görevlisine tüm binanın değil, temizleyeceği katların anahtarını vermek gibidir. Bir hesap ele geçirilse bile zarar sınırlı kalır. [DVA-Güvenlik]"},
{t:"bk",d:1,q:"Veritabanı parolasını güvenle saklamak ve otomatik olarak döndürmek (rotation) için hangi AWS hizmeti tasarlanmıştır?",o:["Amazon CloudWatch","Amazon S3 (public bucket)","AWS X-Ray","AWS Secrets Manager"],a:3,w:"Secrets Manager, şifreleri belirli aralıklarla kendiliğinden değiştiren bir kasa gibidir. Uygulama parolayı koddan değil, çalışırken kasadan ister. [DVA-Güvenlik]"},
{t:"bk",d:2,q:"Mobil uygulamada kullanıcı kaydı, girişi ve giriş sonrası JWT token üretimi için Amazon Cognito'nun hangi bileşeni kullanılır?",o:["Identity pool","Her uygulama kullanıcısı için ayrı bir IAM kullanıcısı","AWS KMS","User pool"],a:3,w:"User pool, kulübün üye defteri gibidir: kayıt eder, giriş yaptırır ve token verir. Identity pool ise kullanıcıya AWS hizmetlerine erişmesi için geçici AWS kimlik bilgisi verir. [DVA-Güvenlik]"},
{t:"bk",d:2,q:"Bir IAM politikası s3:GetObject eylemine Allow veriyor, başka bir politika aynı eylem için açık (explicit) Deny içeriyor. Sonuç ne olur?",o:["Açık Deny kazanır, erişim reddedilir","Allow kazanır, erişim verilir","En son eklenen politika geçerli olur","AWS rastgele karar verir"],a:0,w:"Açık Deny, kapıdaki “girilmez” levhası gibidir: içeride kim davetiye verirse versin levha geçerlidir. IAM'de açık Deny her zaman Allow'un önüne geçer. [DVA-Güvenlik]"},
{t:"bk",d:2,q:"Lambda fonksiyonun DynamoDB tablosuna yazarken AccessDeniedException hatası alıyor. İlk olarak neyi kontrol etmelisin?",o:["Lambda'nın bellek ayarını","API Gateway stage adını","Lambda'nın execution role'ünde (çalışma rolü) o tablo için dynamodb:PutItem gibi gerekli iznin olup olmadığını","CloudFront dağıtımını"],a:2,w:"AccessDenied, kartlı geçişte kartın o kapıya tanımlı olmaması gibidir. Lambda AWS'ye kendi execution role'üyle erişir; izin oradan gelir. [DVA-Güvenlik]"},
{t:"bk",d:3,q:"AWS KMS ile büyük dosyaları şifrelerken kullanılan envelope encryption (zarf şifreleme) yöntemi nasıl çalışır?",o:["Dosya bir data key (veri anahtarı) ile şifrelenir; data key de KMS anahtarıyla şifrelenip dosyanın yanında saklanır","Dosya doğrudan root hesabın parolasıyla şifrelenir","Dosya Base64 ile kodlanır ve KMS'e yüklenir","KMS anahtarı dışa aktarılıp dosyanın içine düz metin olarak gömülür"],a:0,w:"Mektubu bir kutuya kilitler, kutunun anahtarını da bankadaki kasaya (KMS) kilitlersin. Büyük veri yerelde hızlıca şifrelenir; ana anahtar KMS'ten hiç çıkmaz. [DVA-Güvenlik]"},
{t:"bk",d:3,q:"Uygulamanın birkaç yapılandırma değeri ve döndürme (rotation) gerektirmeyen bir API anahtarı var; ekip düşük maliyetli bir çözüm istiyor. En uygun seçenek hangisidir?",o:["Değerleri kaynak koda sabit olarak yazmak","Systems Manager Parameter Store; API anahtarı için KMS ile şifrelenen SecureString parametresi","Değerleri herkese açık bir S3 dosyasında tutmak","Her değer için ayrı bir EC2 sunucusu çalıştırmak"],a:1,w:"Parameter Store, etiketli çekmeceli dolap gibidir: düz ayarlar da, SecureString olarak kilitli değerler de durur. Otomatik rotation gerektiğinde Secrets Manager daha uygun olur. [DVA-Güvenlik]"},
{t:"bk",d:1,q:"Altyapıyı YAML ya da JSON şablonlarıyla kod olarak (Infrastructure as Code) tanımlayıp kuran AWS hizmeti hangisidir?",o:["AWS CloudTrail","Amazon CloudFront","Amazon Cognito","AWS CloudFormation"],a:3,w:"CloudFormation, mimarın çizdiği plan gibidir: plan aynı kaldıkça bina her seferinde aynı kurulur. Şablondan oluşan kaynak grubuna stack denir. [DVA-Dağıtım]"},
{t:"bk",d:1,q:"AWS SAM (Serverless Application Model) ne işe yarar?",o:["Sunucuların donanımını izler","Kullanıcı parolalarını saklar","Ağ trafiğini şifreler","Lambda, API Gateway, DynamoDB gibi serverless kaynakları kısa bir şablon sözdizimiyle tanımlar ve dağıtımda CloudFormation'a dönüştürür"],a:3,w:"SAM, uzun bir resmi dilekçeyi hazır bir form şablonuyla doldurmak gibidir: kısa yazarsın, arka planda tam CloudFormation şablonuna genişletilir. [DVA-Dağıtım]"},
{t:"bk",d:1,q:"Kod değişikliğinden başlayıp build, test ve deploy adımlarını sırayla otomatik çalıştıran akışı (pipeline) yöneten AWS hizmeti hangisidir?",o:["AWS CodePipeline","AWS X-Ray","Amazon Cognito","Amazon SNS"],a:0,w:"CodePipeline, fabrikadaki yürüyen bant gibidir: ürün bir istasyondan (build) diğerine (test, deploy) kendiliğinden geçer. [DVA-Dağıtım]"},
{t:"bk",d:1,q:"AWS SAM CLI ile bir Lambda fonksiyonunu buluta göndermeden kendi bilgisayarında denemek için hangi komut kullanılır?",o:["sam delete","aws s3 ls","git push","sam local invoke"],a:3,w:"sam local invoke, sahneye çıkmadan önce evde prova yapmak gibidir: fonksiyon Docker konteynerinde yerelde çalışır. Bunun için bilgisayarda Docker kurulu olmalıdır. [DVA-Dağıtım]"},
{t:"bk",d:2,q:"CloudFormation stack'ini güncellemeden önce hangi kaynakların değişeceğini, hangilerinin silinip yeniden oluşturulacağını görmek istiyorsun. Ne kullanırsın?",o:["Stack'i silip yeniden oluşturmak","CloudWatch alarmı","Change set (değişiklik kümesi)","S3 sürümleme"],a:2,w:"Change set, tadilattan önce ustanın “şu duvar yıkılacak, şu boyanacak” listesini göstermesi gibidir: onaylamadan hiçbir şey değişmez. [DVA-Dağıtım]"},
{t:"bk",d:2,q:"Lambda'da “prod” adlı bir alias kullanıyorsun. Yeni versiyonu denemek için trafiğin küçük bir kısmını yeni versiyona, kalanını eski versiyona göndermek istiyorsun. Ne yaparsın?",o:["$LATEST'i doğrudan üretimde kullanmak","Eski versiyonu hemen silmek","Alias'a ağırlıklı yönlendirme (weighted alias) tanımlayıp iki versiyon arasında trafiği bölmek","Fonksiyonun bellek ayarını ikiye katlamak"],a:2,w:"Alias, mağazanın tabelası gibidir: tabela aynı kalır, arkadaki raf (versiyon) değişir. Ağırlıklı alias ile müşterilerin bir kısmını yeni rafa yönlendirip sorun var mı bakarsın. [DVA-Dağıtım]"},
{t:"bk",d:2,q:"CodeDeploy ile Lambda dağıtımında trafiğin önce küçük bir yüzdesinin yeni versiyona gitmesi, belirli bir süre sonra kalanının tek seferde aktarılması hangi dağıtım türüdür?",o:["All-at-once","Canary","Linear","In-place"],a:1,w:"Canary, madencilerin ocağa önce kanarya kuşu indirmesinden gelir: önce küçük bir grup dener, sorun yoksa herkes geçer. Linear ise trafiği eşit adımlarla, düzenli aralıklarla artırır. [DVA-Dağıtım]"},
{t:"bk",d:3,q:"CodeDeploy ile yeni versiyonu dağıtırken hata oranı artarsa dağıtımın kendiliğinden eski versiyona dönmesini istiyorsun. En uygun yapılandırma hangisidir?",o:["Hata oranı için bir CloudWatch alarmı oluşturup deployment group'ta bu alarmı ve otomatik geri dönüşü (automatic rollback) etkinleştirmek","Her dağıtımdan sonra logları elle okuyup gerekirse yeniden dağıtmak","Lambda timeout süresini artırmak","Eski versiyonu silmek"],a:0,w:"Alarm, mutfaktaki duman dedektörü gibidir: duman algılayınca ocağı kendiliğinden kapatır. CodeDeploy alarm tetiklenince dağıtımı durdurup son sağlam versiyona döner. [DVA-Dağıtım]"},
{t:"bk",d:1,q:"Lambda fonksiyonunun içinde yazdırdığın log satırları (console.log, print gibi) varsayılan olarak nereye gider?",o:["Amazon S3","AWS CloudTrail","Amazon CloudWatch Logs","Amazon SQS"],a:2,w:"CloudWatch Logs, fonksiyonun günlük defteri gibidir: her çağrının notları buraya yazılır. Bunun için execution role'ün log yazma izni olması gerekir. [DVA-Sorun giderme]"},
{t:"bk",d:1,q:"Bir isteğin birden çok hizmet arasında izlediği yolu (trace) ve hizmet haritasını görmek için hangi AWS hizmeti kullanılır?",o:["AWS KMS","AWS X-Ray","Amazon Cognito","AWS CloudFormation"],a:1,w:"X-Ray, kargonun her aktarma merkezindeki giriş-çıkış saatini gösteren takip ekranı gibidir: gecikmenin hangi durakta olduğunu görürsün. [DVA-Sorun giderme]"},
{t:"bk",d:2,q:"Uygulaman DynamoDB'den throttling (kısıtlama) hatası alıyor, örneğin ProvisionedThroughputExceededException. İstemci tarafında önerilen davranış hangisidir?",o:["Exponential backoff (üstel geri çekilme) ve jitter (rastgele sapma) ile bekleme süresini artırarak yeniden denemek","Hemen ve durmadan aynı isteği tekrar göndermek","Hatayı yok sayıp veriyi atmak","Tabloyu silip yeniden oluşturmak"],a:0,w:"Kalabalık bir telefon hattında 1, 2, 4, 8 saniye bekleyerek tekrar aramak gibidir; jitter herkesin aynı anda yeniden aramasını önler. AWS SDK'ları bu yeniden denemeyi büyük ölçüde kendileri yapar. [DVA-Sorun giderme]"},
{t:"bk",d:2,q:"Ürün kataloğu çok sık okunuyor ama nadiren değişiyor; veritabanı okuma yükü çok yüksek. En uygun iyileştirme hangisidir?",o:["Okunan verileri önbelleğe (cache) almak, örneğin ElastiCache ya da DynamoDB için DAX kullanmak","Her istekte tüm tabloyu Scan etmek","Log seviyesini DEBUG yapmak","Okuma yerine her istekte yazma yapmak"],a:0,w:"Önbellek, sık sorulan soruların cevabını masanın üstünde not tutmak gibidir: her seferinde arşive inmezsin. Veri değişince notu güncellemeyi (cache invalidation) unutmamak gerekir. [DVA-Sorun giderme]"},
{t:"bk",d:3,q:"Gecikmeye duyarlı bir API'de Lambda'nın cold start (soğuk başlangıç) gecikmesi sorun oluyor. Bunu azaltmak için en doğrudan çözüm hangisidir?",o:["Fonksiyonun timeout süresini artırmak","Reserved concurrency değerini sıfıra çekmek","Provisioned concurrency (önceden hazırlanmış eşzamanlılık) yapılandırmak","CloudWatch loglarını kapatmak"],a:2,w:"Provisioned concurrency, sabah müşteri gelmeden fırını önceden yakmak gibidir: ortamlar hazır bekler. Reserved concurrency'yi sıfır yapmak ise fonksiyonun hiç çalışmamasına, yani tüm çağrıların kısıtlanmasına yol açar. [DVA-Sorun giderme]"},
{t:"bk",d:3,q:"SQS'ten mesaj işleyen Lambda, bozuk bir mesajda sürekli hata veriyor; mesaj tekrar tekrar geri geliyor ve kuyruğu tıkıyor. En uygun çözüm hangisidir?",o:["Kuyruğa bir dead-letter queue (DLQ) bağlayıp redrive policy'de maxReceiveCount belirlemek","Visibility timeout'u sıfıra çekmek","Lambda'yı silmek","Kuyruğu her gün boşaltmak"],a:0,w:"DLQ, postanedeki “adres okunamadı” kutusu gibidir: belli sayıda teslim denemesinden sonra mektup kenara ayrılır, diğerleri akmaya devam eder, sen bozuk olanı sonra incelersin. [DVA-Sorun giderme]"}
];

{id:"t1",cat:"tanis",q:"Tell me about yourself.",a:"Hello, my name is Yusuf. I am an IT administrator at an international company in Ankara. I support users, systems and internal tools. I am learning networking and I want to grow in IT.",tr:"Kendini kısaca tanıt: ad, iş, güçlü yan, hedef."},

{id:"b1",cat:"bt",q:"Bir kullanıcı 'bilgisayarım çok yavaş' diyor. Ne yaparsın?",a:"Önce ne zamandır ve hangi işlemde yavaş olduğunu sorarım. Görev yöneticisinde CPU, RAM ve disk kullanımına bakarım, başlangıç programlarını ve güncellemeleri kontrol ederim. Virüs taraması ve disk sağlığı kontrolü yaparım. Çözemezsem yedek alıp temiz kurulum veya donanım önerisi sunarım ve ticket'a yaparım.",tr:"Soru sor, ölç, en olası nedeni düzelt, belgele."},
{id:"b2",cat:"bt",q:"Parolasını unutan bir kullanıcıya nasıl yardım edersin?",a:"Önce kimliğini doğrularım (güvenlik sorusu veya yönetici onayı). Sonra parolayı sıfırlar, geçici parola verir ve ilk girişte değiştirmesini zorunlu kılarım. Parolayı mesajla düz metin yollamam. İşlemi ticket'a yazarım.",tr:"Kimlik doğrulama şart; güvenlik ilk kural."},

{id:"n1",cat:"ag",q:"OSI modelini kısaca anlat.",a:"7 katmanı vardır: Fiziksel, Veri bağı, Ağ, Taşıma, Oturum, Sunum, Uygulama. Aşağıdan yukarı her katman bir işi yapar: bitler, çerçeveler (MAC), paketler (IP), segmentler (TCP/UDP) ve en üstte uygulama. Sorun gidermede katman katman ilerlemeye yarar.",tr:"7 katman, her biri bir iş; teşhis rehberi."},
{id:"n2",cat:"ag",q:"TCP ile UDP arasındaki fark nedir?",a:"TCP bağlantı kurar, veriyi sıralı ve garantili teslim eder, kayıp paketi tekrar yollar (web, e-posta). UDP bağlantısızdır, daha hızlıdır ama garanti vermez (DNS sorguları, canlı görüntü, ses).",tr:"Güvenilir ve yavaş / hızlı ve garantisiz."},
{id:"n3",cat:"ag",q:"Router ile switch arasındaki fark nedir?",a:"Switch aynı ağdaki cihazları MAC adresine göre birbirine bağlar. Router farklı ağları birbirine bağlar ve IP adresine göre en uygun yolu seçer. İnternete çıkış kapısı (gateway) router'dır.",tr:"Aynı ağ: switch. Farklı ağlar: router."},
