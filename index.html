{id:"sec",name:"Siber Güvenlik",short:"Savun, tespit et, raporla",blurb:"Önce kendi hayatını, sonra kendi laboratuvarını, en sonunda küçük bir güvenlik operasyon merkezini koru. Hepsi yasal ve izole ortamda.",col:"sec",
 projects:[
 {id:"sec1",lv:1,title:"Dijital Kale: Kendi Hayatını Güvene Al",weeks:2,tools:"Parola yöneticisi, 2FA uygulaması, modem arayüzü",
  why:"Güvenliğin temeli kendi hesaplarını, cihazlarını ve ağını korumaktır. Sıfırdan başlayıp bir güvenlik denetimi raporu çıkarırsın.",
  outcome:["Tehdit, zafiyet ve risk kavramlarını anlatabilirsin","Parola yöneticisi ve 2FA ile hesaplarını sertleştirirsin","Phishing'i tanırsın ve 1 sayfalık denetim raporu yazarsın"],
  pitch:"I audited my own digital life, fixed the weak points and wrote a one-page security report.",
  steps:[
  ["Tehdit haritanı çiz","Güvenlik 'neyi, kimden, nasıl korurum' sorusudur. Evinde en değerli eşyayı bilmeden kapıya kilit seçemezsin. Üç kelime: varlık (korunacak şey), tehdit (zarar verebilecek olay), zafiyet (açık nokta).","Kağıda 5 varlığını yaz (e-posta, banka, telefon, iş hesabı, fotoğraflar). Her biri için 'kim ne yapabilir, nasıl yapabilir?' diye bir satır ekle.","5 satırlık varlık-tehdit tablosu","asset = varlık, threat = tehdit, vulnerability = zafiyet, risk = risk","threat model asset threat vulnerability explained"],
  ["CIA üçlüsü","Güvenlik üç hedefe bakar: Gizlilik (kasa: başkası göremesin), Bütünlük (mühür: kimse değiştirmesin), Erişilebilirlik (kapı: ihtiyaç anında açılsın). Her olay bu üçünden birini bozar.","Tablodaki her varlığın yanına en kritik harfi yaz (C, I veya A) ve nedenini bir cümleyle açıkla.","Her varlık için C/I/A seçimi ve gerekçe","confidentiality = gizlilik, integrity = bütünlük, availability = erişilebilirlik","CIA triad cybersecurity simple"],
  ["Parola yöneticisi kur","Aynı parolayı her yerde kullanmak tüm kapılara aynı anahtarı takmaktır. Yönetici bir kasa: sen tek bir güçlü ana parolayı hatırlarsın, gerisini o üretir ve saklar. Uzun ve rastgele parola kısa ve karmaşık olandan güçlüdür.","Bitwarden gibi bir yönetici kur. Ana parolayı 4-5 kelimelik bir cümle yap. En önemli 5 hesabın parolasını yönetici ile yenile.","Yöneticide 5 benzersiz parola","password manager = parola yöneticisi, passphrase = parola cümlesi, unique = benzersiz","password manager setup bitwarden beginner"],
  ["İki adımlı doğrulamayı aç","2FA (iki faktörlü kimlik doğrulama): parola 'bildiğin şey', ikinci adım 'sahip olduğun şey' (telefon, anahtar). Parola çalınsa bile kapı açılmaz. SMS en zayıf, uygulama (TOTP) iyi, donanım anahtarı en iyisi.","E-posta, banka, GitHub ve bir sosyal hesabında 2FA aç. Yedek kodları güvenli yere kaydet.","4 hesapta 2FA açık","two-factor authentication = iki adımlı doğrulama, backup codes = yedek kodlar","what is 2FA TOTP authenticator app"],
  ["Phishing avcısı ol","Phishing: sahte e-posta veya sayfayla seni kandırma. Kapıya 'elektrik idaresindenim' diyen kişi gibi: kimliğini iste. Kırmızı bayraklar: acele baskısı, garip gönderen adresi, linkin üzerine gelince farklı adres, beklenmeyen ek.","Arama motorunda 'phishing quiz' ile 10 örnek incele. Kendi için 5 maddelik 'şüpheli e-posta kontrol listesi' yaz.","5 maddelik kontrol listesi","phishing = oltalama, sender = gönderen, attachment = ek, urgency = acele","phishing quiz how to spot phishing email"],
  ["Ağını ve cihazını sertleştir","Sertleştirme (hardening): gereksiz kapıları kapatmak. Modem yönetici parolasını değiştir, WPA2/WPA3 kullan, WPS'yi kapat, güncellemeleri otomatik aç, diski şifrele (BitLocker/FileVault).","Modem arayüzüne gir ve 5 ayarı kontrol et. Telefon ve bilgisayarında güncelleme ve disk şifrelemeyi doğrula. Ne değiştirdiğini not et.","5 ayarlık önce/sonra notu (şifreleri karart)","hardening = sertleştirme, firmware = üretici yazılımı, encryption = şifreleme","home router security settings WPA3 firmware"],
  ["3-2-1 yedekleme ve denetim raporu","Fidye yazılımına (ransomware) karşı tek gerçek savunma çalışan yedektir. 3-2-1: 3 kopya, 2 farklı ortam, 1 tanesi dışarıda. Yedek, geri yüklenebiliyorsa yedektir.","Önemli dosyalar için yedek kur ve 1 dosyayı geri yükle. Sonra 'Kişisel Güvenlik Denetimi' raporu yaz: bulgu, risk, düzeltme, durum.","1 sayfalık denetim raporu","backup = yedek, restore = geri yükleme, ransomware = fidye yazılımı","3-2-1 backup rule explained"]
  ]},
 {id:"sec2",lv:2,title:"Ev Laboratuvarı: Saldırıyı Görerek Savun",weeks:4,tools:"VirtualBox, Kali Linux, Ubuntu Server, nmap, Wireshark, DVWA",
  why:"Savunmayı saldırganın gözünden görerek öğrenirsin. Her şey kendi izole laboratuvarında olur; başkasının sistemine asla dokunulmaz.",
  outcome:["İzole bir güvenlik laboratuvarı kurarsın","nmap, Wireshark ve log okuyarak bir sistemi analiz edersin","Zafiyeti bulup düzeltir ve bulgu raporu yazarsın"],
  pitch:"I built an isolated security lab, found vulnerabilities in my own test systems, fixed them and documented each finding.",
  steps:[
  ["Güvenli lab kur ve kuralları koy","Kural 1: sadece kendi laboratuvarında dene. Yangın tatbikatını kendi mutfağında yaparsın, komşunun evinde değil. Sanal makineler ana bilgisayarından ve internetten izole bir iç ağda durur.","VirtualBox kur. Kali Linux ve Ubuntu Server'ı önce NAT adaptörüyle kurup güncelle ve gerekli paketleri (nmap, ufw, fail2ban) yükle. Sonra ikisini aynı 'Internal Network'e al ve elle statik IP ver (örn. 10.0.0.10 ve 10.0.0.20; bu ağda otomatik IP dağıtımı yoktur). Birbirlerine ping at.","İki makinenin birbirini ping'lediği ekran görüntüsü","virtual machine = sanal makine, isolated network = izole ağ, scope = kapsam","virtualbox kali linux ubuntu internal network lab"],
  ["Linux ve komut satırı temeli","Güvenliğin çoğu Linux'ta döner. Dosya izinleri (kim okur, yazar, çalıştırır), kullanıcılar ve grup yapısı bir binanın anahtar sistemi gibidir.","10 komutu elle dene: ls, cd, cat, grep, chmod, chown, ps, ss, sudo, ssh. Her birinin ne yaptığını kendi cümlenle yaz.","10 komutluk kendi cheat sheet'in","permission = izin, user = kullanıcı, process = süreç","linux command line basics for security chmod grep ss"],
  ["Keşif: nmap ile kapıları say","Bir sunucu bir bina, portlar kapılar ve pencerelerdir. nmap hangisinin açık olduğunu gösterir. Açık kapı = saldırı yüzeyi (attack surface). CCNA'daki TCP/UDP port bilgisi burada işe yarar.","Ubuntu VM'ine nmap -sV ile tarama at. Açık her port için hangi servis olduğunu ve gerekip gerekmediğini yaz.","Tarama çıktısı ve port başına 1 cümle","port scan = port taraması, service = servis, attack surface = saldırı yüzeyi","nmap tutorial beginners -sV port scan own lab"],
  ["Trafiği gör: Wireshark","Şifresiz trafik kartpostal, şifreli trafik kapalı zarf gibidir. HTTP ile HTTPS, Telnet ile SSH farkı Wireshark'ta gözle görülür.","Ubuntu'ya nginx kur; bir HTTP sayfası ve kendi imzaladığın (self-signed) sertifikayla bir HTTPS sayfası yayınla. Wireshark ile her ikisini yakala. Hangisinde içerik okunuyor, not et.","Yakalama ekranı ve 3 cümlelik fark açıklaması","packet capture = paket yakalama, plaintext = düz metin, encrypted = şifreli","wireshark beginner http vs https capture"],
  ["Zafiyetli uygulama: SQLi ve XSS","DVWA bilerek açık bırakılmış bir test uygulamasıdır. SQL injection: form girdisinin veritabanına komut gibi gitmesi; garsonun not kağıdındaki 've şefe de bunu söyle' cümlesini emir sanması gibi. XSS: sayfaya zararlı script yerleşmesi.","DVWA'yı lab'ında kur (düşük güvenlik). SQLi ve XSS örneğini dene. Neden çalıştığını ve nasıl önlenir (parametreli sorgu, çıktı kodlama) yaz.","2 açık için 'neden oldu, nasıl düzelir' notu","injection = enjeksiyon, input validation = girdi doğrulama, sanitize = temizlemek","DVWA SQL injection XSS explained OWASP top 10"],
  ["Log oku ve saldırıyı yakala","Güvenlik kamerasının kaydı gibi: olay olduktan sonra log'a bakarsın. /var/log/auth.log başarısız giriş denemelerini gösterir. fail2ban tekrar eden deneyeni otomatik engeller.","Kendi Kali makinenden Ubuntu'ya yanlış parolayla birkaç SSH denemesi yap. Log'da satırları bul. fail2ban kur ve engellendiğini göster.","Log satırı ekran görüntüsü ve engelleme kanıtı","log = kayıt, failed login = başarısız giriş, ban = yasaklamak","linux auth.log failed ssh fail2ban tutorial"],
  ["Savun: firewall ve SSH sertleştirme","Savunma katmanlıdır: firewall (kapı görevlisi), SSH'ta sadece anahtarla giriş (parola yok), gereksiz servisleri kapat. Önce ölç sonra düzelt, sonra tekrar ölç.","DİKKAT: kendini dışarıda bırakma. Önce 'ufw allow OpenSSH', sonra 'ufw enable'. Anahtarla girişin çalıştığını ayrı bir pencerede denemeden parola girişini kapatma. UFW ile sadece gerekli portları aç. SSH'ı anahtar bazlı yap. nmap'i tekrar çalıştır ve önceki çıktıyla karşılaştır.","Önce/sonra port tablosu","firewall = güvenlik duvarı, key-based authentication = anahtarla giriş, least privilege = en az yetki","ubuntu ufw ssh key only hardening"],
  ["Bulgu raporu yaz","Teknik bulgu raporu yazılmazsa değeri yoktur. İyi rapor: ne buldum, kanıt, etkisi (risk), nasıl düzeltilir. Yöneticiye ve teknik ekibe aynı rapor farklı özetlerle gider.","Bu projedeki 3 bulgu için rapor yaz (örn. açık port, DVWA SQLi, SSH parola girişi). Her biri için risk: düşük/orta/yüksek ver. Markdown olarak GitHub'a koy.","3 bulgulu rapor (markdown)","finding = bulgu, severity = önem derecesi, remediation = düzeltme","penetration test report example findings"]
  ]},
 {id:"sec3",lv:3,title:"Mini SOC: Tespit, Müdahale, Rapor",weeks:8,tools:"Wazuh (SIEM), Docker, Python, Juice Shop, Burp Suite Community, MITRE ATT&CK",
  why:"Kurumsal güvenlik bir SOC ekibinin işidir. Küçük ölçekte log topla, tespit kuralı yaz, olaya müdahale planı çıkar ve hepsini portfolyoya çevir.",
  outcome:["SIEM kurup ajanlardan log toplarsın","Kendi tespit kuralını yazar ve MITRE ATT&CK'e eşlersin","Olay müdahale playbook'u ve Python aracı ile portfolyo çıkarırsın"],
  pitch:"I built a small SOC lab with a SIEM, wrote custom detection rules mapped to MITRE ATT&CK and documented an incident response playbook.",
  steps:[
  ["SIEM nedir, Wazuh'u kur","SIEM: tüm cihazların loglarını tek ekranda toplayıp uyaran güvenlik kamerası odası. Wazuh açık kaynaktır; sunucu ve ajan mantığıyla çalışır.","Wazuh'u Docker veya VM ile kur. Bir Ubuntu ve bir Windows VM'e ajan yükle, panelde göründüklerini doğrula.","Panelde 2 bağlı ajanın ekranı","SIEM = güvenlik olay yönetimi, agent = ajan, dashboard = pano","wazuh docker single node install agent"],
  ["Log kaynakları ve olay kimlikleri","Her sistem kendi dilinde log yazar. Windows'ta 4625 başarısız, 4624 başarılı giriştir. Linux'ta auth.log. CCNA'daki Syslog ve NTP burada devreye girer: saatler yanlışsa olay sırası karışır.","Windows VM'de bilerek birkaç yanlış parola dene (4625 üret). Wazuh panelinde bu olayları bul ve zaman damgasını kontrol et.","4625 olaylarının pano ekran görüntüsü","event ID = olay kimliği, timestamp = zaman damgası, log source = log kaynağı","windows event id 4625 4624 wazuh"],
  ["MITRE ATT&CK haritası","ATT&CK saldırganların taktik ve tekniklerinin ortak sözlüğüdür; hırsızın adım adım planını gösteren harita gibi. Tespit yazarken 'hangi teknik için?' diye sorarsın.","3 teknik seç (örn. T1110 Brute Force, T1059 Command and Scripting Interpreter, T1053 Scheduled Task/Job). Her biri için hangi log'da iz kalır ve nasıl yakalarsın yaz.","3 teknik için tespit fikri tablosu","tactic = taktik, technique = teknik, detection = tespit","MITRE ATT&CK beginner T1110 brute force detection"],
  ["Kendi tespit kuralını yaz","İyi kural gürültü yapmaz: '5 dakikada 5 başarısız giriş' gibi eşik. Yanlış alarm (false positive) kuralı işe yaramaz hale getirir.","Wazuh'ta özel kural yaz: aynı kaynaktan 5 dakikada 5 başarısız SSH girişi → uyarı. Kuralı tetikle, uyarıyı gör, bir yanlış alarm senaryosunu değerlendir.","Kural dosyası ve uyarı ekran görüntüsü","rule = kural, threshold = eşik, false positive = yanlış alarm","wazuh custom rule failed login frequency"],
  ["Python ile kendi aracını yaz","Araç yazmak seni kullanıcıdan üreticiye geçirir. Log analizci: dosyayı oku, IP başına başarısız deneme say, eşik üstünü yaz. Sadece kendi lab loglarında çalıştır.","auth.log okuyup IP başına başarısız giriş sayan 40 satırlık Python script yaz. Çıktıyı CSV'ye kaydet. README ile GitHub'a koy.","GitHub'da çalışan script ve örnek çıktı","parse = ayrıştırmak, regex = düzenli ifade, script = betik","python parse auth.log failed password count by ip"],
  ["Web uygulama testi: Juice Shop","OWASP Juice Shop bilerek zafiyetli modern bir uygulamadır. Burp Suite proxy ile istekleri durdurup incelersin: tarayıcı ile sunucu arasındaki gözlemci gibi.","Juice Shop'u Docker ile lab'ında çalıştır. Burp Community ile trafiği izle. 3 zafiyet bul (örn. XSS, bozuk erişim kontrolü, hassas veri) ve her birini düzeltme önerisiyle yaz.","3 zafiyetli kısa pentest raporu","proxy = ara sunucu, vulnerability = zafiyet, access control = erişim kontrolü","OWASP Juice Shop Burp Suite beginner walkthrough"],
  ["Olay müdahale playbook'u","Olay anında panik değil plan çalışır. NIST SP 800-61 Rev.2'nin klasik aşamaları: Hazırlık, Tespit ve Analiz, Sınırlama-Temizleme-Kurtarma, Ders çıkarma (yeni Rev.3 aynı fikri CSF 2.0 işlevleriyle anlatır). Yangın tatbikatı gibi önceden yazılır ve denenir.","'Bir kullanıcı şüpheli ek açtı' senaryosu için 1-2 sayfalık playbook yaz: kim ne yapar, ilk 15 dakika, sınırlama, kanıt toplama, iletişim. Masabaşı tatbikat yap ve zaman çizelgesi çıkar.","Playbook ve tatbikat zaman çizelgesi","incident response = olay müdahale, containment = sınırlama, post-mortem = olay sonrası inceleme","NIST incident response lifecycle playbook example"],
  ["Final: portfolyo ve yol haritası","Güvenlikte işe alım kanıta bakar. Repo, rapor, ekran görüntüsü ve kısa anlatım senin CV'ndir. Sertifika yolu: Security+ (genel), CCNA (ağ), BTL1 veya CCNA Cybersecurity (eski adı CyberOps, sınav kodu 200-201; SOC).","Tek bir repo kur: lab mimarisi diyagramı, kurallar, script, raporlar, ATT&CK eşleme tablosu, README. LinkedIn için 5 cümlelik İngilizce özet yaz.","GitHub repo bağlantısı ve İngilizce özet","portfolio = portfolyo, certification = sertifika, SOC analyst = SOC analisti","SOC analyst home lab portfolio github"]
  ]}
 ]},
{id:"qa",name:"Test ve Kalite (QA)",short:"Hatayı bul, otomatikleştir, kaliteyi ölç",blurb:"Elle test etmeyi öğren, sonra otomasyona geç, en sonunda API, performans ve CI ile kalite stratejisi kur.",col:"qa",
 projects:[
 {id:"qa1",lv:1,title:"Manuel Test: İlk Test Planım",weeks:2,tools:"Tarayıcı, Google Sheets, demo test siteleri",
  why:"Test işi 'bozuk mu çalışıyor' bakmaktan fazlasıdır: risk düşünmek, senaryo yazmak ve hatayı net anlatmaktır. Gerçek bir demo uygulamada baştan sona yaparsın.",
  outcome:["Test senaryosu ve hata raporu yazarsın","Sınır değer gibi test tekniklerini uygularsın","Bir test raporu ile bulgularını sunarsın"],
  pitch:"I wrote test cases, found and reported bugs on a demo web app and prepared a short test report.",
  steps:[
  ["Test neden var?","Restoranda şef yemeği servise çıkarmadan tadar. Test de ürünü kullanıcıya vermeden riskleri bulmaktır. Önemli: test hataların varlığını gösterir, yokluğunu ispatlayamaz.","Günlük hayattan bir uygulama seç (örn. WhatsApp). Kullanıcıyı mağdur edebilecek 5 olası hata yaz ve hangisinin en riskli olduğunu işaretle.","5 hata ve 1 risk seçimi","bug = hata, defect = kusur, risk = risk, quality = kalite","what is software testing explained simply"],
  ["Test seviyeleri ve piramit","Küçük parça (unit), parçalar birlikte (integration), tüm sistem (system), müşteri kabulü (acceptance). Test piramidi: altta çok hızlı küçük testler, üstte az sayıda yavaş arayüz testi.","Piramidi çiz. Bir online alışveriş sitesi için her seviyeye 1 örnek yaz.","Piramit çizimi ve 4 örnek","unit test = birim testi, integration = entegrasyon, acceptance = kabul","test pyramid unit integration e2e explained"],
  ["Test senaryosu yaz","İyi senaryo başkasının da aynı sonuca ulaşacağı kadar net olur: kimlik, başlık, ön koşul, adımlar, beklenen sonuç. Analoji: tarif; adımları takip eden herkes aynı yemeği çıkarmalı.","saucedemo.com giriş sayfası için 8 senaryo yaz: geçerli kullanıcı, yanlış parola, boş alanlar, kilitli kullanıcı, büyük/küçük harf vb. Sheets tablosunda tut.","8 senaryolu tablo","test case = test senaryosu, precondition = ön koşul, expected result = beklenen sonuç","how to write test cases step by step example login"],
  ["Sınır değer ve eşdeğer sınıf","Hataların çoğu kenarda saklanır. Asansör 10 kişilik: 9, 10, 11 dene. Eşdeğer sınıf: aynı davranan girdileri bir grup say, her gruptan birini dene.","Yaş alanı 18-65 kabul ediyor. Sınır değerleri (17, 18, 19, 64, 65, 66) ve geçersiz sınıfları (harf, boş, negatif) belirle, tablo yap.","Sınır değer tablosu","boundary value = sınır değer, equivalence partition = eşdeğer sınıf, valid/invalid = geçerli/geçersiz","boundary value analysis equivalence partitioning simple"],
  ["Keşif testi ve hata raporu","Keşif testi: senaryosuz ama bilinçli gezinme. Hata raporu başkasının tekrar üretebileceği kadar net olur: başlık, adımlar, beklenen, gerçekleşen, ortam, kanıt, önem.","the-internet.herokuapp.com sitesinde 3 sayfayı keşfet. En az 2 bulgu için profesyonel hata raporu yaz; en az birini İngilizce yaz.","2 hata raporu (1'i İngilizce)","steps to reproduce = tekrar üretme adımları, actual result = gerçekleşen sonuç, severity = önem","how to write a good bug report example"],
  ["Testi çalıştır ve takip et","Senaryo yazmak yetmez, çalıştırıp sonucu izlersin: Geçti, Kaldı, Engellendi. Jira, Trello veya basit bir tablo ile hata durumu (Yeni, Çözüldü, Tekrar test) takip edilir.","Senaryolarını çalıştır ve sonuç sütunu ekle. Bulduğun hataları bir Trello panosuna kart olarak aç. Durumları güncelle.","Sonuçlu tablo ve Trello panosu","pass/fail = geçti/kaldı, blocked = engellendi, retest = yeniden test","manual test execution tracking jira trello bug lifecycle"],
  ["Test raporu ve sunum","Rapor karar vericinin sorusuna cevap verir: çıkabilir mi, risk ne? Kapsam, çalıştırılan senaryolar, geçen/kalan sayısı, açık kritik hatalar, öneri.","1 sayfalık test özet raporu yaz. 2 dakikalık sesli sunum prova et: 'Test summary: we ran ... and found ...'.","1 sayfalık rapor ve prova","test summary = test özeti, coverage = kapsam, recommendation = öneri","test summary report example one page"]
  ]},
 {id:"qa2",lv:2,title:"Otomasyon: Playwright ile E2E",weeks:4,tools:"Python, pytest, Playwright, GitHub Actions",
  why:"Tekrar eden testleri makineye yaptırırsın. Playwright ile gerçek tarayıcıyı kodla sürer, testlerini her kod değişikliğinde otomatik çalıştırırsın.",
  outcome:["Python ile temel kod yazarsın","Playwright ve pytest ile 15 testlik bir set kurarsın","Page Object kalıbı ve GitHub Actions ile otomatik çalıştırırsın"],
  pitch:"I built a Playwright and pytest end-to-end suite with Page Objects and ran it automatically in GitHub Actions.",
  steps:[
  ["Python temeli: yeterli kadar","Otomasyon için tam yazılımcı olmana gerek yok ama değişken, if, for, liste, sözlük, fonksiyon şart. Kod, tarifi makineye adım adım yazmaktır.","Bir hafta boyunca küçük 5 alıştırma yaz: not ortalaması, kelime sayacı, liste filtreleme, dosyadan okuma, basit fonksiyon. Her birini GitHub'a koy.","5 küçük script","variable = değişken, function = fonksiyon, list = liste, loop = döngü","python for beginners variables functions lists"],
  ["Tarayıcı içini oku: HTML ve DevTools","Sayfa bir ağaçtır (DOM). Testin bir butonu bulması için ona bir adres (selector) gerekir. DevTools (F12) ile elemanı incele.","saucedemo.com'da giriş kutusunu, parola kutusunu ve butonu DevTools ile bul. Her birini 2 farklı yolla tarif et (id ve metin).","6 locator tanımı","DOM = sayfa ağacı, selector = seçici, element = eleman","chrome devtools inspect element css selector basics"],
  ["Playwright kur, ilk testi yaz","Playwright tarayıcıyı komutla sürer: tıkla, yaz, kontrol et. Kontrol (assert) testin kalbidir: 'bekleneni gördüm mü?'","pytest ve playwright (Python) kur: 'pip install pytest-playwright', sonra 'playwright install' (tarayıcıları indirir). Geçerli kullanıcı ile giriş yapıp ürün listesini gören ilk testi yaz ve çalıştır.","Geçen ilk test","automation = otomasyon, assertion = doğrulama, browser context = tarayıcı bağlamı","playwright python pytest getting started"],
  ["Locator ve bekleme: kırılgan testten kaç","Flaky test: bazen geçen bazen kalan test. Sebebi çoğu zaman beklememek veya kötü locator. Playwright otomatik bekler ama doğru locator seçmek sana düşer: metin, rol, test-id.","Giriş testini role/text locator ile yeniden yaz. Bilerek yavaşlatılmış bir sayfada (the-internet 'dynamic loading') bekleme testi yaz.","İstikrarlı çalışan 3 test","flaky = kararsız, auto-wait = otomatik bekleme, locator = bulucu","playwright locators best practices flaky tests"],
  ["pytest: fixture ve veri güdümlü test","Fixture her testten önce hazırlık yapar (tarayıcıyı aç, giriş yap). Parametre ile aynı test farklı verilerle koşar. Analoji: tek tarif, farklı malzeme.","Manuel senaryolarını (qa1) pytest parametre ile otomatikleştir: 8 senaryo tek fonksiyonda. Giriş fixture'ı yaz.","8 otomatik senaryo","fixture = hazırlık yapısı, parametrize = parametreli çalıştırma, test data = test verisi","pytest fixtures parametrize tutorial"],
  ["Page Object kalıbı","Her sayfa için bir sınıf: butonlar ve eylemler orada durur. Arayüz değişirse tek yeri düzeltirsin. Analoji: TV kumandası; kanal numarasını bilmen gerekmez, düğmeye basarsın.","LoginPage ve InventoryPage sınıflarını yaz. Testlerini bu sınıflara taşı. 15 teste ulaş.","Page Object'li 15 test","page object = sayfa nesnesi, maintainable = bakımı kolay, refactor = yeniden düzenlemek","page object model playwright python"],
  ["Rapor ve izleme","Kalan testte neyin kırıldığını görmek şarttır: ekran görüntüsü, video, trace. Playwright Trace Viewer testin 'film kaydı'dır.","Başarısız testte ekran görüntüsü ve trace alacak şekilde ayarla. Bilerek bir testi boz, kayıtla nedenini bul.","Trace dosyası ve nedenin açıklaması","trace = iz kaydı, screenshot = ekran görüntüsü, report = rapor","playwright trace viewer debugging failed test"],
  ["GitHub Actions ile otomatik çalıştır","CI: kod her gönderildiğinde testlerin otomatik koşması. Kırık değişiklik hemen fark edilir. Yaml dosyası makineye 'şunu şu sırayla yap' demektir.","Repo'ya bir workflow ekle: Python kur, bağımlılıkları yükle, playwright'ı kur, testleri çalıştır, raporu artefakt olarak yükle. README'ye rozet ekle. Repoyu GitHub'da yayınla.","Yeşil Actions çalışması ve README","workflow = iş akışı, pipeline = hat, artifact = çıktı dosyası, badge = rozet","github actions playwright python workflow example"]
  ]},
 {id:"qa3",lv:3,title:"Kalite Stratejisi: API, Performans ve CI/CD",weeks:6,tools:"SQL, Postman, pytest + requests, k6, GitHub Actions",
  why:"Kıdemli test mühendisi tek tek test yazmaz, kalite sistemi kurar: veriyi doğrular, API'yi sınar, yükü ölçer, kapıları CI'a koyar ve riski yönetir.",
  outcome:["SQL ile veri ve API ile servis doğrularsın","k6 ile performans testi yapıp sonuçları yorumlarsın","Risk bazlı strateji ve CI kalite kapıları kurarsın"],
  pitch:"I designed a quality strategy covering API tests, performance tests and CI quality gates, driven by risk.",
  steps:[
  ["SQL ile veriyi doğrula","Arayüz 'kaydedildi' dese bile veritabanına bakmazsan bilemezsin. SELECT, WHERE, JOIN, COUNT ile test verisini kontrol edersin. Tablo, Excel sayfası gibidir.","SQLite ile 2 tablolu (müşteri, sipariş) örnek veritabanı kur. 10 sorgu yaz: filtre, sıralama, JOIN, COUNT, tekrar eden kayıt bulma.","10 sorgu dosyası","query = sorgu, join = birleştirme, primary key = birincil anahtar","sql for testers select join beginner sqlite"],
  ["HTTP ve REST: arka kapıyı tanı","Arayüzün altında API konuşur: istek (request) ve cevap (response). Durum kodları: 200 başarılı, 201 oluştu, 400 kötü istek, 401 yetkisiz, 404 yok, 500 sunucu hatası. CCNA'daki REST ve JSON konusu burada işe yarar.","Postman'da jsonplaceholder.typicode.com ile GET, POST, PUT, DELETE dene (sahte API'dir: yazdıkların kaydedilmez, doğrulama yapmaz). Hatalı veri ve yetkisiz istek denemelerini restful-booker.herokuapp.com gibi bir test API'sinde ya da kendi bk2 API'nde yap. Her istekte durum kodunu ve JSON gövdesini yorumla.","8 isteklik Postman koleksiyonu","request = istek, response = cevap, status code = durum kodu, payload = veri gövdesi","postman rest api testing beginners status codes"],
  ["API testlerini kodla","Postman elle, kod otomatik ve tekrarlanabilir. Pozitif testin yanında negatif test yaz: eksik alan, hatalı tür, yetkisiz istek. Şema doğrulaması cevabın biçimini kontrol eder.","pytest + requests ile 12 API testi yaz: 6 olumlu, 6 olumsuz. JSON şema doğrulaması ekle.","12 testli API paketi","negative test = olumsuz test, schema = şema, validation = doğrulama","pytest requests api testing json schema"],
  ["Test verisi ve taklit servisler","Güvenilir test, her seferinde aynı başlangıç verisiyle başlar. Dış servis yavaşsa taklit (mock) kullanırsın: film seti gibi, gerçek bina yerine dekor.","Bir testi harici API'ye bağımlılıktan kurtar: 'responses' kütüphanesiyle cevabı taklit et. Test verisi oluşturan ve temizleyen fixture yaz.","Taklitli test ve temizlik fixture'ı","mock = taklit, stub = sahte cevap, test data = test verisi, isolation = yalıtım","python mock api responses library pytest test data"],
  ["Performans testi: k6","Uygulama tek kullanıcıda hızlı olabilir. Yük testi kalabalık gelince ne olduğuna bakar. p95 gecikme: isteklerin %95'i bu süreden hızlı. Maç günü stadyum kapısı gibi: kapasite ölçülür.","k6 ile 20 sanal kullanıcı, 30 saniyelik script yaz. Sadece kendi API'ne (ör. bk2 projesi) ya da yük testine izin veren demo siteye (quickpizza.grafana.com) uygula; izinsiz bir siteye yük bindirme. Ortalama, p95 ve hata oranını yorumla; 'kabul eşiği' belirle.","k6 çıktısı ve 5 cümlelik yorum","load test = yük testi, latency = gecikme, throughput = iş hacmi, threshold = eşik","k6 load testing beginner tutorial p95"],
  ["Risk bazlı test stratejisi","Her şeyi test etmek imkansız; riskli yerden başlarsın. Risk = olasılık × etki. Test planı: kapsam, risk, yaklaşım, giriş ve çıkış kriterleri, araçlar, roller.","Bir e-ticaret uygulaması için 2 sayfalık strateji yaz: 10 özellik, her birine risk puanı, hangisine hangi test türü, otomasyon mu elle mi.","Risk tablolu strateji dokümanı","risk-based testing = risk bazlı test, entry/exit criteria = giriş/çıkış kriteri, scope = kapsam","risk based testing test strategy example"],
  ["CI/CD kalite kapıları","Kalite kapısı: belirli koşulu sağlamayan kod ilerleyemez. Pipeline: lint, birim, API, hızlı E2E, ardından raporlar. Yavaş testler gece koşar.","GitHub Actions'ta 3 aşamalı pipeline kur: hızlı testler zorunlu, E2E smoke testi PR'da, tam set zamanlanmış. Başarısızlıkta merge'i engelleyen kuralı açıkla.","Pipeline yaml dosyası ve çalıştırma ekranı","quality gate = kalite kapısı, pull request = çekme isteği, smoke test = duman testi, schedule = zamanlama","github actions test pipeline quality gate smoke tests"],
  ["Final: kalite panosu ve kariyer planı","Kalite görünür olmalı: geçme oranı, hata yoğunluğu, kaçan hata (escaped defect), ortalama düzeltme süresi. ISTQB Foundation sertifikası sektörde yaygın bir başlangıçtır.","Tüm projeleri tek repoda topla: strateji, testler, k6, pipeline, README. Basit bir metrik tablosu ekle. 'I improved quality by ...' ile başlayan 5 cümlelik mülakat cevabı yaz.","GitHub repo ve İngilizce mülakat cevabı","metrics = ölçümler, escaped defect = kaçan hata, ISTQB = uluslararası test sertifikası","ISTQB foundation roadmap QA engineer portfolio"]
  ]}
 ]},
{id:"bk",name:"Backend Geliştirici",short:"C# ve ASP.NET Core ile uçtan uca servis",blurb:"Konsol uygulamasından başla, REST API kur, sonra kimlik doğrulama, PostgreSQL, Docker ve CI ile üretime hazır bir servise ulaş.",col:"bk",
 projects:[
 {id:"bk1",lv:1,title:"Konsol Görev Yöneticisi (C#)",weeks:3,tools:".NET SDK, VS Code veya Visual Studio, Git, xUnit",
  why:"Backend'in temeli veriyi doğru tutmak ve mantığı temiz yazmaktır. Küçük bir C# uygulamasında değişken, sınıf, dosya, test ve git'i birlikte öğrenirsin.",
  outcome:["C# temelleri ve sınıf mantığını kavrarsın","Veriyi JSON dosyasında kalıcı saklarsın","xUnit ile test yazar ve projeyi GitHub'a koyarsın"],
  pitch:"I built a C# console task manager with file persistence, unit tests and a clean Git history.",
  steps:[
  ["Backend nedir?","Restoranda müşteri (arayüz) sipariş verir, mutfak (backend) hazırlar, kiler (veritabanı) malzemeyi saklar. Backend görünmeyen ama her şeyi çalıştıran kısımdır: kurallar, veri, güvenlik.","Bir uygulamada (örn. yemek siparişi) bir siparişin akışını 6 adımda çiz: kim, ne gönderiyor, nerede saklanıyor.","6 adımlık akış çizimi","frontend = ön yüz, backend = arka yüz, database = veritabanı, request = istek","what is backend development explained simply"],
  ["Ortamı kur, ilk programı yaz","Bir program derlenen talimat listesidir. .NET SDK ile 'dotnet new console' bir iskelet verir. Git, kodun fotoğraf albümüdür: istediğin ana dönebilirsin.","SDK ve editörü kur. Hello World çalıştır. git init ile repo aç, ilk commit'i yap, GitHub'a gönder.","GitHub'da ilk commit","SDK = geliştirme kiti, compile = derlemek, commit = kayıt noktası, repository = depo","dotnet new console hello world git first commit"],
  ["Değişken, koşul, döngü, metot","Değişken kutu, if karar, for tekrar, metot tarifin tek adımıdır. Önce küçük çalışan parça, sonra büyüt.","Bir menü yaz: 1 Ekle, 2 Listele, 3 Çık. Seçime göre ayrı metotlar çağır. Girdi doğrulama ekle (sayı olmayan girişte çökmesin).","Çalışan menü","variable = değişken, condition = koşul, loop = döngü, method = metot","c# basics variables if for methods console menu"],
  ["Sınıf ve nesne (OOP)","Sınıf kurabiye kalıbı, nesne kalıptan çıkan kurabiyedir. Veriyi ve davranışı bir arada tutarsın: TaskItem hem başlığı hem 'tamamla' eylemini bilir.","TaskItem sınıfı yaz (Id, Başlık, Tamamlandı, Oluşturma tarihi). List<TaskItem> içinde yönet: ekle, tamamla, sil.","Sınıflı çalışan uygulama","class = sınıf, object = nesne, property = özellik, encapsulation = kapsülleme","c# classes objects oop beginner list"],
  ["Kalıcılık: JSON dosyası","Program kapanınca bellek silinir; kalıcı olması için dosyaya yazılır. JSON anahtar-değer metnidir. Dosya okuma yazma hata verebilir: try/catch ile kontrollü başarısızlık.","Görevleri System.Text.Json ile tasks.json dosyasına kaydet, açılışta oku. Dosya yoksa veya bozuksa uygulama çökmeden boş listeyle başlasın.","Yeniden açınca veri duruyor","serialize = metne çevirmek, deserialize = nesneye çevirmek, exception = istisna","c# system.text.json read write file try catch"],
  ["LINQ ve ilk birim testler","LINQ listeyi sorgulamaktır: Where (süz), OrderBy (sırala). Test, kodun kendi kendine 'doğru çalışıyor muyum?' demesidir; xUnit ile her mantık parçasına küçük bir test.","Tamamlanmamış görevleri tarihe göre listele (LINQ). Görev servisi için 5 xUnit testi yaz: ekle, tamamla, sil, boş başlık hatası, sıralama.","5 geçen test","unit test = birim testi, assert = doğrulama, LINQ = sorgu dili, refactor = düzenleme","c# linq where orderby xunit unit test beginner"],
  ["Final: README ve portfolyo","Kod okunur ve anlaşılır olmalı. README, projenin vitrinidir: ne yapar, nasıl çalıştırılır, ne öğrendim. .gitignore gereksiz dosyaları dışarıda tutar.","README yaz (kurulum, kullanım, örnek çıktı). .gitignore ekle. Projeyi GitHub'a gönder. İngilizce 3 cümleyle projeyi anlat.","GitHub repo ve 3 cümlelik İngilizce özet","README = tanıtım dosyası, .gitignore = yok sayma listesi, feature = özellik","good github readme for beginner project"]
  ]},
 {id:"bk2",lv:2,title:"REST API: ASP.NET Core ve EF Core",weeks:5,tools:"ASP.NET Core Web API, EF Core, SQLite, Swagger, xUnit, GitHub Actions",
  why:"Gerçek backend işi bir API'dir. Destek talebi (ticket) sistemi için CRUD API yazar, veritabanına bağlar, test eder ve CI ile doğrularsın.",
  outcome:["REST ilkelerine uygun CRUD API yazarsın","EF Core ve SQLite ile veri kalıcılığı kurarsın","Katmanlı yapı, DI, integration test ve CI ile teslim edersin"],
  pitch:"I built a ticket management REST API with ASP.NET Core, EF Core and automated tests running in GitHub Actions.",
  steps:[
  ["HTTP ve REST temeli","İstemci istek yollar, sunucu cevap döner. Fiiller: GET oku, POST oluştur, PUT güncelle, DELETE sil. Adresler kaynağı gösterir: /tickets/5. Durum kodları cevabın özetidir (CCNA'daki 404/200 bağlantısı).","Postman'da açık bir API ile 4 fiili dene. 'Bir ticket sistemi için hangi adresler olmalı?' listesini çıkar.","8 adreslik API taslağı","endpoint = uç nokta, route = yol, verb = fiil, resource = kaynak","REST API basics HTTP methods status codes"],
  ["İlk Web API ve sağlık ucu","'dotnet new webapi --use-controllers' iskeleti verir (yeni .NET sürümlerinde varsayılan şablon controller'sız minimal API'dir ve Swagger arayüzü gelmez; arayüz için Swashbuckle.AspNetCore ya da Scalar paketi ekle). İlk uç nokta /health 'çalışıyorum' der (yerleşik AddHealthChecks/MapHealthChecks kullanabilirsin). Swagger arayüzü API'nin kendi kullanma kılavuzudur.","Projeyi oluştur, /health ucunu ekle, Swagger'dan çağır, GitHub'a gönder.","Swagger'da çalışan /health","controller = denetleyici, middleware = ara katman, Swagger = API dokümanı","asp.net core web api first endpoint swagger"],
  ["Model, DTO ve doğrulama","Veritabanı nesnesini doğrudan dışarı vermek iç dolabını sokağa açmak gibidir. DTO yalnız gösterilecek alanları taşır. Doğrulama kötü veriyi kapıda durdurur.","Ticket modeli (Başlık, Açıklama, Öncelik, Durum) ve Create/Read DTO'ları yaz. DataAnnotations ile zorunlu alan ve uzunluk kuralları koy.","DTO'lu model ve 400 hatası denemesi","DTO = veri taşıma nesnesi, validation = doğrulama, entity = varlık sınıfı","asp.net core dto validation data annotations why"],
  ["Veritabanı ve EF Core","Tablo Excel sayfası, satır kayıt, birincil anahtar kimlik numarası, yabancı anahtar iki tabloyu bağlayan referanstır. EF Core nesneleri tabloya çevirir; migration veritabanı şemasının sürüm geçmişidir.","SQLite ile EF Core kur. Ticket ve Comment tabloları arasında ilişki kur. İlk migration'ı üret ve uygula.","Migration dosyası ve oluşan veritabanı","ORM = nesne-ilişkisel eşleme, migration = şema geçişi, relationship = ilişki, foreign key = yabancı anahtar","ef core sqlite migrations beginner relationships"],
  ["CRUD uçlarını tamamla","Doğru durum kodu API'nin dilidir: oluşturunca 201, silince 204, bulunamayınca 404, hatalı veride 400. Liste uçlarında sayfalama ve filtre baştan düşünülür.","Ticket için GET listesi (durum filtresi ile), GET id, POST, PUT, DELETE yaz. Hatalı durumlarda uygun kodları döndür. Swagger'dan hepsini dene.","5 uç ve doğru durum kodları","CRUD = oluştur-oku-güncelle-sil, pagination = sayfalama, filter = süzme","asp.net core crud api status codes 201 204 404"],
  ["Katmanlar ve Dependency Injection","Garson siparişi alır, mutfak pişirir, depo malzemeyi verir; kimse kendi malzemesini üretmez. Controller, Service, Repository ayrımı kodu değiştirilebilir ve test edilebilir yapar. DI nesneleri dışarıdan 'getirir'.","İş mantığını TicketService'e, veri erişimini repository'ye taşı. Interface tanımla ve DI ile bağla.","Katmanlı proje yapısı","dependency injection = bağımlılık enjeksiyonu, service = servis, interface = arayüz tanımı, layer = katman","asp.net core dependency injection service repository pattern simple"],
  ["Entegrasyon testleri","API'yi gerçek HTTP isteğiyle test edersin; test sunucusu bellekte ayağa kalkar. Her test temiz veritabanı ile başlar. Bu bölümde QA yolundaki API test mantığını kodun içinden uygularsın.","WebApplicationFactory ile 8 test yaz: oluşturma, okuma, güncelleme, silme, doğrulama hatası, bulunamadı, filtre, sayfalama.","8 geçen entegrasyon testi","integration test = entegrasyon testi, test server = test sunucusu, arrange-act-assert = hazırla-çalıştır-doğrula","asp.net core integration tests webapplicationfactory xunit"],
  ["Dokümantasyon ve CI","Başkası projeyi 5 dakikada çalıştırabilmeli. OpenAPI/Swagger, README ve CI birlikte güven verir. Her push'ta otomatik build ve test ile kırık kod görünür olur.","README'ye çalıştırma adımları, uç nokta tablosu ve örnek istekler ekle. GitHub Actions ile dotnet build + test çalıştır; rozeti README'ye koy.","Yeşil Actions çalışması ve README","documentation = dokümantasyon, CI = sürekli entegrasyon, build = derleme, badge = rozet","github actions dotnet build test workflow"]
  ]},
 {id:"bk3",lv:3,title:"Üretim Seviyesi Servis: Kimlik, PostgreSQL, Docker, CI/CD",weeks:8,tools:"ASP.NET Core, PostgreSQL, Docker Compose, JWT, Serilog, GitHub Actions, k6",
  why:"Junior ile mid arasındaki fark, kodun gerçek dünyaya hazır olmasıdır: güvenlik, hata yönetimi, performans, paketleme ve yayınlama.",
  outcome:["JWT ile rol bazlı kimlik doğrulama kurarsın","PostgreSQL, Docker ve CI/CD ile servisi paketleyip yayınlarsın","Loglama, performans ve güvenlik pratiklerini uygular, mülakatta anlatırsın"],
  pitch:"I built and deployed a production-style API with JWT authentication, PostgreSQL, Docker, CI/CD and structured logging.",
  steps:[
  ["Mimari ve veri şeması","Önce çiz sonra kodla. Gereksinimler, kullanıcı rolleri ve veri ilişkileri belli olmadan kod ev planı olmadan duvar örmek gibidir. ERD tabloları ve ilişkileri gösterir.","Akademi'deki Masa fikrini temel al: Kullanıcı, Ticket, Yorum, Etiket. ERD ve katman diyagramı çiz, 10 gereksinim yaz.","ERD, katman çizimi ve gereksinim listesi","requirement = gereksinim, ERD = varlık-ilişki diyagramı, architecture = mimari, scalability = ölçeklenebilirlik","entity relationship diagram software design beginners clean architecture"],
  ["PostgreSQL ve Docker ile veritabanı","Üretimde SQLite yerine sunucu veritabanı kullanılır. Docker, programı ve ihtiyaç duyduğu her şeyi bir kutuya koyar; 'bende çalışıyor' sorununu bitirir. Index sorguyu hızlandıran kitap dizinidir.","'docker compose' (boşluklu, güncel sürüm) ile PostgreSQL ayağa kaldır. EF Core'u PostgreSQL'e bağla, migration uygula. En çok sorgulanan alanlara index ekle.","Compose dosyası ve çalışan migration","container = konteyner, image = imaj, index = dizin, connection string = bağlantı cümlesi","docker compose postgres ef core npgsql migration"],
  ["Kimlik doğrulama ve yetkilendirme","Kimlik doğrulama 'kimsin', yetkilendirme 'neye hakkın var'. JWT imzalı bir bilet gibidir. Parola asla düz saklanmaz, yavaş ve tuzlu bir algoritmayla hash'lenir (ASP.NET Core Identity PasswordHasher, bcrypt ya da Argon2; düz SHA kullanma). Güvenlik yolundaki OWASP API Top 10 burada pratiğe döner.","Kayıt ve giriş uçları yaz. JWT üret ve doğrula. Roller: Admin, Agent, User. Sadece Agent'ın ticket kapatabildiği kuralı yaz ve test et.","Rollü çalışan 3 uç ve testleri","authentication = kimlik doğrulama, authorization = yetkilendirme, token = bilet, hash = özet","asp.net core jwt authentication roles password hashing"],
  ["Hata yönetimi ve loglama","Kullanıcı sistem hatasını ham haliyle görmemeli, sen ise tüm detayı log'da görmelisin. Global hata yakalayıcı standart bir cevap döner; yapılandırılmış log aranabilir olur. Correlation id bir isteğin her log satırındaki parmak izidir.","Global exception middleware ve ProblemDetails ekle. Serilog ile JSON log yaz, her isteğe correlation id ekle. Bilerek hata üret, log'da izini bul.","Standart hata cevabı ve log örneği","exception handling = hata yönetimi, structured logging = yapılandırılmış log, correlation id = izleme kimliği","asp.net core global exception handler problemdetails serilog"],
  ["Performans ve güvenlik pekiştirme","Yavaşlık kullanıcıyı kaybettirir. Sayfalama, süzme, gereksiz sorguları azaltma, önbellek ve hız sınırlama temel araçlardır. Güvenlikte girdi doğrulama, CORS, gizli bilgileri kodda saklamamak (ortam değişkeni).","Listeye sayfalama ve AsNoTracking ekle. Bir uçta önbellek ve rate limit kullan. Gizli anahtarı ortam değişkenine taşı. k6 ile önce/sonra yük testi yap.","Önce/sonra k6 sonucu","caching = önbellek, rate limiting = hız sınırlama, secret = gizli bilgi, benchmark = karşılaştırmalı ölçüm","asp.net core caching rate limiting pagination performance k6"],
  ["Test piramidi ve kapsama","Birim testler hızlı mantığı, entegrasyon testleri sistemi doğrular. Testcontainers gerçek PostgreSQL'i testte kısa süreliğine başlatır. Kapsama (coverage) bir hedef değil, kör noktaları gösteren ışıktır.","Servis katmanı için birim testler, API için Testcontainers ile entegrasyon testleri yaz. Coverage raporu çıkar, en riskli kapsanmayan yeri tamamla.","Test seti ve coverage raporu","coverage = kapsama, test pyramid = test piramidi, Testcontainers = test konteynerleri","testcontainers dotnet postgres integration tests coverage"],
  ["Docker imajı ve CI/CD","Çok aşamalı Dockerfile küçük ve güvenli imaj üretir. Pipeline: build, test, imaj, yayın. Kod main'e girince otomatik canlıya çıkması (CD) ekip hızını artırır.","Multi-stage Dockerfile yaz. GitHub Actions'ta build + test + imajı container registry'ye gönder. Ücretsiz katmanı ya da denemesi olan bir platforma (Render, Azure App Service F1, Railway denemesi vb.) otomatik yayın ayarla; koşullar değişebilir, güncel planı kontrol et.","Çalışan pipeline ve canlı adres","Dockerfile = imaj tarifi, registry = imaj deposu, deployment = yayınlama, environment variable = ortam değişkeni","dotnet multi stage dockerfile github actions deploy"],
  ["Canlıya al, portfolyo ve mülakat","Canlıdaki projeyi gösterebilmek en güçlü kanıttır. Sağlık ucu ve izleme canlıda neler olduğunu söyler. Mülakatta projeyi STAR (durum, görev, eylem, sonuç) ile anlatırsın.","Sağlık kontrolü, README, mimari diyagramı ve kısa demo videosu ekle. 'Tell me about a project you built' sorusuna 90 saniyelik İngilizce STAR cevabı yaz ve Mülakat sekmesinde sesli prova et.","Canlı adres, repo, İngilizce STAR cevabı","health check = sağlık kontrolü, deploy = yayına almak, STAR = durum-görev-eylem-sonuç","tell me about a project you built STAR answer software developer"]
  ]}
 ]}
